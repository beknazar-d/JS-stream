order: 2
title: "Что выведет код с остатками"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [преобразование типов, typeof, ==, ===, NaN]
show: [tests/snippet.js]
hints:
  - "Направление: посмотрите на каждый оператор отдельно. Минус и умножение работают с числами, а у плюса особое правило для строк."
  - "Шаг: Number() убирает пробелы по краям и превращает пустую строку в 0. Если в строке есть буквы, получится NaN. Оператор === не приводит типы."
  - "Почти решение: пять строк из шести — 25, 4015, number, NaN, 0. Последняя строка — результат сравнения строки и числа через ===."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верно только начало, остальные строки не заполнены. Предсказать нужно каждый вызов console.log, а не только первые три."
  - name: plus-adds
    kind: common-mistake
    explanation: "В строке 2 ответ 55 означает, что плюс сложил числа. Но \"40\" — строка, поэтому плюс склеил \"40\" и \"15\" в \"4015\"."
  - name: empty-is-nan
    kind: edge-case
    explanation: "В строке 5 ответ NaN. На самом деле пустая строка превращается в 0, а NaN дают только строки с посторонними символами."
