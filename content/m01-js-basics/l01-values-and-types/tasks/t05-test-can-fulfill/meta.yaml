order: 5
title: "Тесты для проверки остатка на складе"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, преобразование типов, граничные случаи, сравнение]
show: [subject/index.js]
hints:
  - "Направление: сначала проверьте обычные случаи, потом ищите границы. Где ответ меняется с true на false, и какие типы данных могут прийти кроме чисел?"
  - "Шаг: проверьте ровно весь остаток, запрос на ноль, на дробное число и на нечисловую строку. И отдельно проверьте строки: сравните, например, 9 и 10 в виде текста."
  - "Почти решение: кроме обычных случаев нужны проверки canFulfill(10, 10), canFulfill(0, 10), canFulfill(1.5, 10) и canFulfill('9', '10'), где ожидается true."
mutants:
  - name: strict-boundary
    description: "Знак сравнения \"меньше или равно\" заменён на \"меньше\", и запрос ровно на весь остаток отклоняется."
  - name: string-compare
    description: "Остаток и запрос сравниваются как есть, без превращения в числа. Две строки сравниваются как текст, и \"9\" оказывается больше \"10\"."
  - name: fraction-allowed
    description: "Пропала проверка на целое число. Дробное количество, например 1.5, считается допустимым."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Тесты проверяют только очевидные случаи, когда товара хватает и когда явно не хватает. Граница, дроби и строки не проверены, поэтому все три ошибки проходят незамеченными."
  - name: no-boundary
    kind: edge-case
    explanation: "Тесты проверяют строки, нули и дроби, но не проверяют ровно весь остаток. Ошибка со знаком меньше вместо меньше или равно остаётся незамеченной."
  - name: numbers-only
    kind: common-mistake
    explanation: "Тесты используют только числа, потому что их проще писать. Данные из форм приходят строками, и ошибка со строковым сравнением проходит незамеченной."
