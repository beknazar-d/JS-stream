order: 6
title: "Итог заказа из полей формы"
type: implement
role: real
difficulty: 3
minutes: 30
language: js
tags: [преобразование типов, Number, NaN, валидация, деньги, округление]
hints:
  - "Направление: сначала превратите все три поля в числа и отсейте некорректные значения, потом считайте. Деньги считайте в копейках, а не в дробных рублях."
  - "Шаг: price и quantity превращайте через Number() и проверяйте (конечное и больше нуля; целое и не меньше единицы). Для скидки пустая строка означает 0. Цену переведите в копейки через Math.round(price * 100)."
  - "Почти решение: после проверок вычислите Math.round(priceInKopecks * quantity * (100 - discount) / 100) и верните результат."
wrong:
  - name: no-validation
    kind: partial
    explanation: "Расчёт верный, но проверок входа нет. Для \"abc\" или пустого количества функция возвращает NaN вместо null, и NaN уходит на экран и в кассу."
  - name: parse-int-quantity
    kind: common-mistake
    explanation: "parseInt читает число из начала строки и молча игнорирует остаток. \"1.5\" превращается в 1, а \"3abc\" в 3, и вместо ошибки формы заказ создаётся с неверным количеством."
  - name: discount-range
    kind: edge-case
    explanation: "Скидка проверена на число, но не на диапазон. 101 процент даёт отрицательный итог, а минус один процент увеличивает цену. Скидка должна быть от 0 до 100."
