order: 4
title: "Разбор количества из поля формы"
type: implement
role: main
difficulty: 3
minutes: 20
language: js
tags: [преобразование типов, Number, NaN, валидация, typeof]
hints:
  - "Направление: сначала отсейте то, что вообще не строка (typeof). Потом подумайте, какие строки Number() превращает в число неожиданно, например пустую."
  - "Шаг: уберите пробелы по краям, пустой результат отбросьте. Дальше превратите строку в число и проверьте три вещи: это не NaN, число целое, оно не меньше нуля."
  - "Почти решение: проверьте typeof input !== 'string'; text = input.trim(); если text пустой, верните null; n = Number(text); верните null, если Number.isNaN(n), не Number.isInteger(n) или n меньше нуля; иначе верните n."
wrong:
  - name: partial-checks
    kind: partial
    explanation: "Решение отсеивает пустую строку и текст, но пропускает дробные и отрицательные значения. \"2.5\" и \"-3\" возвращаются как есть, хотя по тикету это null."
  - name: parse-int
    kind: common-mistake
    explanation: "parseInt читает число из начала строки и молча игнорирует остальное. Из \"3abc\" получается 3, а из \"2.5\" получается 2. Number() разбирает строку целиком и честно даёт NaN."
  - name: empty-is-zero
    kind: edge-case
    explanation: "Пустая строка и строка из пробелов превращаются в 0, а не в null, потому что Number(\"\") равно 0. Пустое поле перестало быть ошибкой и выглядит как \"убрать товар\"."
