- id: if-else-if
  front: 'Как записать цепочку: если A, то X, иначе если B, то Y, иначе Z?'
  back: 'if (A) { ... } else if (B) { ... } else { ... }. Проверки идут сверху вниз, сработает первая подходящая.'
- id: ternary
  front: 'Как записать выбор из двух значений одной строкой?'
  back: 'условие ? значение1 : значение2. Пример: isExpress ? "Экспресс" : "Обычная".'
- id: falsy-six
  front: 'Назовите шесть ложных (falsy) значений.'
  back: 'false, 0, "" (пустая строка), null, undefined, NaN. Всё остальное истинное, в том числе "0" и "false".'
- id: truthy-string-zero
  front: 'Истинна или ложна строка "0"?'
  back: 'Истинна. Непустая строка всегда истинна, даже "0" и "false".'
  answer: 'истинна'
- id: zero-trap
  front: 'Почему if (stock) плохо проверяет «остаток задан»?'
  back: 'Остаток 0 ложный, и ветка «нет данных» сработает для законного нуля. Сравнивайте явно: stock === 0, stock !== undefined.'
- id: switch-break
  front: 'Что будет с switch, если забыть break после case?'
  back: 'Выполнение провалится в следующий case. Ставьте break после каждого варианта.'
  answer: 'break'
- id: switch-strict
  front: 'Как switch сравнивает значение с case: строго или с приведением типов?'
  back: 'Строго, как ===. Строка "1" не совпадёт с case 1.'
  answer: '==='
- id: early-return
  front: 'Что такое ранний выход (early return)?'
  back: 'Проверка плохих случаев в начале функции и немедленный return. Основной код остаётся без вложенности.'
- id: assign-vs-compare
  front: 'Чем опасно if (stock = 0)?'
  back: 'Это присваивание, а не сравнение: stock станет 0, а условие окажется ложным. Для сравнения нужен ===.'
- id: no-return
  front: 'Что вернёт функция, если ни одно условие не сработало и return в конце нет?'
  back: 'undefined.'
  answer: 'undefined'
