order: 5
title: "Решение по возврату: перепишите вложенные условия"
type: refactor
role: main
difficulty: 3
minutes: 20
language: js
tags: [if, ранний выход, рефакторинг, граничные случаи]
hints:
  - "Направление: инвертируйте каждое условие. Вместо «если всё хорошо, то проверь следующее» пишите «если плохо, то сразу верни ответ»."
  - "Шаг: запись !(daysSincePurchase >= 0) срабатывает для NaN, undefined и отрицательных чисел. Порядок проверок: дата, блокировка, использованность, срок."
  - "Почти решение: последняя строка функции — return \"Возврат одобрен\"; перед ней проверка daysSincePurchase > 14."
wrong:
  - name: no-new-rule
    kind: partial
    explanation: "Функция переписана на ранние выходы, но новое правило про некорректную дату не добавлено. Отрицательные дни по-прежнему одобряют возврат."
  - name: wrong-order
    kind: common-mistake
    explanation: "Проверка использованности стоит выше проверки блокировки. Для заблокированного покупателя с использованным товаром ответ становится «Товар использован» вместо «Аккаунт заблокирован». При переписывании порядок проверок должен сохраниться."
  - name: boundary-14
    kind: edge-case
    explanation: "Срок записан как daysSincePurchase >= 14, поэтому на 14-й день возврат уже отклоняется. В правилах «больше 14 дней», значит, 14-й день ещё в сроке."
