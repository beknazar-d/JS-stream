order: 4
title: "Стоимость доставки по зоне, весу и сумме"
type: implement
role: main
difficulty: 3
minutes: 20
language: js
tags: [if, else if, switch, ранний выход, граничные случаи]
hints:
  - "Направление: пройдите по правилам из тикета сверху вниз и каждое превратите в блок. Сначала отсекайте невозможные случаи через return null, потом считайте цену."
  - "Шаг: вес проверяйте условием «не больше нуля или не число»: запись !(weightKg > 0) срабатывает и для NaN. Базовую цену по зоне выберите через switch и в default сразу верните null."
  - "Почти решение: после switch проверьте orderSum >= 5000 и верните 0, затем заведите надбавку и выберите её через if (weightKg > 25) ... else if (weightKg > 10) ..., в конце верните сумму базовой цены и надбавки."
wrong:
  - name: no-surcharge
    kind: partial
    explanation: "Надбавка за вес не учитывается. Зона, бесплатная доставка и неверный ввод работают, но тяжёлая посылка стоит как лёгкая."
  - name: switch-without-break
    kind: common-mistake
    explanation: "В switch нет break, поэтому цена проваливается через все case и для любой зоны получается 600. Неизвестная зона тоже не отсекается."
  - name: weight-boundary
    kind: edge-case
    explanation: "Для надбавки +100 использовано weightKg >= 10, поэтому посылка ровно в 10 кг платит надбавку. В тикете сказано «свыше 10 кг»."
