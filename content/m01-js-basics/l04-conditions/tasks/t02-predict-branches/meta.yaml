order: 2
title: "Какая ветка сработает"
type: predict
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [if, switch, break, истинные и ложные значения, тернарный оператор]
show: [tests/snippet.js]
hints:
  - "Направление: сначала выпишите шесть ложных значений. Потом для каждого вызова решите, в какую ветку попало значение."
  - "Шаг: непустая строка всегда истинна, даже \"0\". В switch посмотрите, где стоит break: без него выполнение идёт дальше в следующий case."
  - "Почти решение: первые четыре строки — ложь, истина, ложь, ложь. Для зоны A выполнятся две строки case и остановится на break. Последняя строка — ветка «да» тернарного оператора."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верно только начало, остальные строки не заполнены. Предсказать нужно каждый вызов console.log, а не только первые четыре."
  - name: zero-string-is-false
    kind: edge-case
    explanation: "Во второй строке ответ «ложь» означает, что строку \"0\" считали ложной. Но непустая строка всегда истинна, даже если в ней один ноль."
  - name: no-fallthrough
    kind: common-mistake
    explanation: "В пятой строке ответ 1 означает, что case \"A\" закончил работу сам. Но после days = 1 нет break, и выполнение провалилось в case \"B\", где days стало 2."
