order: 4
title: Приёмочные тесты для промокодов
type: write-tests
role: main
difficulty: 3
minutes: 25
language: js
tags: [проект P1, тесты, скидки, граничные случаи, округление]
show: [subject/index.js]
hints:
  - "Направление: перечитайте ТЗ как список правил и под каждое напишите тест. Особое внимание правилам со словами «от», «в любом регистре» и «округляются»."
  - "Шаг: для округления нужна сумма, при которой десять процентов дают ровно половину копейки, например 105 копеек. Для порога возьмите ровно 200000 и 199999. Для регистра попробуйте ' sale10 '."
  - "Почти решение: applyPromo(105, 'SALE10') равно 11, applyPromo(200000, 'MINUS500') равно 50000, applyPromo(199999, 'MINUS500') выбрасывает ошибку, applyPromo(10000, ' sale10 ') равно 1000."
mutants:
  - name: rounds-down
    description: "Скидка SALE10 округляется вниз, а не по правилу «половина вверх». На 105 копейках получается 10, а не 11."
  - name: no-threshold
    description: "Порог 2 000 рублей для MINUS500 пропал. Скидка в 500 рублей применяется к любому заказу."
  - name: case-sensitive
    description: "Пробелы и регистр не нормализуются. Код sale10 или код с пробелами считается неизвестным."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверены только аккуратные случаи: круглые суммы и верный регистр. Округление, порог и регистр не проверены, поэтому ни одна из ошибок не поймана."
  - name: no-half-kopeck
    kind: edge-case
    explanation: "Порог, регистр и ошибки проверены, но суммы для SALE10 берутся круглые, где округление не нужно. Версия, которая округляет вниз, остаётся незамеченной."
  - name: uppercase-only
    kind: common-mistake
    explanation: "Все промокоды в тестах написаны так, как их придумал разработчик: заглавными и без пробелов. Покупатель же вводит «sale10 » с пробелом, и версия без нормализации проходит тесты."
