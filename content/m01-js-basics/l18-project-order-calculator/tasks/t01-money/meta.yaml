order: 1
title: Деньги в копейках
type: implement
role: warmup
difficulty: 3
minutes: 20
language: js
tags: [проект P1, копейки, строки, ValidationError, форматирование]
hints:
  - "Направление: разберите текст на рубли и копейки как на две строки, а не как на одно дробное число. Копейки считайте целыми числами."
  - "Шаг: замените запятую на точку и проверьте формат регулярным выражением /^\\d+(\\.\\d{1,2})?$/. Разделите по точке. Если копейки записаны одной цифрой, их нужно дополнить нулём справа (padEnd), иначе 5 превратится в 5 копеек вместо 50."
  - "Почти решение: Number(рубли) * 100 + Number(копейки.padEnd(2, '0')). Для форматирования копейки дополняйте нулём слева через padStart, а рубли делите на группы по три цифры с конца."
wrong:
  - name: no-padding
    kind: common-mistake
    explanation: "Копейки не дополняются нулём справа. Строка «1200.5» превращается в 1200 рублей 5 копеек (120005) вместо 50 копеек. Это самая частая ошибка разбора денег."
  - name: no-grouping
    kind: partial
    explanation: "formatMoney выводит «1200,50 ₽» без пробела между разрядами. По ТЗ тысячи нужно разделять пробелом, поэтому большие суммы выглядят неправильно."
  - name: no-comma
    kind: edge-case
    explanation: "Принимается только точка. Покупатели в России пишут «1200,5» с запятой, и такая цена отклоняется как неверная."
