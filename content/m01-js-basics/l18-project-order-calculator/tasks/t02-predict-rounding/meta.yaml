order: 2
title: Что выведет код с округлением денег
type: predict
role: warmup
difficulty: 4
minutes: 12
language: js
tags: [проект P1, округление, Math.round, toFixed, числа с плавающей точкой]
show: [tests/snippet.js]
hints:
  - "Направление: компьютер хранит дроби в двоичном виде, и многие десятичные дроби в нём записываются с хвостом. Math.round округляет половину вверх, то есть в сторону плюс бесконечности."
  - "Шаг: 19.99 * 100 не равно 1999 точно, но Math.round вернёт 1999. У Math.round(-2.5) ответ -2, у Math.round(2.5) ответ 3. Метод toFixed возвращает строку и работает с тем числом, которое хранится на самом деле."
  - "Почти решение: 0.30000000000000004, 1998.9999999999998, 1999, 3 -2, 11, 1.00, затем 1 и две последние строки с 299.85 и 300."
wrong:
  - name: toFixed-rounds
    kind: common-mistake
    explanation: "В шестой строке ответ 1.01. Число 1.005 в памяти чуть меньше 1.005, поэтому toFixed(2) даёт 1.00. Аналогично Math.round(1.005 * 100) / 100 даёт 1, а не 1.01."
  - name: float-exact
    kind: edge-case
    explanation: "Во второй строке ответ 1999. Число 19.99 хранится приближённо, и произведение 19.99 * 100 равно 1998.9999999999998. Именно поэтому деньги умножают на сто и обязательно округляют."
  - name: half
    kind: partial
    explanation: "Выписана только половина вывода. Предсказать нужно каждый console.log."
