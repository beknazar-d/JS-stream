order: 3
title: Корзина меняет историю и теряет копейки
type: fix-bug
role: warmup
difficulty: 3
minutes: 15
language: js
tags: [проект P1, корзина, иммутабельность, копейки, проверка входа]
hints:
  - "Направление: в cart.js три разных проблемы: изменение данных на месте, подсчёт в дробных рублях и отсутствие проверок. Исправляйте по одной, запуская тесты."
  - "Шаг: для суммы уберите деление на сто: цена уже в копейках, сумма цены на количество целая. Для addItem соберите новый массив через map (для существующего sku) или через spread (для нового). Проверки добавьте в начало функции."
  - "Почти решение: проверки qty и price в начале; затем cart.some для поиска sku; cart.map((line) => line.sku === sku ? { ...line, qty: line.qty + qty } : line) или [...cart, { sku, name, price, qty }]; subtotal через reduce."
wrong:
  - name: subtotal-only
    kind: partial
    explanation: "Сумма исправлена, а addItem по-прежнему меняет корзину на месте и не проверяет вход. Задание требует исправить все три проблемы."
  - name: shallow-merge
    kind: common-mistake
    explanation: "Массив скопирован, но количество увеличивается в том же объекте строки (line.qty += qty). Новая корзина верна, но строка в старой корзине тоже изменилась: копия массива не копирует объекты внутри."
  - name: no-validation
    kind: edge-case
    explanation: "Корзина больше не меняется на месте и сумма верна, но проверок нет. Количество 0, -3 и 1.5 и дробная цена принимаются молча."
