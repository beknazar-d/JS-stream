- id: money-in-kopecks
  front: В каком виде хранить деньги в расчётах и почему?
  back: "Целыми копейками. Дробные рубли дают хвосты: 4.35 * 100 равно 434.99999999999994. Рубли получают только при показе."
- id: round-rule
  front: Какое округление в проекте и где его делать?
  back: "Math.round (половина вверх), один раз на каждую скидку или налог, в целые копейки. Правило округления записывают в ТЗ."
  answer: Math.round
- id: order-of-calc
  front: В каком порядке считается заказ в проекте?
  back: "Сумма корзины, скидка за количество, промокод от суммы после неё, сумма товаров, доставка по этой сумме, итог, НДС от итога."
- id: vat-included
  front: Как посчитать НДС 20%, уже входящий в цену?
  back: "Math.round(amount * 20 / 120). Это не amount * 0.2: налог входит в сумму, а не прибавляется к ней."
- id: threshold-inclusive
  front: Бесплатная доставка «от 3 000 рублей». Какое сравнение?
  back: "goods >= 300000, включительно. Проверьте границы: на копейку ниже и ровно порог."
- id: change-request
  front: Что делать, когда заказчик добавляет правило посреди работы?
  back: "Записать порядок вычислений, добавить правило, не меняя старые поля, и прогнать старые тесты: корзины без нового случая должны считаться как раньше."
- id: acceptance-tests
  front: Чем приёмочные тесты отличаются от проверки «вроде работает»?
  back: "Каждое правило ТЗ записано тестом с точными числами, включая границы. По ним заказчик и разработчик одинаково понимают задачу."
- id: no-mutation
  front: Почему расчёт не должен менять корзину?
  back: "Корзина — исходные данные. Если расчёт правит её, повторный расчёт даст другой результат, а интерфейс покажет другие цены."
- id: readme-parts
  front: Что должно быть в README проекта?
  back: "Что делает проект, как запустить тесты, пример вызова с результатом, список правил и допущений."
