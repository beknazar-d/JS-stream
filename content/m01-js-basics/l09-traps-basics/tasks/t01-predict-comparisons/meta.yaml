order: 1
title: "Что выведут сравнения и сложение"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: ["==", "===", "NaN", "плюс со строками", "сравнение строк"]
show: [tests/snippet.js]
hints:
  - "Направление: идите по строкам по одной. Для каждого сравнения решите, приводит оператор типы или нет. Для плюса посмотрите, есть ли рядом строка."
  - "Шаг: плюс выполняется слева направо. После того как слева появилась строка, дальше всё склеивается. Строки сравниваются как текст по символам. NaN не равен ничему, даже себе, а любая арифметика с ним даёт NaN."
  - "Почти решение: первые три строки — true, true, false. Дальше склейка даёт 532 и 82. Сравнение строк «10» и «9» — true. Последние две строки: false и NaN."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верны только первые четыре строки, остальные не заполнены. Предсказать нужно каждый вызов console.log, включая сложение в другом порядке и сравнение строк."
  - name: plus-left-to-right
    kind: common-mistake
    explanation: "В пятой строке ответ 532: так было бы, если бы строка склеивалась со всем выражением сразу. Но плюс идёт слева направо: сначала 5 + 3 даёт число 8, и только потом 8 + \"2\" склеивается в \"82\"."
  - name: numeric-string-compare
    kind: edge-case
    explanation: "В шестой строке ответ false: так было бы при сравнении чисел. Но \"10\" и \"9\" — строки, они сравниваются как текст посимвольно: символ \"1\" меньше символа \"9\", поэтому результат true."
