order: 3
title: "Что выведут запасные значения"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: ["??", "||", "ложные значения", "NaN"]
show: [tests/snippet.js]
hints:
  - "Направление: выпишите для каждого значения, считается ли оно ложным. Ложные значения: 0, пустая строка, NaN, null, undefined, false."
  - "Шаг: оператор || берёт правую часть, если левая ложная. Оператор ?? берёт правую часть, только если левая null или undefined. Цепочка || идёт слева направо и останавливается на первом истинном значении."
  - "Почти решение: первые две строки — 10 и 0. Дальше «нет заметки» и пустые квадратные скобки: пустая строка не null, поэтому ?? её оставит. Последняя строка — «запасной»."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верны только первые четыре строки, остальные не заполнены. Предсказать нужно каждый вызов console.log, включая цепочки операторов."
  - name: nullish-replaces-empty
    kind: common-mistake
    explanation: "В четвёртой строке ответ [нет заметки]: так было бы с оператором ||. Но здесь стоит ??, а пустая строка не null и не undefined, поэтому она остаётся, и в скобках пусто."
  - name: nullish-replaces-nan
    kind: edge-case
    explanation: "В седьмой строке ответ 1: так было бы с ||. Оператор ?? заменяет только null и undefined, а NaN остаётся как есть и выводится как NaN."
