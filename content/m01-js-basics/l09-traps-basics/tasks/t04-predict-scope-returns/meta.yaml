order: 4
title: "Что вернут функции с ловушками"
type: predict
role: main
difficulty: 4
minutes: 15
language: js
tags: ["затенение", "ASI", "стрелочные функции", "замыкание", "область видимости"]
show: [tests/snippet.js]
hints:
  - "Направление: разберите каждый вызов отдельно. Для переменных с одинаковым именем определите, какая из них видна в этом месте. Для return посмотрите, где находится значение: на той же строке или на следующей."
  - "Шаг: внутри priceWithMargin видна своя rate, внешняя не меняется. После return с переносом функция возвращает undefined. Стрелка с фигурными скобками без return тоже. Параметр status внутри changeStatus — копия, внешняя status не меняется."
  - "Почти решение: первые две строки — 1500 и 0.2. Потом два undefined и 300. Блок со своей count не затрагивает внешнюю, а вызов changeStatus не меняет внешний статус. Последняя строка — 15."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верны только первые четыре строки, остальные не заполнены. Предсказать нужно каждый вызов console.log, включая блоки, параметры и замыкание."
  - name: return-newline-works
    kind: common-mistake
    explanation: "В третьей строке ответ 300. Но после return стоит перенос строки: JavaScript сам ставит точку с запятой, функция возвращает undefined, а умножение на следующей строке никогда не выполняется."
  - name: shadow-changes-outer
    kind: edge-case
    explanation: "В шестой строке ответ 3 и в седьмой отправлен: так было бы, если бы присваивание внутри блока или функции меняло внешнюю переменную. Но там объявлена новая переменная (блок) или параметр (функция), а внешние остаются прежними: 1 и «новый»."
