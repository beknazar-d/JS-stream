order: 1
title: "Очередь заказов: добавить, взять, посмотреть"
type: recall
role: warmup
difficulty: 1
minutes: 8
language: js
tags: [массивы, push, shift, at]
hints:
  - "Направление: новый заказ встаёт в конец очереди, а берут заказ с начала. Вспомните, какой метод добавляет в конец и какой убирает из начала."
  - "Шаг: push добавляет в конец и возвращает новую длину. shift убирает первый элемент и возвращает его. Последний элемент не удаляя читает at(-1)."
  - "Почти решение: для пустой очереди shift и at(-1) дают undefined. Нужен null: добавьте в конец выражения оператор ?? null."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Написаны только addOrder и takeNextOrder. Функция lastOrder не заполнена и возвращает undefined, поэтому последний заказ прочитать нельзя."
  - name: pop-instead-of-shift
    kind: common-mistake
    explanation: "Для выдачи заказа использован pop. Он берёт заказ с конца, то есть самый новый, а не первый в очереди. Очередь превращается в стопку."
  - name: empty-undefined
    kind: edge-case
    explanation: "На пустой очереди shift и at(-1) возвращают undefined. По условию в этом случае нужен null, и тест на пустую очередь это замечает."
