order: 5
title: "Тесты для выдачи заказов из очереди"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, массивы, slice, мутации, граничные случаи]
show: [subject/index.js]
hints:
  - "Направление: функция возвращает два массива и не должна трогать исходный. Подумайте, что можно сломать в каждом из трёх мест: в taken, в rest и в самой очереди."
  - "Шаг: проверьте обычный случай, взять ноль заказов, взять больше, чем есть, взять отрицательное число. И отдельно убедитесь, что массив queue после вызова равен себе до вызова."
  - "Почти решение: сохраните копию очереди до вызова (queue.slice()) и сравните с ней после. Проверьте takeFromQueue(queue, -2): taken должен быть пустым, а rest содержать всю очередь."
mutants:
  - name: mutates-input
    description: "Заказы вырезаются из очереди через splice. Результат тот же, но переданная очередь опустела."
  - name: negative-count
    description: "Отрицательное количество не обнуляется: slice(0, -1) берёт «все, кроме последнего», вместо пустого набора."
  - name: off-by-one-rest
    description: "Остаток считается с индекса на единицу больше: первый заказ после выданных теряется."
wrong:
  - name: taken-only
    kind: partial
    explanation: "Тесты смотрят только на taken. Остаток, отрицательные числа и состояние очереди не проверены, поэтому все три ошибки остаются незамеченными."
  - name: no-negative
    kind: edge-case
    explanation: "Тесты проверяют taken, rest и неизменность очереди, но не пробуют отрицательное количество. Ошибка с slice(0, -1) проходит незамеченной."
  - name: no-input-check
    kind: common-mistake
    explanation: "Тесты сравнивают только то, что функция вернула. Но функция, которая вырезает заказы из переданной очереди, возвращает те же значения. Мутацию видно, только если проверить очередь после вызова."
