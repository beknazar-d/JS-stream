order: 6
title: "План смены: срочные заказы вперёд"
type: implement
role: real
difficulty: 4
minutes: 25
language: js
tags: [массивы, includes, push, slice, мутации]
hints:
  - "Направление: сначала разложите заказы очереди по двум спискам: срочные и обычные. Потом склейте списки в нужном порядке и разрежьте по размеру смены. Дубли отбрасывайте уже при раскладке."
  - "Шаг: обойдите queue через for...of. Если номер уже есть в одном из двух списков (includes), пропустите его через continue. Иначе, в зависимости от urgent.includes(orderId), добавьте его в нужный список через push."
  - "Почти решение: после цикла переложите обычные заказы в конец списка срочных через ещё один for...of и push. Затем batch = plan.slice(0, capacity), left = plan.slice(capacity)."
wrong:
  - name: no-dedupe
    kind: partial
    explanation: "Срочные заказы идут вперёд, но дубли не убираются. Если заказ завели дважды, он попадает в план два раза, и склад соберёт его дважды."
  - name: foreign-urgent
    kind: edge-case
    explanation: "После раскладки в срочные добавляются все номера из urgent. Срочные номера, которых нет в очереди, попадают в смену, хотя собирать там нечего."
  - name: empties-queue
    kind: common-mistake
    explanation: "Заказы берутся из очереди через shift, и очередь по ходу работы опустошается. План получается правильным, но queue после вызова пуста, а отчёт строится по ней."
