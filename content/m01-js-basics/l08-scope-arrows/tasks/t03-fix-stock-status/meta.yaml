order: 3
title: "Статус наличия не показывается"
type: fix-bug
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [область видимости, let, const, блоки, ReferenceError]
hints:
  - "Направление: где объявлена переменная status и где она используется? Сравните область, в которой она живёт, с местом, где её читают."
  - "Шаг: переменная, объявленная через const внутри фигурных скобок, снаружи не видна. Объявите status до if / else if / else, а в ветках только присваивайте значение."
  - "Почти решение: let status; if (stock > 10) { status = \"В наличии\"; } else if (stock > 0) { status = \"Мало\"; } else { status = \"Нет в наличии\"; } return status;"
wrong:
  - name: only-out-of-stock
    kind: partial
    explanation: "Переменная объявлена снаружи со значением «В наличии», а присваивание есть только в ветке отсутствия. Для остатка от 1 до 10 функция говорит «В наличии» вместо «Мало»."
  - name: boundary-ten
    kind: edge-case
    explanation: "Условие stock >= 10 относит остаток ровно 10 к «В наличии», хотя по правилам это «Мало». Граница включается в нижний диапазон."
  - name: still-shadowed
    kind: common-mistake
    explanation: "Снаружи объявлена let status, но внутри веток по-прежнему стоит const status. Это новые переменные, которые закрывают внешнюю. Внешняя так и остаётся пустой строкой, и функция всегда возвращает её."
