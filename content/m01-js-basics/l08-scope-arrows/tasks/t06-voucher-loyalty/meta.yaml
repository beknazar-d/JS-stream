order: 6
title: "Фабрики для акции: купоны и бонус"
type: implement
role: real
difficulty: 4
minutes: 30
language: js
tags: [замыкание, стрелочные функции, значения по умолчанию, преобразование типов, NaN, строки]
hints:
  - "Направление: обе функции создают и возвращают другую функцию. Подумайте, какие переменные должны жить внутри замыкания и какие значения приходят при каждом вызове. В выдавателе кодов каждый вызов фабрики должен получить свой счётчик."
  - "Шаг: в createVoucherIssuer заведите let next = startFrom и возвращайте стрелку, которая формирует код из текущего значения и затем увеличивает next. Номер дополните нулями через String(number).padStart(4, \"0\"). В калькуляторе превратите ввод через Number(), отсейте NaN и значения не больше нуля, потом сравните с порогом."
  - "Почти решение: const issue = () => { const code = `${prefix}-${String(next).padStart(4, \"0\")}`; next++; return code; }; в калькуляторе: const amount = Number(amountText); if (Number.isNaN(amount) || amount <= 0) { return null; } return amount >= threshold ? amount - (amount * percent) / 100 : amount;"
wrong:
  - name: discount-for-everyone
    kind: partial
    explanation: "Калькулятор применяет скидку к любой сумме и не сравнивает её с порогом. Заказ на 4999 рублей получает скидку, хотя порог 5000."
  - name: strict-threshold
    kind: edge-case
    explanation: "Сравнение написано со знаком больше, а не больше или равно. Заказ ровно на пороговую сумму (5000) скидку не получает, хотя по тикету порог включительно."
  - name: shared-counter
    kind: common-mistake
    explanation: "Номер хранится в переменной на уровне модуля, и все выдаватели используют одну и ту же нумерацию. Кампания SPRING, созданная после WINTER, продолжает счёт с чужого номера."
