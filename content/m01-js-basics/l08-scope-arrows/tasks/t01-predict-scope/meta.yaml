order: 1
title: "Какие значения видят переменные"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [область видимости, затенение, замыкание, стрелочные функции]
show: [tests/snippet.js]
hints:
  - "Направление: для каждой переменной определите, в какой области она объявлена. Внутри блока или функции новая переменная с тем же именем — это другая переменная."
  - "Шаг: каждый вызов makeCounter создаёт свою переменную count. Стрелка с фигурными скобками без return возвращает undefined. Внешние discount и stock не меняются, пока работаете с затенёнными копиями."
  - "Почти решение: первые четыре строки — 750, 10, 99, 5. Дальше счётчик a даёт 1 и 2, а b начинает с 1. Последние две строки — undefined и 8."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верны только первые четыре строки, остальные не заполнены. Предсказать нужно каждый вызов console.log, включая счётчики и стрелочные функции."
  - name: shared-counter
    kind: edge-case
    explanation: "В седьмой строке ответ 3: так было бы, если бы a и b делили одну переменную count. Но каждый вызов makeCounter создаёт новую count, поэтому b начинает с единицы."
  - name: shadow-changes-outer
    kind: common-mistake
    explanation: "Во второй строке ответ 25 и в четвёртой 99: ответ считает, что присваивание внутри функции или блока меняет внешнюю переменную. Но внутри объявлена новая переменная с тем же именем, и внешняя остаётся прежней."
