- id: block-scope
  front: Где видна переменная, объявленная через let или const внутри фигурных скобок блока?
  back: "Только в этом блоке и в блоках, вложенных в него. Снаружи будет ReferenceError: ... is not defined."
- id: outer-visible
  front: Видит ли вложенная функция переменные внешней области?
  back: "Да. Внутренняя область видит внешние, внешняя внутренние не видит."
  answer: Да
- id: lookup
  front: В каком порядке JavaScript ищет имя переменной?
  back: "Сначала в текущей области, потом в окружающей, и так наружу до файла. Нашёл ближайшее — дальше не ищет."
- id: shadowing
  front: Что такое затенение (shadowing)?
  back: "Внутренняя переменная с тем же именем закрывает внешнюю. Внешняя не меняется, внутри её просто не видно."
- id: shadow-tdz
  front: Какая ошибка будет, если прочитать переменную до её let/const в той же области?
  back: "ReferenceError: Cannot access 'x' before initialization. Затенённая внешняя переменная не помогает."
- id: arrow-short
  front: Как записать функцию умножения цены на 1.2 стрелкой в одну строку?
  back: "const vat = (price) => price * 1.2;"
- id: arrow-implicit
  front: Когда стрелка возвращает значение сама, без return?
  back: "Когда после => стоит выражение без фигурных скобок. Если есть фигурные скобки, нужен return."
- id: arrow-braces
  front: Что вернёт (price) => { price * 1.2 }?
  back: "undefined. Фигурные скобки без return — результат потерян."
  answer: undefined
- id: arrow-no-params
  front: Как записать стрелку без параметров, которая возвращает 0?
  back: "() => 0. Скобки при отсутствии параметров обязательны."
- id: closure
  front: Что такое замыкание (closure)?
  back: "Функция плюс переменные из места, где она создана. Они остаются живыми, даже когда внешняя функция уже завершилась. Так делают счётчики со скрытым состоянием."
