<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="16" fill="currentColor">
  <title id="t">Один момент времени и разные часовые пояса</title>
  <desc id="d">Date хранит один момент времени как число миллисекунд. Из него получаются разные записи: по UTC это 5 марта 00:00, по Нью-Йорку это 4 марта 19:00, по Токио это 5 марта 09:00. Поэтому методы без UTC в названии дают разный день на разных компьютерах.</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="200" y="20" width="240" height="64" rx="10"/>
    <rect x="20" y="170" width="180" height="84" rx="10"/>
    <rect x="230" y="170" width="180" height="84" rx="10"/>
    <rect x="440" y="170" width="180" height="84" rx="10"/>
    <path d="M280 84 L110 170 M320 84 V170 M360 84 L530 170"/>
  </g>

  <g text-anchor="middle">
    <text x="320" y="48" font-weight="700">один момент</text>
    <text x="320" y="70" font-size="14" font-family="ui-monospace, monospace">1741132800000 мс</text>
    <text x="110" y="198" font-weight="700">Нью-Йорк</text>
    <text x="110" y="222" font-size="14">4 марта, 19:00</text>
    <text x="110" y="242" font-size="13" opacity="0.8">getDate() даёт 4</text>
    <text x="320" y="198" font-weight="700">UTC</text>
    <text x="320" y="222" font-size="14">5 марта, 00:00</text>
    <text x="320" y="242" font-size="13" opacity="0.8">getUTCDate() даёт 5</text>
    <text x="530" y="198" font-weight="700">Токио</text>
    <text x="530" y="222" font-size="14">5 марта, 09:00</text>
    <text x="530" y="242" font-size="13" opacity="0.8">getDate() даёт 5</text>
  </g>
</svg>
