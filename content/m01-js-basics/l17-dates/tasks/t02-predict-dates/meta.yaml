order: 2
title: Что выведет код с датами
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [Date, месяцы с нуля, сравнение дат, Invalid Date, UTC]
show: [tests/snippet.js]
hints:
  - "Направление: вспомните, с какого числа нумеруются месяцы, и что происходит, если день выходит за границу месяца. Ещё отдельно подумайте, как сравниваются объекты."
  - "Шаг: январь — это 0. Несуществующий день переносится на следующий месяц. Оператор === для двух разных объектов Date всегда даёт false, а сравнение времени через getTime даёт число."
  - "Почти решение: первые две строки — 0 и 2025-01-31T23:30:00.000Z, затем 2025-02-01 и 2025-03-01. Разница дат равна 86400000, а последние три строки — false, true, true."
wrong:
  - name: month-from-one
    kind: common-mistake
    explanation: "В первой строке ответ 1. Месяцы в Date считаются с нуля, январь имеет номер 0."
  - name: feb-29
    kind: edge-case
    explanation: "В четвёртой строке ответ 2025-02-29. В 2025 году 28 дней в феврале, поэтому Date.UTC(2025, 1, 29) переносит дату на 1 марта."
  - name: half
    kind: partial
    explanation: "Выписана только половина вывода. Предсказать нужно каждый console.log."
