order: 6
title: График доставки для диспетчера
type: implement
role: real
difficulty: 4
minutes: 35
language: js
tags: [Date, Intl.DateTimeFormat, UTC, sort, try/catch, рабочие дни, модули]
hints:
  - "Направление: разделите работу на шаги для одного заказа: разобрать дату, посчитать срок, собрать запись. Плохой заказ пропускайте в цикле, записывая причину."
  - "Шаг: чтобы сравнивать дни, а не моменты, приведите сегодняшнюю дату к полуночи UTC через Date.UTC(год, месяц, день), как и дату создания. Разницу в миллисекундах делите на 86400000. Форматтер Intl создайте один раз снаружи цикла. Сортировку пишите компаратором со строками deliverBy и числами id."
  - "Почти решение: const daysLeft = Math.round((deliverBy.getTime() - todayStart.getTime()) / DAY); addWorkingDays может выбросить ошибку, поэтому оберните её вызов в try/catch и в catch запишите error.message в errors."
wrong:
  - name: no-sort
    kind: partial
    explanation: "Записи остаются в порядке входного списка. Диспетчеру нужны самые срочные заказы сверху, поэтому порядок нарушает требование."
  - name: compares-timestamps
    kind: edge-case
    explanation: "Разница считается между полуночью дня доставки и точным временем «сейчас». В день доставки после полуночи получается минус треть суток, округление вниз даёт минус один день, и заказ ошибочно считается просроченным."
  - name: crash-on-invalid
    kind: common-mistake
    explanation: "Дата заказа не проверяется. Invalid Date доезжает до toISOString, и функция падает с RangeError: Invalid time value. Один испорченный заказ ломает весь список."
