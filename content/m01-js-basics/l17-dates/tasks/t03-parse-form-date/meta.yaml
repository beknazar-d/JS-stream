order: 3
title: Дата доставки из формы сдвигается
type: fix-bug
role: warmup
difficulty: 3
minutes: 12
language: js
tags: [Date, Date.UTC, месяцы с нуля, проверка даты, строки из формы]
hints:
  - "Направление: в старом коде две проблемы с месяцем и одна с недопустимыми датами. Сначала разберитесь с месяцем, потом подумайте, как узнать, что дата настоящая."
  - "Шаг: части текста нужно превратить в числа, а месяц уменьшить на единицу. Несуществующая дата переносится Date на соседний месяц, значит, после создания можно сравнить день и месяц в результате с исходными."
  - "Почти решение: const date = new Date(Date.UTC(year, month - 1, day)); верните date, только если date.getUTCDate() === day и date.getUTCMonth() === month - 1 и date.getUTCFullYear() === year; иначе null."
wrong:
  - name: no-invalid-check
    kind: partial
    explanation: "Месяц исправлен, но дата не проверяется. Для 'abc' возвращается Invalid Date, а для 31.02.2025 дата 3 марта, а не null."
  - name: month-not-decremented
    kind: common-mistake
    explanation: "Месяц передан в Date.UTC без вычитания единицы. 05.03.2025 превращается в 5 апреля. Все проверки на «настоящую дату» при этом тоже сравнивают неверный месяц."
  - name: no-rollover-check
    kind: edge-case
    explanation: "Проверяются только нечисловые вводы (Invalid Date). Несуществующие дни вроде 31.04.2025 и 29.02.2025 Date молча переносит на следующий месяц, и функция возвращает неверную дату вместо null."
