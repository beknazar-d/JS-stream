order: 5
title: Тесты для срока действия промокода
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, Date, граничные случаи, UTC, toThrow]
show: [subject/index.js]
hints:
  - "Направление: ошибки в датах почти всегда сидят на границе. Подумайте, какие два момента времени отличаются на одну миллисекунду, но дают разный ответ."
  - "Шаг: возьмите последний день действия, проверьте его начало и самый конец, а потом начало следующего дня. Отдельно проверьте дату в прошлом, далёкое будущее и текст вместо даты."
  - "Почти решение: нужны проверки isExpired('2025-03-05', new Date('2025-03-05T00:00:00.000Z')) равно false, с временем 23:59:59.999Z тоже false, с временем 2025-03-06T00:00:00.000Z равно true, и toThrow для 'abc'."
mutants:
  - name: exclusive-end
    description: "Промокод считается истёкшим с начала последнего дня, а не с начала следующего. Утром в последний день он уже не работает."
  - name: extra-day
    description: "Промокод живёт ещё сутки после последнего дня. Первого числа после окончания он ещё действует."
  - name: invalid-ignored
    description: "Проверка формата даты пропала. Для текста вместо даты функция молча отвечает «не истёк»."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверены только середина действия и далёкое прошлое. Границы суток и ошибка формата не проверены, поэтому ни один мутант не пойман."
  - name: no-day-boundary
    kind: edge-case
    explanation: "Проверены даты далеко до и после окончания и текст вместо даты, но моменты вокруг границы суток нет. Версии, которые гасят код на сутки раньше или позже, остаются незамеченными."
  - name: uses-current-date
    kind: common-mistake
    explanation: "Тест берёт текущее время компьютера и строит даты «вчера» и «завтра». Он проходит, но границу проверить не может, а ещё его результат зависит от момента запуска. Время нужно задавать явно."
