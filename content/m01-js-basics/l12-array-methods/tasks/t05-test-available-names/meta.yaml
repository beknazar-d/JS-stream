order: 5
title: "Тесты для подбора товаров в наличии до заданной цены"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, filter, map, цепочки, граничные случаи]
show: [subject/index.js]
hints:
  - "Направление: функция отбирает товары по двум условиям: остаток и цена. Подумайте про границы обоих условий и про случай, когда лимит цены не задан."
  - "Шаг: проверьте товар с остатком ровно 0, товар с ценой ровно равной лимиту и вызов без второго аргумента."
  - "Почти решение: нужны проверки availableNames(products, 1000), где в каталоге есть товар за ровно 1000, товар с остатком 0 и вызов availableNames(products) без лимита."
mutants:
  - name: strict-price
    description: "Цена сравнивается через «меньше», а не «не больше». Товар ровно за лимит пропадает из списка."
  - name: zero-stock
    description: "Условие наличия «не меньше нуля» вместо «больше нуля». Товары с нулевым остатком попадают в список."
  - name: no-limit
    description: "Проверка «лимит не задан» потеряна. Без второго аргумента сравнение с undefined всегда ложно, и список пустой."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверен только обычный случай: товар явно дешевле лимита и явно есть в наличии. Границы и отсутствие лимита не проверены, поэтому все три ошибки остаются незамеченными."
  - name: no-price-boundary
    kind: edge-case
    explanation: "Тесты проверяют нулевой остаток и вызов без лимита, но в каталоге нет товара с ценой ровно равной лимиту. Ошибка со строгим сравнением цены проходит незамеченной."
  - name: no-zero-stock
    kind: common-mistake
    explanation: "В тестовом каталоге все товары имеют положительный остаток. Ошибка, из-за которой в список попадают товары с нулевым остатком, проходит незамеченной."
