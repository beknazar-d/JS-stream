- id: map
  front: Как получить новый массив, применив функцию к каждому элементу?
  back: "items.map((item) => ...). Длина результата равна длине исходного массива, сам исходный не меняется."
  answer: map
- id: filter
  front: Какой метод оставляет в массиве только подходящие элементы?
  back: "items.filter((item) => условие). Возвращает новый массив: короче исходного или пустой."
  answer: filter
- id: find
  front: Что возвращает find, если подходящего элемента нет?
  back: "undefined. Находит первый подходящий и возвращает сам элемент, а не массив."
  answer: undefined
- id: find-index
  front: Что возвращает findIndex, если подходящего элемента нет?
  back: "-1. Если элемент есть, вернёт его индекс."
  answer: "-1"
- id: some
  front: Какой метод отвечает на вопрос «есть ли хотя бы один подходящий элемент»?
  back: "items.some((item) => условие). Возвращает true или false. На пустом массиве всегда false."
  answer: some
- id: every
  front: Какой метод проверяет, что подходят все элементы?
  back: "items.every((item) => условие). На пустом массиве возвращает true."
  answer: every
- id: empty-every
  front: Что вернёт [].every((x) => x > 0)?
  back: "true. Нарушителей нет, значит условие выполнено для всех. [].some(...) вернёт false."
  answer: "true"
- id: callback-return
  front: Нужен ли return в колбэке map, если после стрелки открыты фигурные скобки?
  back: "Да. Без return колбэк вернёт undefined, и map соберёт массив из undefined."
  answer: да
- id: filter-truthy
  front: Почему if (orders.filter(...)) всегда истинно?
  back: "Результат filter — массив, а любой массив (даже пустой) считается истинным. Для проверки используйте some или длину результата."
- id: chain
  front: В каком порядке ставить filter и map в цепочке?
  back: "Сначала filter (отобрать), потом map (превратить). Каждый шаг получает новый массив, исходный не меняется."
