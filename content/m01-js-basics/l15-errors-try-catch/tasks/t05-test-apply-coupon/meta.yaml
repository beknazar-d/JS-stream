order: 5
title: Тесты для промокодов
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, toThrow, throw, граничные случаи]
show: [subject/index.js]
hints:
  - "Направление: у функции три вида поведения: считает скидки, отказывает на неизвестный код и отказывает на плохую сумму. Для каждого нужны свои тесты, а для скидки MINUS500 — граница около нуля."
  - "Шаг: ошибки проверяйте через expect(() => applyCoupon(...)).toThrow('текст'). Для MINUS500 возьмите сумму меньше 500, чтобы проверить, что итог не отрицательный."
  - "Почти решение: нужны проверки applyCoupon(1000, 'SALE10') равно 900, applyCoupon(300, 'MINUS500') равно 0, applyCoupon(1000, 'MINUS500') равно 500, а также toThrow для кода 'FREE', суммы -1 и суммы '100'."
mutants:
  - name: unknown-code-ignored
    description: "Неизвестный промокод не вызывает ошибку: функция возвращает сумму без скидки."
  - name: goes-below-zero
    description: "MINUS500 вычитает 500 без нижней границы. При сумме меньше 500 итог получается отрицательным."
  - name: accepts-bad-total
    description: "Проверка суммы пропала. Отрицательная сумма и строка проходят дальше и дают бессмысленный результат."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверены только обычные скидки на крупных суммах. Ошибки и граница MINUS500 не проверены, поэтому ни один мутант не пойман."
  - name: no-clamp-check
    kind: edge-case
    explanation: "Ошибки проверены через toThrow, но MINUS500 пробуют только на суммах больше 500. Версия, которая уходит ниже нуля, остаётся незамеченной."
  - name: try-catch-test
    kind: common-mistake
    explanation: "Тест на неизвестный код написан через try/catch с проверкой внутри catch. Если ошибки нет, catch не выполняется, и тест проходит. Версия, которая не отказывает, остаётся незамеченной. Нужно ожидать ошибку через toThrow."
