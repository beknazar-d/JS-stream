<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="16" fill="currentColor">
  <title id="t">Приоритет операторов</title>
  <desc id="d">Слева лесенка приоритетов от самых сильных операторов к самым слабым. Справа пример 2 + 3 * 4 ** 2: сначала степень даёт 16, потом умножение даёт 48, потом сложение даёт 50.</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="16" y="16" width="330" height="328" rx="10" opacity="0.7"/>
    <rect x="370" y="16" width="254" height="328" rx="10" opacity="0.7"/>
    <path d="M36 62 H326 M36 100 H326 M36 138 H326 M36 176 H326 M36 214 H326 M36 252 H326 M36 290 H326" opacity="0.4"/>
    <path d="M497 120 V150 M491 143 L497 151 L503 143 M497 214 V244 M491 237 L497 245 L503 237" />
  </g>

  <g>
    <text x="36" y="42" font-weight="700">Раньше всего</text>
    <text x="36" y="86">1. Скобки</text><text x="326" y="86" text-anchor="end" font-family="ui-monospace, monospace">( )</text>
    <text x="36" y="124">2. НЕ и степень</text><text x="326" y="124" text-anchor="end" font-family="ui-monospace, monospace">!  **</text>
    <text x="36" y="162">3. Умножение, деление, остаток</text><text x="326" y="162" text-anchor="end" font-family="ui-monospace, monospace">* / %</text>
    <text x="36" y="200">4. Сложение, вычитание</text><text x="326" y="200" text-anchor="end" font-family="ui-monospace, monospace">+ -</text>
    <text x="36" y="238">5. Сравнения</text><text x="326" y="238" text-anchor="end" font-family="ui-monospace, monospace">&gt; &lt; &gt;= &lt;= ===</text>
    <text x="36" y="276">6. И</text><text x="326" y="276" text-anchor="end" font-family="ui-monospace, monospace">&amp;&amp;</text>
    <text x="36" y="314">7. ИЛИ и объединение</text><text x="326" y="314" text-anchor="end" font-family="ui-monospace, monospace">|| ??</text>
    <text x="36" y="336" font-size="13" opacity="0.8">Позже всего</text>
  </g>

  <g text-anchor="middle">
    <text x="497" y="46" font-weight="700">Пример</text>
    <text x="497" y="82" font-family="ui-monospace, monospace" font-size="18">2 + 3 * 4 ** 2</text>
    <text x="497" y="108" font-size="14">сначала степень: 4 ** 2 = 16</text>
    <text x="497" y="176" font-family="ui-monospace, monospace" font-size="18">2 + 3 * 16</text>
    <text x="497" y="202" font-size="14">потом умножение: 3 * 16 = 48</text>
    <text x="497" y="270" font-family="ui-monospace, monospace" font-size="18">2 + 48</text>
    <text x="497" y="296" font-size="14">в конце сложение</text>
    <text x="497" y="330" font-family="ui-monospace, monospace" font-size="20" font-weight="700">50</text>
  </g>
</svg>
