- id: remainder
  front: 'Какой оператор возвращает остаток от деления? Чему равно 47 % 12?'
  back: "% (процент). 47 % 12 даёт 11."
  answer: "11"
- id: power
  front: 'Каким оператором возводят число в степень?'
  back: "** (двойная звёздочка). 2 ** 3 даёт 8."
  answer: "**"
- id: compound
  front: 'Как записать stock = stock + 5 короче?'
  back: "stock += 5. Так же работают -=, *=, /=. Увеличить на 1: stock++."
  answer: "+="
- id: gte
  front: 'Как записать условие «от 5000 включительно»?'
  back: "orderSum >= 5000. Знак > не включает саму границу."
  answer: ">="
- id: and-or-not
  front: 'Как читаются операторы &&, || и !?'
  back: "&& это И (обе части истинны), || это ИЛИ (хотя бы одна), ! это НЕ."
- id: short-circuit
  front: 'Что такое короткое вычисление?'
  back: "Правая часть && и || не вычисляется, если результат ясен по левой. 0 || 10 даёт 10 без лишней работы."
- id: nullish
  front: 'Чем ?? отличается от ||?'
  back: "?? подставляет правую часть только при null и undefined. 0 ?? 10 даёт 0, а 0 || 10 даёт 10."
  answer: "??"
- id: precedence
  front: 'Что считается раньше: && или ||?'
  back: "&&. Выражение a || b && c значит a || (b && c). Не надейтесь на память, ставьте скобки."
  answer: "&&"
- id: chain
  front: 'Почему 1 < stock < 100 не проверяет «между 1 и 100»?'
  back: "Считается слева направо: (1 < stock) < 100, то есть true < 100. Пишите stock > 1 && stock < 100."
