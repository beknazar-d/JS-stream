order: 2
title: "Что выведут выражения стажёра"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [операторы, приоритет, "||", "??", сравнение строк]
show: [tests/snippet.js]
hints:
  - "Направление: разберите каждую строку отдельно. Для выражения с несколькими операторами выпишите порядок: что считается первым, что вторым."
  - "Шаг: в строке 2 сначала степень, потом умножение, потом сложение. Оператор || считает ноль ложным, а ?? нет. Строки сравниваются по символам."
  - "Почти решение: первые четыре строки — 11, 50, 10, 0. Пятая — результат сравнения двух строк. Шестая — правая часть, потому что слева null. Седьмая — 10, затем +=5, затем *=2."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верно только начало, остальные строки не заполнены. Предсказать нужно каждый вызов console.log, а не только первые три."
  - name: left-to-right
    kind: common-mistake
    explanation: "Во второй строке ответ 400 означает, что выражение считали слева направо: (2 + 3) * 4, затем в квадрат. Но степень сильнее умножения, а умножение сильнее сложения, поэтому верный ответ 50."
  - name: text-compare
    kind: edge-case
    explanation: "В пятой строке ответ false означает, что \"9\" и \"10\" сравнили как числа. Но это строки, а они сравниваются по символам слева направо: \"9\" идёт после \"1\", поэтому \"9\" > \"10\" даёт true."
