order: 5
title: "Тесты для правила промокода"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, "&&", "||", "!", граничные случаи]
show: [subject/index.js]
hints:
  - "Направление: правило состоит из трёх условий, соединённых И. Для каждого придумайте тест, где именно оно решает исход, а остальные выполнены."
  - "Шаг: нужны случаи ровно на границе 3000, покупатель без клуба с суммой между 3000 и 10000, покупатель без клуба с суммой от 10000 и повторное использование при выполненных остальных условиях."
  - "Почти решение: canApplyPromo(3000, true, false) даёт true, canApplyPromo(2999, true, false) даёт false, canApplyPromo(5000, false, false) даёт false, canApplyPromo(10000, false, false) даёт true, canApplyPromo(5000, true, true) даёт false."
mutants:
  - name: strict-boundary
    description: "Вместо «не меньше 3000» проверяется «строго больше 3000». Заказ ровно на 3000 отклоняется."
  - name: member-and-big
    description: "Вместо «клуб или сумма от 10000» проверяется «клуб и сумма от 10000». Члены клуба с обычной суммой больше не получают промокод."
  - name: ignores-used
    description: "Проверка «промокод ещё не использован» удалена. Повторное использование разрешено."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Тесты проверяют только два очевидных случая: большой заказ члена клуба и маленький заказ. Граница 3000 и повторное использование остаются без проверки."
  - name: no-used-case
    kind: common-mistake
    explanation: "Тесты проверяют границу и клуб, но промокод в них всегда ещё не использован. Ошибка с удалённой проверкой повторного использования остаётся незамеченной."
  - name: no-boundary
    kind: edge-case
    explanation: "Тесты проверяют клуб, крупные заказы и повторное использование, но не берут сумму ровно 3000. Ошибка «строго больше» остаётся незамеченной."
