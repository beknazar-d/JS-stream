order: 3
title: "Баг: скидка 0, граница 5000 и среднее"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [операторы, "??", "||", сравнение, приоритет, скобки]
hints:
  - "Направление: во всех трёх случаях код работает без ошибок, но считает не то. Разберите по одному: какой оператор тут стоит и чем он отличается от нужного?"
  - "Шаг: оператор || принимает ноль за «значения нет». В пороге «от 5000» граница входит в диапазон. Деление сильнее сложения."
  - "Почти решение: discountPercent ?? 10; orderSum >= 5000; (first + second) / 2."
wrong:
  - name: fixed-two-of-three
    kind: partial
    explanation: "Исправлены скидка и доставка, а среднее по-прежнему считается как first + second / 2, то есть сначала делится второе число. Для 10 и 20 получается 20."
  - name: misplaced-parens
    kind: common-mistake
    explanation: "Скобки поставлены вокруг second / 2. Но деление и так выполнялось первым, поэтому ничего не изменилось. Скобки нужны вокруг суммы: (first + second) / 2."
  - name: no-default
    kind: edge-case
    explanation: "Подстановка значения по умолчанию убрана совсем. Для 0 это работает, но если скидка не передана, в percent лежит undefined и цена превращается в NaN. Нужно 10 процентов при undefined и null."
