order: 5
title: "Тесты для итоговой цены заказа"
type: write-tests
role: main
difficulty: 3
minutes: 15
language: js
tags: [тесты, переменные, преобразование типов, граничные случаи]
show: [subject/index.js]
hints:
  - "Направление: у функции три входа. Для каждого подумайте, как его можно было бы забыть учесть, и напишите тест, который заметит такую ошибку."
  - "Шаг: если во всех тестах ставка НДС одна и та же, ошибку с жёстко заданной ставкой не заметить. Если доставка всегда 0, потеряется её прибавление. Если цена всегда число, не заметить склейку строк."
  - "Почти решение: проверьте finalPrice(1000, 10, 0) равно 1100, finalPrice(1000, 20, 0) равно 1200, finalPrice(1000, 10, 350) равно 1450 и finalPrice('1000', 10, 350) равно 1450."
mutants:
  - name: shipping-ignored
    description: "Доставка не прибавляется к итогу. Результат всегда равен цене с НДС."
  - name: price-as-text
    description: "Цена не превращается в число. Для строки \"1000\" плюс склеивает значения и результат получается строкой."
  - name: vat-fixed
    description: "Ставка НДС всегда 20 процентов, параметр vatPercent игнорируется."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Тесты проверяют только цену числом, ставку 20 процентов и доставку 0. Все три ошибки проходят незамеченными."
  - name: numbers-only
    kind: common-mistake
    explanation: "Тесты меняют ставку и доставку, но цену всегда передают числом. Данные из форм приходят строками, и ошибка со склейкой остаётся незамеченной."
  - name: no-shipping
    kind: edge-case
    explanation: "Доставка во всех тестах равна 0. Тесты ловят строки и другую ставку, но потеря доставки остаётся незамеченной."
