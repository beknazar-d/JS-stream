order: 5
title: "Корзина без общей переменной"
type: refactor
role: main
difficulty: 3
minutes: 15
language: js
tags: [чистые функции, побочные эффекты, параметры, значения по умолчанию, рефакторинг]
hints:
  - "Направление: найдите всё, что функция берёт или меняет снаружи: переменную total и console.log. Всё, что нужно для расчёта, должно прийти через параметры."
  - "Шаг: добавьте первым параметром текущую сумму. Результат верните через return. Количество по умолчанию задайте в списке параметров. Переменную на уровне модуля и getTotal удалите."
  - "Почти решение: export function addItem(total, price, quantity = 1) { return total + price * quantity; }"
wrong:
  - name: ignores-total
    kind: partial
    explanation: "Сигнатура изменена, но переданная сумма не используется: функция возвращает price * quantity. Вторая добавка в корзину стирает первую, 600 и 150 дают 150 вместо 750."
  - name: no-default-quantity
    kind: edge-case
    explanation: "Значение по умолчанию для количества не задано. При вызове addItem(600, 150) параметр quantity равен undefined, и результат NaN."
  - name: still-logs
    kind: common-mistake
    explanation: "Расчёт верный, но побочный эффект остался: функция по-прежнему печатает сумму в консоль. Чистая функция не должна ничего выводить."
