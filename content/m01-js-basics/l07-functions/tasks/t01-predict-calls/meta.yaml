order: 1
title: "Что вернут вызовы функций магазина"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [функции, return, undefined, значения по умолчанию]
show: [tests/snippet.js]
hints:
  - "Направление: для каждого вызова определите, какие значения получили параметры. Что получает параметр, для которого аргумента нет?"
  - "Шаг: если функция дошла до конца без return, она вернёт undefined. Значение по умолчанию подставляется только вместо undefined, а ноль — это обычное значение. Лишние аргументы просто игнорируются."
  - "Почти решение: первые две строки — 560 и undefined. Четвёртая строка — «Чайник x2», пятая — 300. В третьей строке вместо количества подставится слово undefined, а в шестой будет 0."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верны только первые три строки, остальные не заполнены. Предсказать нужно каждый вызов console.log, включая функции подписи и суммы строки."
  - name: base-without-express
    kind: common-mistake
    explanation: "Во второй строке ответ 280. Но без экспресса условие if не выполняется, return внутри него не срабатывает, и функция заканчивается без возврата значения. Результат undefined."
  - name: default-replaces-zero
    kind: edge-case
    explanation: "В шестой строке ответ 300: так было бы, если бы значение по умолчанию заменяло любое ложное значение. Но подставляется оно только вместо undefined. Ноль передан явно, поэтому 300 умножается на 0 и получается 0."
