- id: declaration
  front: Как объявить функцию с двумя параметрами?
  back: "function name(a, b) { return a + b; }"
- id: params-vs-args
  front: Чем параметры отличаются от аргументов?
  back: "Параметры — имена в объявлении function f(a, b). Аргументы — значения при вызове f(1, 2)."
- id: return
  front: Что делает return?
  back: "Отдаёт результат вызова и сразу завершает функцию. Код после return не выполняется."
  answer: return
- id: no-return
  front: Что вернёт функция без return?
  back: "undefined. Результат вычислений внутри функции теряется."
  answer: undefined
- id: default-param
  front: Как задать значение параметра по умолчанию?
  back: "function f(price, rate = 0.2) { ... } — запасное значение подставляется, если аргумент не передан (равен undefined)."
- id: default-zero
  front: Заменит ли значение по умолчанию переданный 0?
  back: "Нет. Заменяется только undefined. Вызов priceWithVat(500, 0) использует 0."
  answer: Нет
- id: missing-arg
  front: Чему равен параметр, для которого не передали аргумент (и нет значения по умолчанию)?
  back: "undefined. Расчёты с ним дают NaN, сравнения — false."
  answer: undefined
- id: pure
  front: Какая функция называется чистой?
  back: "Результат зависит только от аргументов, и она ничего не меняет снаружи. Одни и те же аргументы дают один и тот же результат."
- id: side-effect
  front: Что такое побочный эффект?
  back: "Всё, что функция делает кроме возврата результата: меняет внешнюю переменную, пишет в консоль, отправляет запрос."
- id: call-vs-value
  front: Чем shippingCost отличается от shippingCost(2, 50)?
  back: "Без скобок — сама функция как значение (её можно положить в переменную). Со скобками — вызов и результат."
