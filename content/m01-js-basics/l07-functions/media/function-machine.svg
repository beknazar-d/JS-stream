<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="16" fill="currentColor">
  <title id="t">Функция как автомат</title>
  <desc id="d">Слева в функцию shippingCost входят аргументы 2 и 50. Внутри они становятся параметрами weightKg и distanceKm. Справа выходит результат 280, который возвращает return. Ниже показано, что функция без return возвращает undefined.</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="30" y="40" width="130" height="70" rx="8" stroke-dasharray="6 4"/>
    <rect x="240" y="30" width="170" height="90" rx="8"/>
    <rect x="490" y="40" width="120" height="70" rx="8" stroke-dasharray="6 4"/>
    <path d="M160 75 H240"/>
    <path d="M410 75 H490"/>
    <rect x="240" y="200" width="170" height="70" rx="8"/>
    <rect x="490" y="205" width="120" height="60" rx="8" stroke-dasharray="6 4"/>
    <path d="M410 235 H490"/>
  </g>
  <g fill="currentColor">
    <path d="M232 69 L240 75 L232 81 Z"/>
    <path d="M482 69 L490 75 L482 81 Z"/>
    <path d="M482 229 L490 235 L482 241 Z"/>
  </g>
  <g text-anchor="middle">
    <text x="95" y="68" font-family="ui-monospace, monospace">2, 50</text>
    <text x="95" y="92" font-size="13" opacity="0.8">аргументы</text>
    <text x="325" y="56" font-family="ui-monospace, monospace" font-size="14">shippingCost</text>
    <text x="325" y="78" font-family="ui-monospace, monospace" font-size="13">weightKg = 2</text>
    <text x="325" y="98" font-family="ui-monospace, monospace" font-size="13">distanceKm = 50</text>
    <text x="550" y="68" font-family="ui-monospace, monospace">280</text>
    <text x="550" y="92" font-size="13" opacity="0.8">результат</text>
    <text x="325" y="228" font-family="ui-monospace, monospace" font-size="14">без return</text>
    <text x="325" y="250" font-size="13" opacity="0.8">считает, но не отдаёт</text>
    <text x="550" y="240" font-family="ui-monospace, monospace">undefined</text>
  </g>
  <g font-size="14" text-anchor="middle" opacity="0.9">
    <text x="200" y="64">вход</text>
    <text x="450" y="64">return</text>
  </g>
  <text x="320" y="170" text-anchor="middle" font-size="14" opacity="0.8">параметры — имена внутри функции, аргументы — значения при вызове</text>
</svg>
