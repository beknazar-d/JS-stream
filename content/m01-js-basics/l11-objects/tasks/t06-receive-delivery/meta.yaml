order: 6
title: "Приёмка поставки на склад"
type: implement
role: real
difficulty: 4
minutes: 25
language: js
tags: [объекты, массивы объектов, ссылки, Object.keys, Number, NaN]
hints:
  - "Направление: сначала соберите новый объект остатков из старого, поле за полем. Потом обойдите строки поставки и обновите уже новый объект. Исходный stock только читайте."
  - "Шаг: for (const sku of Object.keys(stock)) { next[sku] = stock[sku]; } копирует остатки. Затем для каждой строки превратите quantity через Number и пропустите строку, если это не целое число больше нуля (Number.isInteger)."
  - "Почти решение: если Object.hasOwn(next, line.sku) ложно, поместите sku в added и начните с 0. Потом next[line.sku] = next[line.sku] + quantity."
wrong:
  - name: mutates-stock
    kind: common-mistake
    explanation: "Остатки обновляются прямо в переданном объекте. Результат выглядит верно, но stock после вызова изменился. Другие части системы читают тот же объект и увидят остатки до проверки поставки."
  - name: strings-concatenate
    kind: edge-case
    explanation: "Количество из формы не превращается в число. К остатку 5 строка \"3\" приклеивается: получается \"53\". Нечисловые строки при этом тоже попадают в остаток."
  - name: existing-only
    kind: partial
    explanation: "Обновляются только артикулы, которые уже есть на складе. Новые артикулы из поставки теряются, и список added остаётся пустым."
