order: 6
title: "График рассрочки для покупателя"
type: implement
role: real
difficulty: 4
minutes: 30
language: js
tags: [for, строки, остаток от деления, валидация, шаблонные строки]
hints:
  - "Направление: разделите задачу на три шага. Проверка входных данных, расчёт обычного платежа и остатка, цикл по месяцам со сборкой строки."
  - "Шаг: остаток получите как price % months. Обычный платёж равен (price - остаток) / months, это целое число. Последний месяц отличается: к платежу добавляется остаток. Строки соединяйте переводом строки, но не ставьте его после последней строки."
  - "Почти решение: проверьте Number.isInteger для обоих значений и диапазоны; const rest = price % months; const base = (price - rest) / months; let plan = \"\"; for (let month = 1; month <= months; month++) { const amount = month === months ? base + rest : base; plan += `Месяц ${month}: ${amount} руб.\\n`; } return plan + `Итого: ${price} руб.`;"
wrong:
  - name: no-remainder
    kind: partial
    explanation: "Все платежи равны обычному платежу, а остаток нигде не добавляется. Для 10000 на 3 месяца последний платёж 3333, в итоге сумма платежей на рубль меньше цены, хотя в итоговой строке написано 10000."
  - name: no-validation
    kind: edge-case
    explanation: "Входные данные не проверяются. Срок 1 или 13, дробная цена и строки обрабатываются как обычные, хотя по тикету нужно вернуть null. Для срока 0 получилось бы деление на ноль."
  - name: starts-from-zero
    kind: common-mistake
    explanation: "Счётчик начинается с 0, и график выглядит как «Месяц 0, Месяц 1, Месяц 2». Нумерация месяцев в тикете идёт с 1, поэтому строки месяцев не совпадают с ожидаемыми."
