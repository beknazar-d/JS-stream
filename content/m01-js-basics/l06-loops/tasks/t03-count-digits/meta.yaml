order: 3
title: "Купон теряет первую цифру"
type: fix-bug
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [for, строки, индексы, ошибка на единицу]
hints:
  - "Направление: выпишите индексы символов строки «7SALE» и проверьте, какой индекс цикл берёт первым."
  - "Шаг: индексы строки начинаются с нуля. Сравните начальное значение счётчика с этим правилом."
  - "Почти решение: в заголовке for счётчик начинается с 1, а должен с 0. Условие i <= code.length можно заменить на i < code.length, чтобы не выходить за строку."
wrong:
  - name: drops-last
    kind: partial
    explanation: "Начало цикла исправлено, но условие стало i < code.length - 1, и последний символ не проверяется. Для \"SALE7\" функция возвращает 0."
  - name: zero-is-not-a-digit
    kind: common-mistake
    explanation: "Проверка через Number(char) считает цифрой только то, что даёт число, отличное от нуля: \"0\" превращается в 0, а 0 ложно. В \"SALE-2025\" функция не засчитывает нуль и возвращает 3."
  - name: no-type-guard
    kind: edge-case
    explanation: "Проверку на не-строку удалили при переписывании. Для null обращение к code.length приводит к TypeError вместо ответа 0."
