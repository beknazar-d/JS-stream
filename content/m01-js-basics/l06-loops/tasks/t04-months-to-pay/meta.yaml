order: 4
title: "За сколько месяцев закроется рассрочка"
type: implement
role: main
difficulty: 3
minutes: 20
language: js
tags: [while, бесконечный цикл, валидация, типы]
hints:
  - "Направление: заведите остаток долга и счётчик месяцев. Пока остаток больше нуля, вычитайте платёж и добавляйте месяц. Но сначала подумайте, при каком платеже остаток никогда не станет нулём."
  - "Шаг: до цикла отсейте плохие входные данные. Платёж должен быть числом, конечным (Number.isFinite) и больше нуля. Цена должна быть числом и конечной. Тип проверяйте через typeof."
  - "Почти решение: проверки возвращают null; потом let rest = price; let months = 0; while (rest > 0) { rest -= monthlyPayment; months++; } return months;"
wrong:
  - name: only-full-payments
    kind: partial
    explanation: "Условие rest >= monthlyPayment считает только полные платежи. Для 10000 при платеже 3000 получается 3, а последний платёж на 1000 теряется. Правильный ответ 4."
  - name: no-payment-guard
    kind: edge-case
    explanation: "Нет проверки платежа. При платеже 0 остаток не уменьшается, цикл бесконечный, и платформа останавливает код через 5 секунд. При отрицательном платеже остаток растёт и цикл тоже не заканчивается. Проверять нужно до цикла."
  - name: runs-at-least-once
    kind: common-mistake
    explanation: "Цикл do...while выполняет тело до проверки условия. Для цены 0 он считает один месяц, хотя платить нечего. Правильный ответ 0."
