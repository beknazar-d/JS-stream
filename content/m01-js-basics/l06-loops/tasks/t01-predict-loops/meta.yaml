order: 1
title: "Что выведут циклы нумерации мест"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [for, while, do...while, break, continue]
show: [tests/snippet.js]
hints:
  - "Направление: пройдите по каждому циклу вручную и выписывайте значение счётчика на каждой итерации. Не забудьте, где стоит проверка условия: до тела или после."
  - "Шаг: continue пропускает только остаток текущей итерации, цикл продолжается. break заканчивает цикл совсем. do...while выполняет тело хотя бы один раз. Цикл for с ложным условием не выполняется ни разу."
  - "Почти решение: первая строка склеена из цифр 1, 2, 4, 5 (тройка пропущена). Месяцев при платеже 3000 нужно три, а выплачено 9000. Дальше идут 11, 2 и 4."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верны только первые три строки, остальные не заполнены. Предсказать нужно каждый вызов console.log, включая цикл do...while и поиск дефиса."
  - name: continue-as-break
    kind: common-mistake
    explanation: "В первой строке ответ 12: так было бы, если бы continue выходил из цикла. Но continue пропускает только место 3 и идёт дальше, поэтому получается 1245."
  - name: do-while-skipped
    kind: edge-case
    explanation: "В четвёртой строке ответ 10. Так было бы у обычного while, где условие проверяется до тела. В do...while тело выполняется один раз, прежде чем условие проверится, поэтому tries становится 11."
