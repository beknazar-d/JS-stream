order: 5
title: Тесты для правки заказа
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, spread, иммутабельность, вложенные объекты]
show: [subject/index.js]
hints:
  - "Направление: у функции три обещания: слияние вложенного клиента, защита id и неприкосновенность исходных данных. Каждому нужен свой тест."
  - "Шаг: подготовьте заказ и правку, вызовите функцию, а потом проверьте и результат, и исходный заказ. Для правки клиента передайте только одно поле, например город, и убедитесь, что имя осталось."
  - "Почти решение: нужны тесты с правкой { customer: { city: 'Самара' } } (имя сохранилось), с правкой { id: 999 } (id прежний) и тест, где после вызова исходный заказ сравнивается с копией, сделанной до вызова."
mutants:
  - name: mutates-original
    description: "Правка записывается прямо в переданный заказ, и он возвращается же. Исходный заказ изменяется."
  - name: replaces-customer
    description: "Объект customer из правки заменяет клиента целиком. Поля, которых в правке нет (например имя), пропадают."
  - name: changes-id
    description: "Поле id не вырезается из правки, и через правку можно сменить номер заказа."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверяется только смена статуса. Слияние клиента, защита id и сохранность исходного заказа не проверены, поэтому ни один из мутантов не пойман."
  - name: no-mutation-check
    kind: edge-case
    explanation: "Тесты смотрят на результат: слияние клиента и защита id проверены. Но исходный заказ после вызова не сравнивается с копией, поэтому мутант, который правит его на месте, остаётся незамеченным."
  - name: no-id-check
    kind: common-mistake
    explanation: "Проверены результат, слияние клиента и неизменность исходных данных. Правку с id никто не пробовал, поэтому версия, в которой номер заказа можно сменить, проходит все тесты."
