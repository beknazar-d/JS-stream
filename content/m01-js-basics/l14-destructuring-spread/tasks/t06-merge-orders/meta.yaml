order: 6
title: Объединение заказов клиента
type: implement
role: real
difficulty: 4
minutes: 30
language: js
tags: [rest, spread, иммутабельность, массивы, склад]
hints:
  - "Направление: сначала решите, откуда берутся позиции результата: все они должны быть копиями, а не ссылками на строки старых заказов. Потом пройдите по остальным заказам и добавьте их позиции."
  - "Шаг: заведите массив lines из копий строк основного заказа ({ ...line }). Для каждой строки остальных заказов найдите в нём такую же sku через find. Нашли: увеличьте qty у найденной копии. Не нашли: добавьте копию строки."
  - "Почти решение: const lines = base.lines.map((line) => ({ ...line })); два вложенных for...of по others и order.lines; внутри find по sku, затем existing.qty += line.qty или lines.push({ ...line }). Верните { ...base, lines, mergedFrom: others.map((order) => order.id) }."
wrong:
  - name: shared-lines
    kind: common-mistake
    explanation: "Массив lines скопирован, а строки внутри остались теми же объектами. Прибавление количества меняет строки основного заказа. Spread и map копируют только массив, а не объекты внутри него."
  - name: no-sum
    kind: partial
    explanation: "Позиции просто склеиваются через concat. Одинаковые sku остаются двумя строками, хотя по ТЗ они должны слиться в одну с суммой количества."
  - name: only-first-other
    kind: edge-case
    explanation: "Функция берёт только первый из остальных заказов (others[0]). С одним дополнительным заказом всё хорошо, но заказы со второго теряются, а вызов без дополнительных заказов падает."
