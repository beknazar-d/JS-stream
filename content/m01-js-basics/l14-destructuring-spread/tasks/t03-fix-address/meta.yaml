order: 3
title: Накладная падает без адреса
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [деструктуризация, значения по умолчанию, undefined, "null"]
hints:
  - "Направление: ошибка возникает до того, как функция успела хоть что-то сделать. Распаковка параметра требует, чтобы там был объект."
  - "Шаг: сначала проверьте, что адрес вообще есть, и верните запасную строку. Потом распакуйте адрес внутри функции, а для дома задайте значение по умолчанию."
  - "Почти решение: if (!address) return 'Адрес не указан'; затем const { city, street, house = 'б/н' } = address; и вернуть строку с тремя частями."
wrong:
  - name: only-undefined
    kind: partial
    explanation: "Защита от отсутствующего адреса есть, но значения по умолчанию для дома нет. Для адреса без дома в строке снова появляется слово undefined."
  - name: empty-default
    kind: common-mistake
    explanation: "Параметр получил значение по умолчанию = {}. Функция больше не падает, но для отсутствующего адреса возвращает «undefined, undefined, б/н» вместо «Адрес не указан»."
  - name: null-address
    kind: edge-case
    explanation: "Проверка address === undefined не ловит null. Адрес null приходит из JSON с сервера, и функция снова падает с ошибкой распаковки."
