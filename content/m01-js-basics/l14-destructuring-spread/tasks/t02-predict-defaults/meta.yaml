order: 2
title: Что выведет код с умолчаниями и копиями
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [деструктуризация, значения по умолчанию, "null", spread, поверхностная копия]
show: [tests/snippet.js]
hints:
  - "Направление: значение по умолчанию подставляется не всегда. Вспомните, чем undefined отличается от null, и что копирует spread."
  - "Шаг: по умолчанию срабатывает только на undefined. Значения null, 0 и пустая строка остаются как есть. Spread копирует только верхний уровень, вложенный объект остаётся общим."
  - "Почти решение: первые четыре строки — new, null, нет, 0. Дальше выводятся paid new, массив из двух элементов и город после изменения копии."
wrong:
  - name: null-is-missing
    kind: common-mistake
    explanation: "Во второй строке ответ NONE означает, что значение по умолчанию сработало на null. Оно срабатывает только на отсутствующее свойство или undefined, а null остаётся null."
  - name: copy-is-deep
    kind: edge-case
    explanation: "В последней строке ответ Казань означает, что копия полностью независима. Spread копирует только верхний уровень: объект address общий, и изменение через копию видно в исходном объекте."
  - name: half
    kind: partial
    explanation: "Заполнена только первая половина вывода. Предсказать нужно каждый console.log, включая работу с копиями."
