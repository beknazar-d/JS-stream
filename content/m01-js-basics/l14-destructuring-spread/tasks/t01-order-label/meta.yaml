order: 1
title: Подпись заказа и очередь сборки
type: recall
role: warmup
difficulty: 1
minutes: 8
language: js
tags: [деструктуризация, значения по умолчанию, rest]
hints:
  - "Направление: из заказа нужны три значения, одно из них лежит внутри вложенного объекта. Распаковать можно одной записью с фигурными скобками."
  - "Шаг: вложенный объект распаковывается так же, как внешний: customer: { name, city }. Значение по умолчанию пишется после имени через знак равенства. Для очереди нужны квадратные скобки и три точки перед последним именем."
  - "Почти решение: const { id, customer: { name, city = 'не указан' } } = order; и const [next, ...waiting] = queue; остаётся вернуть строку и объект."
wrong:
  - name: no-default
    kind: edge-case
    explanation: "Значение по умолчанию для города не задано. Если города нет, в строке появится слово undefined. Скрытый тест проверяет заказ без города."
  - name: unfinished
    kind: partial
    explanation: "Написана только orderLabel, а splitQueue ничего не возвращает. Нужны обе функции."
  - name: forgot-rest
    kind: common-mistake
    explanation: "В записи const [next, waiting] = queue нет трёх точек. Тогда waiting получает только второй элемент очереди, а не массив остальных."
