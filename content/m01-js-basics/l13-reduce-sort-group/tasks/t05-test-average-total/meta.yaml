order: 5
title: "Тесты для среднего чека оплаченных заказов"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, reduce, filter, округление, граничные случаи]
show: [subject/index.js]
hints:
  - "Направление: функция фильтрует заказы, суммирует и делит. Подумайте, где в этой цепочке можно ошибиться: что считается заказом, на что делим, что будет при отсутствии оплаченных."
  - "Шаг: проверьте список без оплаченных заказов, список с оплаченными и неоплаченными вперемешку и такие суммы, при которых среднее получается дробным."
  - "Почти решение: нужны тесты averagePaidTotal([]), averagePaidTotal с одним заказом new, список из оплаченных и новых заказов и случай, когда сумма 1000 и 1001 даёт 1000,5."
mutants:
  - name: no-empty-check
    description: "Пропала проверка «оплаченных нет». Сумма 0 делится на 0, и функция возвращает NaN."
  - name: counts-all-orders
    description: "Сумма считается по оплаченным заказам, а делится на число всех заказов. Неоплаченные занижают средний чек."
  - name: no-rounding
    description: "Округление пропало: результат остаётся дробным, например 1000,5, а должен быть целым."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверен один случай: два оплаченных заказа и больше ничего. Пустой список, неоплаченные заказы и дробное среднее не пробованы, поэтому все три ошибки остаются незамеченными."
  - name: no-empty-case
    kind: edge-case
    explanation: "Тесты проверяют смесь статусов и округление, но не пробуют список без оплаченных заказов. Ошибка с делением на ноль и NaN проходит незамеченной."
  - name: round-numbers-only
    kind: common-mistake
    explanation: "Во всех тестах сумма делится нацело. Дробные результаты не проверены, и пропавшее округление остаётся незамеченным."
