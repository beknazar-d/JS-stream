order: 2
title: "Что выведет код с сортировкой цен"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [sort, toSorted, reduce, мутация]
show: [tests/snippet.js]
hints:
  - "Направление: сортировка без компаратора сравнивает числа как строки. И sort меняет исходный массив, а toSorted нет."
  - "Шаг: строки сравниваются посимвольно: \"10\" и \"100\" раньше \"9\". После prices.sort() массив prices уже переставлен, и следующие строки видят его новый порядок."
  - "Почти решение: первые две строки одинаковые — [1, 10, 100, 9]. Третья строка — [1, 9, 10, 100]. Четвёртая снова [1, 10, 100, 9]. Дальше 120, 5, 3."
wrong:
  - name: first-half
    kind: partial
    explanation: "Верны только первые три строки, остальные не заполнены. Предсказать нужно каждый вызов console.log."
  - name: numeric-default
    kind: common-mistake
    explanation: "Ответ считает, что sort без компаратора сортирует числа по значению. На самом деле сравниваются строки, и 10 с 100 идут раньше 9."
  - name: sort-copies
    kind: edge-case
    explanation: "Ответ считает, что sort возвращает копию, а prices остаётся прежним. Но sort меняет сам массив, поэтому вторая и четвёртая строки показывают переставленный prices."
