order: 5
title: Тесты для восстановления корзины
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, JSON.parse, SyntaxError, toThrow, проверка структуры]
show: [subject/index.js]
hints:
  - "Направление: у функции два вида входа, которые надо различать: текст, который вообще не JSON, и корректный JSON, но не корзина. Это разные ошибки внутри, а снаружи — одно сообщение."
  - "Шаг: для первого вида возьмите обрезанную строку, для второго — '[]', 'null', '5' и '{\"items\":5}'. Для хорошей корзины проверьте, что qty стало числом, а лишние поля пропали."
  - "Почти решение: нужны проверки restoreCart('{\"items\":[') и restoreCart('{\"items\":5}') с toThrow('Корзина повреждена'), а ещё restoreCart('{\"items\":[{\"sku\":\"A\",\"qty\":\"2\",\"x\":1}]}') с результатом { items: [{ sku: 'A', qty: 2 }] }."
mutants:
  - name: bad-json-leaks
    description: "Ошибка разбора JSON не перехватывается. Вместо сообщения «Корзина повреждена» наружу выходит SyntaxError с английским текстом."
  - name: no-shape-check
    description: "Проверка структуры пропала. Для корректного JSON не в форме корзины функция падает случайной ошибкой или возвращает мусор вместо «Корзина повреждена»."
  - name: qty-stays-string
    description: "Количество не превращается в число и остаётся строкой, как в файле. Дальше оно склеивается вместо сложения."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверена только нормальная корзина. Повреждённый текст и неверная структура не проверены, поэтому ни один мутант не пойман."
  - name: no-shape-test
    kind: edge-case
    explanation: "Проверены нормальная корзина, превращение qty и обрезанный JSON. Корректный JSON неправильной формы никто не пробовал, и версия без проверки структуры остаётся незамеченной."
  - name: vague-throw
    kind: common-mistake
    explanation: "Ошибки проверены через toThrow() без текста. Достаточно любой ошибки, поэтому версия, у которой наружу вылезает SyntaxError вместо «Корзина повреждена», проходит все тесты."
