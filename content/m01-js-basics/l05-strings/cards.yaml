- id: length
  front: 'Как узнать, сколько символов в строке sku? Нужны ли скобки?'
  back: 'sku.length. Скобок нет: length это свойство, а не функция.'
  answer: 'length'
- id: index
  front: 'С какого числа начинаются индексы в строке и как получить последний символ?'
  back: 'С нуля. Последний символ: text[text.length - 1].'
- id: slice
  front: 'Что вернёт "ORD-2024-0042".slice(4, 8)?'
  back: '"2024". Начальный индекс входит, конечный нет.'
  answer: '2024'
- id: slice-negative
  front: 'Что вернёт "ORD-2024-0042".slice(-4)?'
  back: '"0042". Отрицательный индекс отсчитывается от конца.'
  answer: '0042'
- id: trim
  front: 'Какой метод убирает пробелы по краям строки?'
  back: 'text.trim(). Он возвращает новую строку, исходная не меняется.'
  answer: 'trim'
- id: immutable
  front: 'Меняет ли text.toUpperCase() переменную text?'
  back: 'Нет. Строки неизменяемы, метод возвращает новую строку. Сохраните результат или верните его.'
  answer: 'нет'
- id: replace-all
  front: 'Чем replaceAll отличается от replace?'
  back: 'replace заменяет только первое вхождение, replaceAll все. Для чистки телефона нужен replaceAll.'
  answer: 'replaceAll'
- id: pad-start
  front: 'Как получить из числа 42 строку "000042"?'
  back: 'String(42).padStart(6, "0"). Метод padStart есть только у строк.'
  answer: 'padStart'
- id: template
  front: 'Как собрать строку «Заказ №42» из переменной id в обратных кавычках?'
  back: 'Шаблонная строка: `Заказ №${id}`. В обычных кавычках подстановка не работает.'
- id: case-search
  front: 'Найдёт ли "ORD-1".includes("ord") кусок в строке?'
  back: 'Нет, поиск различает регистр. Приведите обе строки к одному через toLowerCase().'
  answer: 'нет'
