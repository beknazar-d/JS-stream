order: 6
title: "Этикетка для курьера"
type: implement
role: real
difficulty: 3
minutes: 25
language: js
tags: [строки, шаблонные строки, slice, padStart, trim, toUpperCase, форматирование]
hints:
  - "Направление: сначала напишите formatPhone, потому что на неё опирается этикетка. Потом соберите четыре строки и склейте их через \\n."
  - "Шаг: в formatPhone телефон режется на части через slice: код страны, три цифры, три цифры, две цифры, две цифры. Номер заказа превращается в строку через String перед padStart."
  - "Почти решение: в шаблонной строке пишите четыре части подряд, между ними \\n: `ЗАКАЗ №${...}\\n${...}\\nг. ${...}, ${...}\\nТел.: ${...}`."
wrong:
  - name: phone-unformatted
    kind: partial
    explanation: "formatPhone возвращает телефон как есть, без разбиения на группы. Этикетка получается с телефоном вида +79991234567 вместо +7 999 123-45-67."
  - name: pad-number
    kind: common-mistake
    explanation: "padStart вызван у числа orderId, а не у строки. Метод есть только у строк, поэтому для числа получается TypeError. Сначала нужен String(orderId)."
  - name: no-phone-check
    kind: edge-case
    explanation: "formatPhone не проверяет формат и всегда режет строку на части. Для пустого телефона на этикетке получается мусор вместо «не указан»."
