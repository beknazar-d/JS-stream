order: 2
title: "Что выведут методы строк"
type: predict
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [строки, slice, includes, replace, padStart, индексы]
show: [tests/snippet.js]
hints:
  - "Направление: выпишите индексы строки с нуля и разберите каждый вызов отдельно."
  - "Шаг: в slice(начало, конец) конечный индекс не входит. includes различает регистр. Метод replace заменяет только первое вхождение."
  - "Почти решение: первые четыре строки — 11, 4, 4521, BLK. Дальше false, true, 007, ab c и последняя собранная строка из шаблона."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верно только начало, остальные строки не заполнены. Предсказать нужно каждый вызов console.log, а не только первые четыре."
  - name: end-inclusive
    kind: common-mistake
    explanation: "В третьей строке ответ 4521- означает, что символ с конечным индексом 7 вошёл в кусок. Но конечный индекс в slice не входит: slice(3, 7) берёт индексы 3, 4, 5, 6."
  - name: replace-all-spaces
    kind: edge-case
    explanation: "В восьмой строке ответ abc означает, что replace убрал оба пробела. Но replace заменяет только первое вхождение, поэтому получается ab c."
