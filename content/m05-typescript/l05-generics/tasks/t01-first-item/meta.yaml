order: 1
title: "Первый в очереди: одна функция на все списки"
type: recall
role: warmup
difficulty: 1
minutes: 8
language: ts
typecheck: true
tags: [generics, параметр типа, вывод типов]
hints:
  - "Направление: сейчас функция принимает unknown[] и возвращает unknown, поэтому тип теряется. Нужна связь между типом элементов на входе и типом результата."
  - "Шаг: объявите параметр типа после имени функции, в угловых скобках, и используйте его и в параметре, и в результате."
  - "Почти решение: export function firstItem<T>(items: T[]): T | undefined { return items[0]; }"
wrong:
  - name: only-strings
    kind: partial
    explanation: "Функция написана для string[]. На строках работает, но вызов с массивом заказов не проходит проверку типов (TS2345): тип параметра слишком узкий. Для всех списков сразу нужен параметр типа."
  - name: returns-t
    kind: edge-case
    explanation: "Параметр типа есть, но в результате указан просто T. Для пустой очереди функция вернёт undefined, а тип обещает заказ. Тест типов ждёт Order | undefined, потому что вызывающий должен проверить пустую очередь."
  - name: uses-any
    kind: common-mistake
    explanation: "Сигнатура с any: код работает, но тип результата — any вместо Order | undefined. Именно такую потерю типа убирают generics, и тест типов её ловит."
