  - name: no-swap
    kind: common-mistake
    explanation: "Во второй строке порядок не поменялся. swap возвращает [entry[1], entry[0]], то есть сначала число 42, потом строка. Параметры типа порядок не определяют, это делает код."
  - name: type-guess
    kind: edge-case
    explanation: "В строке 6 ответ true. Но swap(swap(route)) создаёт новый массив, а оператор === сравнивает ссылки на массивы, не содержимое. Одинаковое содержимое не делает массивы равными."
