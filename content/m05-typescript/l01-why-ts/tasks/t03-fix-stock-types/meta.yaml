order: 3
title: "Три ошибки типов в расчёте остатков"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: ts
typecheck: true
tags: [TS2322, TS2339, преобразование типов, Number]
hints:
  - "Направление: прочитайте сообщения компилятора. В каждой функции одна ошибка: в первой строку возвращают вместо числа, во второй к числу прибавляют строку, в третьей вызывают строковый метод у числа."
  - "Шаг: строку в число превращает Number(). К счётчику прибавляют число 1, а не строку. У числа нет метода toUpperCase, а подставить число в строку можно через шаблонную строку или String()."
  - "Почти решение: return Number(raw); count = count + 1; return name + \": \" + left;"
wrong:
  - name: partial-fix
    kind: partial
    explanation: "Исправлены первые две функции, а в stockLabel всё ещё вызывается toUpperCase у числа. Компилятор сообщает TS2339: у типа number нет такого метода."
  - name: as-any
    kind: common-mistake
    explanation: "Ошибка в parseStock заглушена через as any. Компилятор молчит, но в рантайме возвращается строка \"12\" вместо числа 12, и тест на поведение падает."
  - name: parse-int
    kind: edge-case
    explanation: "parseInt отбрасывает дробную часть, поэтому parseStock(\"2.5\") возвращает 2, а не 2.5. Остатки в килограммах бывают дробными."
