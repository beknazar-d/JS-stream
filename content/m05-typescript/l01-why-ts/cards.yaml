- id: ts-when
  front: Когда TypeScript проверяет типы?
  back: "До запуска, при компиляции. В рантайме остаётся обычный JavaScript, типов в нём нет."
  answer: при компиляции
- id: annotation
  front: Как записать, что переменная хранит число?
  back: "let count: number = 3. После двоеточия идёт тип."
  answer: ": number"
- id: inference
  front: Нужна ли аннотация в const city = "Казань"?
  back: "Нет. Тип выводится из значения (type inference). Аннотации нужны там, где вывести не из чего, например у параметров функции."
- id: const-literal
  front: Какой тип у const city = "Казань", а какой у let city = "Казань"?
  back: 'У const тип "Казань" (литеральный), у let тип string, потому что let можно перезаписать.'
- id: array-type
  front: Как записать тип массива строк?
  back: "string[]. Массив чисел — number[]."
  answer: string[]
- id: any-danger
  front: Чем опасен any?
  back: "Он отключает проверку: с any можно делать что угодно, ошибки проявятся только в рантайме."
- id: unknown-safe
  front: Чем unknown лучше any?
  back: "Принимает любое значение, но пользоваться им нельзя, пока не проверите тип, например через typeof."
  answer: unknown
- id: as-lies
  front: Проверяет ли as тип значения в рантайме?
  back: "Нет. Конструкция as только говорит компилятору, что вы знаете лучше. Если вы ошиблись, ошибка уйдёт в рантайм."
  answer: нет
- id: strict-flag
  front: Что включает режим strict?
  back: "Набор строгих проверок: запрет неявного any, проверка null и undefined и другие. Включайте его всегда."
  answer: strict
