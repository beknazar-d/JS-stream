<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="15" fill="currentColor">
  <title id="t">Проверка формы объекта по interface Order</title>
  <desc id="d">Слева описание Order: id только для чтения, status обязательное, comment необязательное. Справа три объекта: подходящий, без обязательного status и литерал с лишним полем, который отклоняется.</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="12" y="16" width="250" height="298" rx="10"/>
    <rect x="300" y="16" width="328" height="82" rx="8"/>
    <rect x="300" y="116" width="328" height="82" rx="8"/>
    <rect x="300" y="216" width="328" height="98" rx="8"/>
  </g>

  <g>
    <text x="28" y="46" font-weight="700">interface Order</text>
    <text x="28" y="86" font-family="ui-monospace, monospace">readonly id: number</text>
    <text x="28" y="116" font-family="ui-monospace, monospace">status: string</text>
    <text x="28" y="146" font-family="ui-monospace, monospace">comment?: string</text>

    <text x="28" y="196" font-size="13" opacity="0.85">readonly: нельзя перезаписать</text>
    <text x="28" y="216" font-size="13" opacity="0.85">без знака: обязательное</text>
    <text x="28" y="236" font-size="13" opacity="0.85">со знаком ?: можно не указывать</text>
    <text x="28" y="268" font-size="13" opacity="0.85">Проверяется форма, а не имя</text>
    <text x="28" y="286" font-size="13" opacity="0.85">типа: подходит любой объект</text>
    <text x="28" y="304" font-size="13" opacity="0.85">с нужными полями.</text>

    <text x="316" y="44" font-family="ui-monospace, monospace">{ id: 1, status: "new" }</text>
    <text x="316" y="70" font-weight="700">Подходит</text>
    <text x="316" y="88" font-size="13" opacity="0.85">comment можно не указывать</text>

    <text x="316" y="144" font-family="ui-monospace, monospace">{ id: 1 }</text>
    <text x="316" y="170" font-weight="700">Ошибка TS2741</text>
    <text x="316" y="188" font-size="13" opacity="0.85">нет обязательного status</text>

    <text x="316" y="244" font-family="ui-monospace, monospace">{ id: 1, status: "new", courier: "Иван" }</text>
    <text x="316" y="270" font-weight="700">Литерал: ошибка TS2353</text>
    <text x="316" y="288" font-size="13" opacity="0.85">лишнее поле. Если сначала положить объект</text>
    <text x="316" y="304" font-size="13" opacity="0.85">в переменную, ошибки не будет.</text>
  </g>
</svg>
