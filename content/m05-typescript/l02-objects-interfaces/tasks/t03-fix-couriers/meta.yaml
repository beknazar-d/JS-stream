order: 3
title: "Три ошибки в списке курьеров"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: ts
typecheck: true
tags: [TS2741, TS2353, TS18048, необязательные свойства, interface]
hints:
  - "Направление: прочитайте три сообщения компилятора. Две ошибки в данных (пропущено обязательное поле, неверное имя поля) и одна в функции (поле может отсутствовать)."
  - "Шаг: данные поправьте по описанию Courier. В contactLine поле phone необязательное, поэтому сначала проверьте, есть ли оно, или подставьте запасное значение через ??."
  - "Почти решение: { id: 2, name: \"Ольга Смирнова\", phone: \"...\", vehicle: \"самокат\" }; { ..., phone: \"+7 900 000-00-02\" }; return courier.name + \", тел.: \" + (courier.phone ?? \"нет\");"
wrong:
  - name: data-only
    kind: partial
    explanation: "Исправлены данные, но в contactLine поле phone по-прежнему читается как обязательное. Компилятор сообщает TS18048: courier.phone возможно undefined."
  - name: optional-vehicle
    kind: common-mistake
    explanation: "Ошибка про пропущенный vehicle убрана изменением интерфейса: поле стало необязательным. Файл собирается, но Ольга так и осталась без транспорта, договорённость с другими командами нарушена, и проверка формы Courier падает."
  - name: bang
    kind: edge-case
    explanation: "Восклицательный знак courier.phone! заставил компилятор замолчать, но ошибку не исправил. У курьера без телефона код падает с TypeError в рантайме, а должен вернуть строку «тел.: нет»."
