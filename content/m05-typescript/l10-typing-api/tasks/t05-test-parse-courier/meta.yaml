order: 5
title: "Тесты для разбора курьера"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: ts
typecheck: true
tags: [тесты, валидация, Result, граничные случаи]
show: [subject/index.ts]
hints:
  - "Направление: проверьте не только счастливый путь. Для каждого правила в описании найдите значение, которое его нарушает, и проверьте, что функция отказывает."
  - "Шаг: отдельно проверьте id строкой, имя из пробелов, отсутствие поля phone и то, что в успешном значении имя без пробелов по краям."
  - "Почти решение: нужны проверки parseCourier({ id: '7', ... }).ok === false, parseCourier({ id: 7, name: '  Анна ', phone: null }) с value.name равным 'Анна' и parseCourier({ id: 7, name: 'Анна' }).ok === false."
mutants:
  - name: string-id
    description: "id превращается в число через Number(), и строка \"7\" принимается как курьер. Данные из сети с id в кавычках должны отклоняться."
  - name: name-not-trimmed
    description: "Имя проверяется на пустоту после обрезки пробелов, но в результат попадает необрезанное: \"  Анна \" остаётся с пробелами."
  - name: missing-phone-ok
    description: "Отсутствие поля phone считается нормой. Курьер без phone принимается, хотя поле обязательно (допустимо только null или строка)."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Тесты проверяют только верного курьера и пустой объект. Ни одна из трёх ошибок реализации не замечена: id строкой, пробелы вокруг имени и отсутствие phone остались без проверки."
  - name: no-missing-field
    kind: edge-case
    explanation: "Проверены строковый id, пробелы и неверные типы, но нет случая, когда поле phone отсутствует вовсе. Мутант missing-phone-ok проходит тесты незамеченным."
  - name: checks-ok-only
    kind: common-mistake
    explanation: "Для верных данных проверяется только result.ok, а значение внутри не сравнивается. Мутант, который не обрезает пробелы в имени, остаётся незамеченным."
