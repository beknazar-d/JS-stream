<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Макет карточки товара</title>
  <desc id="d">Карточка шириной 320 пикселей с рамкой 1 и отступами 16. Внутри фото 286 на 160, затем название через 12, цена через 4, кнопка высотой 40 через 16.</desc>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="20" y="20" width="320" height="380" rx="2"/>
    <rect x="37" y="37" width="286" height="160" fill="currentColor" fill-opacity="0.08"/>
    <rect x="37" y="209" width="286" height="22" stroke-dasharray="5 3"/>
    <rect x="37" y="235" width="286" height="18" stroke-dasharray="5 3"/>
    <rect x="37" y="269" width="286" height="40" rx="4" fill="currentColor" fill-opacity="0.15"/>
    <path d="M350 20 H360 M350 400 H360 M355 20 V400" opacity="0.6"/>
    <path d="M350 197 H360 M350 209 H360 M355 197 V209" opacity="0.6"/>
  </g>
  <g>
    <text x="180" y="122" text-anchor="middle">Фото 286 × 160</text>
    <text x="44" y="226">Название</text>
    <text x="44" y="249">Цена</text>
    <text x="180" y="294" text-anchor="middle">Кнопка 286 × 40</text>
    <text x="370" y="214">12 между фото и названием</text>
    <text x="370" y="247">4 между названием и ценой</text>
    <text x="370" y="262">16 между ценой и кнопкой</text>
    <text x="370" y="214" dy="-40">Рамка 1, отступы 16</text>
    <text x="370" y="214" dy="-20">Всего 320 по ширине</text>
    <text x="370" y="400">17 от кнопки до низа карточки</text>
  </g>
</svg>
