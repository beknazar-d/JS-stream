order: 4
title: "Карточка товара по макету"
type: layout
role: main
difficulty: 3
minutes: 20
language: html
tags: [блочная модель, box-sizing, margin, padding, макет]
hints:
  - "Направление: у h2 и p в браузере есть собственные внешние отступы. Для точных расстояний их нужно задать явно. Ширина 320 вместе с рамкой требует особого box-sizing."
  - "Шаг: фото, название и цена — блоки. Расстояние между ними задаёт margin-top следующего блока. Кнопка по умолчанию не растягивается: сделайте её блочной и задайте ширину."
  - "Почти решение: .card { box-sizing: border-box; width: 320px; padding: 16px; border: 1px solid #dde3ea } .title { margin: 12px 0 0 } .price { margin: 4px 0 0 } .buy { display: block; width: 100%; height: 40px; margin-top: 16px }."
wrong:
  - name: content-box
    kind: common-mistake
    explanation: "Ширина 320px задана, но box-sizing остался по умолчанию. Рамка и отступы прибавились, карточка стала 354px шириной, а содержимое шире макета на 34px."
  - name: default-margins
    kind: partial
    explanation: "Размеры карточки верные, но внешние отступы названия и цены остались браузерными. Расстояния между блоками не совпадают с макетом."
  - name: auto-button
    kind: edge-case
    explanation: "Кнопка осталась строчной и сжата по тексту. Расстояния верны, но ширина кнопки не 286px, как в макете."
