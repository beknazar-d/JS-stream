order: 1
title: "Сколько карточек влезет в строку"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [блочная модель, box-sizing, margin, padding, border]
show: [tests/snippet.js]
hints:
  - "Направление: для content-box к заданной ширине добавляются отступы и рамка с обеих сторон. Для border-box ширина уже включает padding и border."
  - "Шаг: margin в ширину самого блока не входит, но место в строке занимает. Math.floor отбрасывает дробную часть."
  - "Почти решение: для content-box 300 + 2 * 20 + 2 * 2 = 344, плюс margin с двух сторон 20, итого 364. Для border-box 300 + 20 = 320. Последние строки: сворачивание отступов берёт большее значение, обычное сложение даёт сумму."
wrong:
  - name: only-three
    kind: partial
    explanation: "Заполнены только первые три строки. Предсказать нужно каждый вызов console.log."
  - name: forgot-border
    kind: common-mistake
    explanation: "В первой строке ответ 360: рамка не посчитана. Но border входит в размер блока при content-box. Правильно: 300 + 40 + 4 + 20 = 364, и в строку влезают две карточки, а не три."
  - name: sum-margins
    kind: edge-case
    explanation: "Пятая строка 56: решение сложило отступы 24 и 32. При включённом схлопывании вертикальные отступы соседних блоков не складываются, остаётся больший: 32."
