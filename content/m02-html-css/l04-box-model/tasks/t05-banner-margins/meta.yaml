order: 5
title: "Баг: отступы вылезают из баннера"
type: fix-bug
role: main
difficulty: 3
minutes: 15
language: html
tags: [margin, схлопывание отступов, flow-root, padding]
hints:
  - "Направление: вертикальный отступ первого ребёнка может «протечь» наружу, если между ним и краем родителя нет рамки, внутреннего отступа или другого барьера."
  - "Шаг: нужно сделать родителя «барьером» для отступов детей. Для этого подходит внутренний отступ, рамка или специальное значение display, которое создаёт новый блочный контекст."
  - "Почти решение: добавьте .banner { display: flow-root }. Тогда отступы заголовка и абзаца остаются внутри баннера."
wrong:
  - name: margin-on-banner
    kind: common-mistake
    explanation: "Отступ добавлен самому баннеру. Но отступ заголовка по-прежнему протекает сквозь баннер, внутри фона отступа нет, и результат только сдвигает баннер вниз."
  - name: top-only
    kind: partial
    explanation: "Добавлен padding-top: 1px. Верхний отступ перестал протекать, но нижний отступ абзаца всё равно выходит за границу баннера."
  - name: double-space
    kind: edge-case
    explanation: "Добавлен padding: 24px 0. Теперь отступы внутри, но к ним прибавились внутренние 24px: расстояние стало 48px вместо нужных 24."
