<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
  <title id="t">Блочная модель</title>
  <desc id="d">Вложенные прямоугольники: снаружи margin, затем border, затем padding, в центре content.</desc>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="20" y="20" width="400" height="320" rx="6" stroke-dasharray="8 5" opacity="0.7"/>
    <rect x="60" y="60" width="320" height="240" rx="4" stroke-width="4"/>
    <rect x="90" y="90" width="260" height="180" rx="4" stroke-dasharray="3 3"/>
    <rect x="130" y="130" width="180" height="100" rx="4" fill="currentColor" fill-opacity="0.1"/>
  </g>
  <g text-anchor="middle">
    <text x="220" y="48" opacity="0.85">margin: внешний отступ</text>
    <text x="220" y="82" font-weight="700">border: рамка</text>
    <text x="220" y="114" opacity="0.85">padding: внутренний отступ</text>
    <text x="220" y="185" font-weight="700">content</text>
    <text x="220" y="205" font-size="12" opacity="0.85">width и height</text>
  </g>
  <g font-size="13">
    <text x="440" y="110" font-weight="700">content-box</text>
    <text x="440" y="132" opacity="0.85">width = только content</text>
    <text x="440" y="200" font-weight="700">border-box</text>
    <text x="440" y="222" opacity="0.85">width = content + padding</text>
    <text x="440" y="240" opacity="0.85">+ border</text>
    <text x="440" y="290" opacity="0.85">margin в width не входит</text>
  </g>
</svg>
