- id: landmarks
  front: Какими тремя тегами размечают шапку, основную часть и подвал страницы?
  back: "header, main, footer. Main на странице один."
- id: nav-tag
  front: Каким тегом размечают блок главного меню?
  back: "nav. Внутри него ссылки лежат в списке ul > li > a. Меню называют через aria-label."
  answer: nav
- id: h1-once
  front: Сколько h1 должно быть на странице и что в нём пишут?
  back: "Один. В нём название самой страницы или главной темы."
  answer: "1"
- id: heading-order
  front: Можно ли после h2 сразу поставить h4?
  back: "Нет. Уровни идут без пропусков: h1, h2, h3. Вернуться на уровень выше можно, перепрыгнуть вперёд нельзя."
- id: heading-size
  front: Чем выбирают уровень заголовка и чем задают его размер?
  back: "Уровень выбирают по месту в плане страницы. Размер шрифта задают CSS-классом."
- id: button-vs-link
  front: Какой тег нужен элементу, который кладёт товар в корзину, и какой тому, что ведёт на /catalog?
  back: "Действие на странице — button type=«button». Переход по адресу — a href=«/catalog»."
- id: article-aside
  front: Чем article отличается от aside?
  back: "article — самостоятельный блок, который имеет смысл сам по себе (товар, отзыв). aside — дополнение к основному (похожие товары, совет)."
- id: alt-rule
  front: Что пишут в alt у картинки товара и когда alt оставляют пустым?
  back: "Описание того, что на картинке. Пустой alt только у чисто декоративных картинок."
  answer: alt
- id: figure-time
  front: Какие теги связывают картинку с подписью и дату с машинным форматом?
  back: "figure с figcaption. time с атрибутом datetime=«2026-03-14»."
