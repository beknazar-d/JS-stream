order: 2
title: "Что найдёт проверка заголовков"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [заголовки, h1-h6, структура, массивы]
show: [tests/snippet.js]
hints:
  - "Направление: пройдите по массиву слева направо и сравнивайте каждый уровень с предыдущим. Пропуск — это когда уровень вырос больше чем на один шаг."
  - "Шаг: переход вниз (от 3 к 2) и возврат на h1 пропуском не считаются. Считаются только прыжки вперёд."
  - "Почти решение: в массиве 7 заголовков. Прыжков вперёд через уровень два: от 2 к 4 и от 1 к 3. Лишних h1 столько, сколько единиц в списке, минус одна."
wrong:
  - name: only-first
    kind: partial
    explanation: "Заполнены только первые две строки. Предсказать нужно каждый вызов console.log."
  - name: count-all-steps
    kind: common-mistake
    explanation: "Здесь считаются все изменения уровня, а не только прыжки больше одного шага. Спуск с 3 на 2 и возврат на 1 пропусками не являются."
  - name: miss-second-h1
    kind: edge-case
    explanation: "В последней строке ответ 0 лишних h1. Но в списке единица стоит дважды, значит один h1 лишний."
