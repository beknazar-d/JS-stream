order: 4
title: "Из div-каши в семантику"
type: refactor
role: main
difficulty: 3
minutes: 15
language: html
tags: [семантика, рефакторинг, article, aside, списки]
hints:
  - "Направление: пройдите страницу сверху вниз и для каждого блока спросите: что это? Шапка, меню, основное, боковое, подвал, товар, список?"
  - "Шаг: товары — это список независимых карточек, значит ul, в каждом li лежит article. Название модели в article — заголовок h2, потому что h1 уже занят названием страницы."
  - "Почти решение: header > nav > ul > li > a; main > h1 и ul > li > article > h2 + p + p; aside > h2 + p; footer > p. Лишние div убрать."
wrong:
  - name: rename-only
    kind: partial
    explanation: "Заменены только внешние блоки на header, main и footer. Меню осталось набором ссылок без списка, товары остались div, заголовков нет, совет не aside."
  - name: all-h1
    kind: common-mistake
    explanation: "Названия моделей и совет оформлены как h1, потому что «они крупные». На странице получилось пять заголовков первого уровня: структура сломана, у страницы нет одной главной темы."
  - name: lost-content
    kind: edge-case
    explanation: "Разметка семантическая, но при переписывании потерялась ссылка «Доставка» и абзац про загрузку. Рефакторинг не должен менять содержимое."
