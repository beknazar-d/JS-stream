order: 5
title: "Баг: заголовки идут вперемешку"
type: fix-bug
role: main
difficulty: 3
minutes: 15
language: html
tags: [заголовки, h1-h6, SEO, структура, CSS]
hints:
  - "Направление: выпишите заголовки страницы по порядку в виде плана: что главное, что раздел, что пункт раздела. Уровень заголовка берётся из этого плана, а не из размера шрифта."
  - "Шаг: название страницы — h1, разделы — h2, модели — h3. Логотип не заголовок, сделайте его ссылкой или абзацем. Размеры в styles.css сейчас привязаны к h1, h3, h4 и h5, переведите их на классы."
  - "Почти решение: в styles.css замените селекторы h1, h3, h4, h5 на .logo, .page-title, .product-title, .section-title с теми же font-size, а в index.html поставьте нужные теги."
wrong:
  - name: tags-only
    kind: common-mistake
    explanation: "Теги в index.html исправлены, а размеры остались привязанными к тегам. Теперь у названия страницы (h1) шрифт 14px, а у логотипа и моделей размеры случайные. Размер нельзя брать от уровня."
  - name: keep-logo-h1
    kind: partial
    explanation: "Название страницы стало h2, разделы h3, модели h4, а логотип так и остался единственным h1. Логотип не является темой страницы, у страницы нет главного заголовка."
  - name: skip-h3
    kind: edge-case
    explanation: "Модели сделаны h4 сразу после h2. Уровень h3 пропущен, а скринридер строит по заголовкам оглавление, и в нём появляется дыра."
