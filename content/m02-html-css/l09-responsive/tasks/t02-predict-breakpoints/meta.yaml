tags: [clamp, vw, медиазапросы, mobile-first]
show: [tests/snippet.js]
hints:
  - "Направление: сначала вычислите предпочтительное значение 8 + 3% от ширины, потом примените нижнюю и верхнюю границы."
  - "Шаг: на 320 px получается 8 + 9,6 = 17,6, но минимум 20. На 600 px получается 8 + 18. Для колонок смотрите, какие условия выполняются: каждое следующее перезаписывает результат."
  - "Почти решение: заголовок 20, 26, 32; колонки 1, 1, 2, 3. Граница 768 входит в условие «не меньше»."
wrong:
  - name: no-clamp-limit
    kind: common-mistake
    explanation: "Ответ 17.6 и 44 означает, что границы clamp не применены. Функция берёт среднее из трёх значений: при 17,6 она вернёт минимум 20, при 44 — максимум 32."
  - name: off-by-one
    kind: edge-case
    explanation: "Для ширины 767 ответ 2 неверен: условие width >= 768 на 767 не выполняется. Граница включительная, но 767 ещё по другую сторону."
  - name: drops-lines
    kind: partial
    explanation: "Заполнены только три строки из семи. Предсказать нужно каждый вызов console.log, в том числе колонки."
