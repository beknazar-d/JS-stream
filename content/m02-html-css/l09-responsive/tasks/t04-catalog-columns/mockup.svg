<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Макет каталога на трёх ширинах</title>
  <desc id="d">Слева экран 375 пикселей: шесть карточек в одну колонку. В центре экран 768: две колонки. Справа экран 1024: четыре колонки. Везде отступы и зазоры по 16 пикселей.</desc>
  <g stroke="currentColor" stroke-width="1.5" fill="none">
