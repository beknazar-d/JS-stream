order: 3
title: "Баг: фото чайника шире экрана телефона"
type: fix-bug
role: warmup
difficulty: 1
minutes: 8
language: html
tags: [адаптивные картинки, max-width, height auto, баг]
hints:
  - "Направление: что произойдёт с блоком шириной 800 px на экране 375 px? Какое свойство ограничивает ширину сверху и не мешает быть меньше?"
  - "Шаг: замените width: 800px на max-width: 100%. Потом посмотрите на пропорции: у картинки есть атрибут height со своим числом."
  - "Почти решение: .product__photo { display: block; max-width: 100%; height: auto; }"
wrong:
  - name: only-max-width
    kind: partial
    explanation: "Ширина ограничена, и фото помещается. Но в атрибуте height осталось 400, а CSS его не отменил: на телефоне фото сжимается по ширине и остаётся высоким, пропорции ломаются. Нужен height: auto."
  - name: width-100
    kind: common-mistake
    explanation: "width: 100% растягивает фото на всю ширину контейнера. На экране 1024 px оно раздувается больше 800 px и становится размытым. Для картинки нужен предел сверху: max-width, а не width."
  - name: hide-scroll
    kind: edge-case
    explanation: "overflow-x: hidden прячет полосу прокрутки, но фото всё так же шире экрана: покупатель видит только его левую часть. Симптом скрыт, причина осталась."
