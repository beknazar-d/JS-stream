- id: viewport-meta
  front: Какой метатег нужен каждой адаптивной странице?
  back: '<meta name="viewport" content="width=device-width, initial-scale=1">. Без него телефон рисует страницу шириной около 980 px.'
  answer: viewport
- id: mobile-first
  front: Что значит «сначала телефон» (mobile-first)?
  back: "Базовые стили написаны для телефона. Широкие экраны добавляют правила в @media (min-width: ...)."
- id: min-width-query
  front: Как записать медиазапрос «от 768 px и шире»?
  back: "@media (min-width: 768px) { ... }. Единица px обязательна: запрос с (min-width: 768) не сработает."
  answer: min-width
- id: breakpoint-choice
  front: Как выбирать контрольные точки?
  back: "По контенту, а не по моделям устройств: расширяйте окно, пока макет не начнёт выглядеть плохо, и ставьте точку там."
- id: media-order
  front: Где в файле писать медиазапросы?
  back: "После базовых правил тех же элементов. У правил одинаковая специфичность, побеждает то, что ниже."
- id: clamp-syntax
  front: Что делает font-size clamp(1rem, 0.5rem + 2vw, 1.75rem)?
  back: "Размер растёт вместе с шириной окна, но не меньше 1rem и не больше 1.75rem. Один из трёх: минимум, предпочтительное, максимум."
  answer: clamp
- id: fluid-image
  front: Какие два свойства делают картинку адаптивной?
  back: "max-width: 100% (не шире родителя) и height: auto (пропорции сохраняются)."
- id: srcset-purpose
  front: Зачем атрибут srcset у img?
  back: "Даёт браузеру несколько файлов разной ширины (400w, 800w). Он берёт подходящий по размеру места и плотности экрана."
  answer: srcset
- id: vw-unit
  front: Чему равна единица 1vw?
  back: "1% ширины окна. Размер шрифта только в vw не реагирует на масштаб страницы, поэтому его складывают с rem внутри clamp()."
