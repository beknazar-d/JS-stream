order: 5
title: "Аудит каталога скринридером"
type: fix-bug
role: main
difficulty: 3
minutes: 25
language: html
tags: [доступность, alt, label, aria-label, tabindex, button]
hints:
  - "Направление: пройдите по списку замечаний сверху вниз и для каждого выберите самый простой инструмент: label, alt, настоящий button. ARIA нужна только там, где обычного HTML не хватает."
  - "Шаг: скрытую подпись делайте через класс .visually-hidden. У ссылок «Подробнее» добавьте скрытое продолжение с названием товара. Значок svg получает aria-hidden=«true»."
  - "Почти решение: label for=«q» с классом visually-hidden; button с aria-label=«Избранное» и «Корзина»; img alt=«Электрический чайник Домотека ЧЭ-17, белый»; img.divider alt=«»; div.product__buy заменить на button; удалить все tabindex."
wrong:
  - name: half-fixed
    kind: partial
    explanation: "Подписи и alt добавлены, но кнопки «В корзину» остались div, а положительные tabindex на месте. Порядок Tab по-прежнему странный, а клавиатурой купить товар нельзя."
  - name: generic-alt
    kind: common-mistake
    explanation: "alt заполнен словом «картинка». Формально атрибут есть, но он ничего не сообщает. Хороший alt описывает, что на изображении и зачем оно здесь."
  - name: same-links
    kind: edge-case
    explanation: "Всё исправлено, кроме ссылок «Подробнее»: они по-прежнему одинаковы. Пользователь скринридера открывает список ссылок и слышит три «Подробнее» подряд без контекста."
