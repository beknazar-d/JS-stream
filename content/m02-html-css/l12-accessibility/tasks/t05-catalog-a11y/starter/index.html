<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Домотека — чайники</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a class="header__logo" href="/">Домотека</a>
    <input class="search" id="q" type="search" placeholder="Поиск по магазину">
    <button class="icon-button icon-button--fav" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="icon-button icon-button--cart" type="button" tabindex="2">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 4h2l2 12h11l2-8H6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </header>
  <main class="content">
    <h1>Чайники</h1>
    <img class="divider" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='320' height='4'%3E%3Crect width='320' height='4' fill='%23c7d2e0'/%3E%3C/svg%3E">
    <ul class="products">
      <li class="product">
        <img class="product__photo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='120'%3E%3Crect width='160' height='120' fill='%23dfe7f1'/%3E%3C/svg%3E">
        <h2 class="product__title">Чайник Домотека ЧЭ-17</h2>
        <p class="product__price">3 490 ₽</p>
        <a class="product__more" href="/p/che-17">Подробнее</a>
        <div class="product__buy" tabindex="1">В корзину</div>
      </li>
      <li class="product">
        <img class="product__photo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='120'%3E%3Crect width='160' height='120' fill='%23dfe7f1'/%3E%3C/svg%3E">
        <h2 class="product__title">Чайник Домотека ЧС-30</h2>
        <p class="product__price">5 290 ₽</p>
        <a class="product__more" href="/p/chs-30">Подробнее</a>
        <div class="product__buy" tabindex="3">В корзину</div>
      </li>
      <li class="product">
        <img class="product__photo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='120'%3E%3Crect width='160' height='120' fill='%23dfe7f1'/%3E%3C/svg%3E">
        <h2 class="product__title">Чайник Домотека ЧК-12</h2>
        <p class="product__price">2 190 ₽</p>
        <a class="product__more" href="/p/chk-12">Подробнее</a>
        <div class="product__buy" tabindex="4">В корзину</div>
      </li>
    </ul>
  </main>
</body>
</html>
