order: 4
title: "Проверка контраста по формуле WCAG"
type: implement
role: main
difficulty: 3
minutes: 25
language: js
tags: [доступность, контраст, WCAG, parseInt, строки]
hints:
  - "Направление: разделите задачу на три маленьких шага: разобрать цвет в три числа, посчитать яркость, посчитать отношение. Короткую запись #rgb сначала разверните в длинную."
  - "Шаг: для канала используйте условие из формулы (порог 0.03928) и возведение в степень через оператор **. Яркости сравните через Math.max и Math.min, чтобы порядок аргументов не имел значения."
  - "Почти решение: разбор через регулярное выражение вида /^#([0-9a-f]{3}|[0-9a-f]{6})$/i. Для трёх символов удвойте каждый (parts.map для строки не нужен, достаточно цикла или replace). Всё, что не подошло, бросает new Error('Некорректный цвет: ' + value)."
wrong:
  - name: no-short-hex
    kind: partial
    explanation: "Работает только запись из шести символов. Для #fff функция бросает ошибку, хотя короткая запись в CSS встречается повсюду."
  - name: no-linearization
    kind: common-mistake
    explanation: "Яркость считается по сырым значениям каналов без пересчёта через степень 2,4. Чёрный и белый дают правильные 21, но серые цвета выходят неверно: #767676 получает совсем другой контраст."
  - name: no-validation
    kind: edge-case
    explanation: "Некорректная запись цвета не вызывает ошибку: функция возвращает NaN, и meetsAA молча отвечает false. Опечатка в переменной CSS выглядит как «не прошло проверку», а не как ошибка в данных."
