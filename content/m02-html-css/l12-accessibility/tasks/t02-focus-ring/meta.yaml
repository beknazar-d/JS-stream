order: 2
title: "Вернуть видимый фокус"
type: fix-bug
role: warmup
difficulty: 2
minutes: 15
language: html
tags: [доступность, focus-visible, outline, клавиатура]
hints:
  - "Направление: найдите в styles.css все места, где рамка выключена. Их больше одного, и более точный селектор побеждает общий."
  - "Шаг: удалите все правила с outline: none и outline: 0. Затем добавьте одно общее правило с селектором :focus-visible."
  - "Почти решение: :focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; } — тёмно-синий на белом даёт контраст больше 3 к 1."
wrong:
  - name: links-only
    kind: partial
    explanation: "Рамка добавлена только ссылкам (a:focus-visible). Поле поиска, кнопки и список по-прежнему без фокуса: клавиатурный пользователь теряется на половине страницы."
  - name: pale-ring
    kind: common-mistake
    explanation: "Рамка есть, но светло-жёлтая на белом фоне: контраст около 1,3 к 1. Формально фокус включён, но увидеть его нельзя. Для рамки нужен контраст не меньше 3 к 1."
  - name: old-rules-left
    kind: edge-case
    explanation: "Общее правило добавили, а старые outline: none оставили. Правила с классами точнее и побеждают общее: ссылки меню и поле поиска остались без рамки."
