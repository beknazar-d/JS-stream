order: 3
title: "Что выведет проверка контраста"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [доступность, контраст, WCAG, яркость]
show: [tests/snippet.js]
hints:
  - "Направление: начните с крайних случаев. Чёрный на белом даёт наибольший контраст, белый на белом наименьший. Эти два числа вы знаете из урока."
  - "Шаг: серые цвета #767676 и #777777 различаются на единицу, а ответы будут рядом с порогом 4,5. Третий и четвёртый вызовы используют одну пару цветов, но разные пороги."
  - "Почти решение: 21.00 true, 4.54 true, затем пара #777777 даёт 4.48. Для обычного текста это false, для крупного true. Последний контраст больше 10."
wrong:
  - name: only-black-white
    kind: partial
    explanation: "Заполнены только две крайние строки. Предсказать нужно все шесть вызовов, в том числе пары у самого порога."
  - name: ignores-large
    kind: common-mistake
    explanation: "В строке 4 ответ false. Но это тот же серый цвет, только текст крупный, а для крупного текста порог 3 к 1. Размер текста меняет требование, а не цвет."
  - name: rounds-up
    kind: edge-case
    explanation: "В строке 3 ответ 4.50 true. Контраст 4,48 меньше порога 4,5, поэтому false. Требование проверяют по точному числу и не округляют в пользу автора."
