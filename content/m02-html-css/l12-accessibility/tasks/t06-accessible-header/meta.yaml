order: 6
title: "Доступная шапка магазина по макету"
type: layout
role: real
difficulty: 4
minutes: 50
language: html
tags: [доступность, вёрстка, flexbox, контраст, фокус, skip-link, aria-label]
hints:
  - "Направление: сначала соберите раскладку: шапка как flex-контейнер с переносом, логотип растягивается, форма поиска занимает всю вторую строку. Потом добавляйте доступность по пунктам критериев."
  - "Шаг: ссылка пропуска стоит первой в body, спрятана выше экрана (top: -80px) и показывается по :focus. Бейдж: position: absolute внутри кнопки с position: relative. Имя корзины: скрытый текст «Корзина, товаров: » и цифра в бейдже."
  - "Почти решение: цвета: фон шапки #0b3d91, текст белый (10 к 1), бейдж #c2410c с белым текстом (5,2 к 1), кнопка «Найти» #ffd23f с текстом #1a1a1a. Рамка фокуса в шапке: outline 3px solid #ffd23f, outline-offset 2px."
wrong:
  - name: layout-only
    kind: partial
    explanation: "Раскладка собрана верно, но доступность не добавлена: нет ссылки пропуска, у кнопок нет имён, id=«main» отсутствует. Вид совпадает с макетом, а пользоваться шапкой без мыши и без глаз нельзя."
  - name: low-contrast
    kind: common-mistake
    explanation: "Всё на месте, но бейдж белый на оранжевом #e8590c (контраст 3,6 к 1, нужно 4,5) и рамка фокуса осталась тёмно-синей на тёмно-синей шапке. Цвета выбраны на глаз и не проверены по формуле."
  - name: desktop-only
    kind: edge-case
    explanation: "Поле поиска имеет фиксированную ширину 560px. На 1024 всё выглядит верно, а на 375 шапка вылезает за экран и появляется горизонтальная прокрутка. Адаптивность нужно проверять на узкой ширине."
