<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Домотека</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a class="header__logo" href="/">Домотека</a>
    <a class="icon-button icon-button--fav" href="/favorites">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      
    </a>
    <a class="icon-button icon-button--cart" href="/cart">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2l2 12h11l2-8H6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      
      <span class="badge">3</span>
    </a>
    <form class="search" role="search" action="/search">
      <input class="search__input" id="q" type="search" name="q" placeholder="Что вы ищете?">
      <button class="search__button" type="submit">Найти</button>
    </form>
  </header>
  <main>
    <h1>Главная</h1>
  </main>
</body>
</html>
