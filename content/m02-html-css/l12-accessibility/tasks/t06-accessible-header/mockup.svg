<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">Макет шапки «Домотеки»</title>
  <desc id="d">Тёмно-синяя шапка шириной 1024 пикселя. В первой строке слева логотип, справа две кнопки 44 на 44: избранное и корзина с оранжевым значком «3». Во второй строке поле поиска на всю ширину и жёлтая кнопка «Найти». Над шапкой пунктиром показана ссылка «Перейти к содержимому», которая видна только при фокусе.</desc>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <rect x="20" y="64" width="600" height="156" fill="#0b3d91"/>
  <rect x="20" y="8" width="230" height="36" rx="6" fill="#ffd23f" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="32" y="31" fill="#1a1a1a" font-weight="600">Перейти к содержимому</text>
  <text x="262" y="31" fill="#555555" font-size="12">виден только при фокусе (Tab)</text>
  <text x="36" y="108" fill="#ffffff" font-size="22" font-weight="700">Домотека</text>
  <rect x="504" y="84" width="48" height="44" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff"/>
  <text x="528" y="111" fill="#ffffff" text-anchor="middle" font-size="12">избр.</text>
  <rect x="560" y="84" width="48" height="44" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff"/>
  <text x="584" y="111" fill="#ffffff" text-anchor="middle" font-size="12">корз.</text>
  <circle cx="602" cy="86" r="10" fill="#c2410c"/>
  <text x="602" y="91" fill="#ffffff" text-anchor="middle" font-size="12" font-weight="700">3</text>
  <rect x="36" y="144" width="460" height="44" rx="6" fill="#ffffff"/>
  <text x="48" y="171" fill="#555555">Что вы ищете?</text>
  <rect x="504" y="144" width="104" height="44" rx="6" fill="#ffd23f"/>
  <text x="556" y="171" fill="#1a1a1a" text-anchor="middle" font-weight="600">Найти</text>
  <g stroke="#444444" stroke-width="1" fill="none" font-size="12">
    <path d="M20 240 H620 M20 234 V246 M620 234 V246"/>
  </g>
  <g fill="#444444" font-size="12">
    <text x="320" y="258" text-anchor="middle">1024 px (на 375 px то же самое, поле поиска занимает всю ширину)</text>
    <text x="20" y="288">Отступ шапки слева и справа 16, между строками 12, высота кнопок и поля 44.</text>
    <text x="20" y="308">Бейдж «3»: белый текст на #c2410c, контраст не меньше 4,5 к 1.</text>
  </g>
</svg>
