<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="16" fill="currentColor">
  <title id="t">Что видит человек и что слышит скринридер</title>
  <desc id="d">Слева кнопка со значком корзины без подписи: человек видит значок, скринридер говорит только «кнопка». Справа та же кнопка с подписью «Открыть корзину»: скринридер говорит «Открыть корзину, кнопка».</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="16" y="16" width="290" height="298" rx="10" opacity="0.7"/>
    <rect x="334" y="16" width="290" height="298" rx="10" opacity="0.7"/>
    <rect x="101" y="72" width="120" height="48" rx="8"/>
    <rect x="419" y="72" width="120" height="48" rx="8"/>
    <path d="M161 120 V160 M479 120 V160"/>
    <path d="M155 152 L161 160 L167 152 M473 152 L479 160 L485 152"/>
    <rect x="56" y="160" width="210" height="48" rx="8" stroke-dasharray="6 4"/>
    <rect x="374" y="160" width="210" height="48" rx="8" stroke-dasharray="6 4"/>
    <path d="M161 208 V248 M479 208 V248"/>
    <path d="M155 240 L161 248 L167 240 M473 240 L479 248 L485 240"/>
    <rect x="56" y="248" width="210" height="48" rx="8"/>
    <rect x="374" y="248" width="210" height="48" rx="8"/>
    <path d="M141 84 h8 l4 20 h16 l3-12 h-24" stroke-width="2.5"/>
    <path d="M459 84 h8 l4 20 h16 l3-12 h-24" stroke-width="2.5"/>
  </g>

  <g text-anchor="middle">
    <text x="161" y="46" font-weight="700">Без имени</text>
    <text x="479" y="46" font-weight="700">С именем</text>
    <text x="161" y="108" font-size="12" opacity="0.8" dx="38">значок</text>
    <text x="479" y="108" font-size="12" opacity="0.8" dx="38">значок</text>
    <text x="161" y="182">дерево доступности</text>
    <text x="161" y="200" font-size="13" opacity="0.8">роль: кнопка, имени нет</text>
    <text x="479" y="182">дерево доступности</text>
    <text x="479" y="200" font-size="13" opacity="0.8">роль: кнопка, имя есть</text>
    <text x="161" y="278">«кнопка»</text>
    <text x="479" y="278" font-size="14">«Открыть корзину, кнопка»</text>
  </g>
</svg>
