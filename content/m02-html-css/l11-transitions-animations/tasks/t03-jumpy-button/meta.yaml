order: 3
title: "Баг: кнопка дёргает страницу при наведении"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: html
tags: [transition, transform, производительность, layout shift, баг]
hints:
  - "Направление: какие свойства в :hover меняют размер или положение блока в потоке страницы? Чем их можно заменить, чтобы соседи не двигались?"
  - "Шаг: подъём делает translateY(), увеличение — scale(). Оба пишутся в одно свойство transform. В transition перечислите transform и background-color."
  - "Почти решение: .add-button:hover { transform: translateY(-4px) scale(1.05); background: #095c42; } и .add-button { transition: transform 0.2s ease, background-color 0.2s ease; }"
wrong:
  - name: still-all
    kind: partial
    explanation: "В :hover размеры заменены на transform, но в основном правиле остался transition: all 0.3s. Сейчас всё работает, но любое свойство, добавленное в :hover позже, тоже поплывёт, а лишние свойства нагружают браузер."
  - name: keeps-margin
    kind: common-mistake
    explanation: "Добавили transform, но margin-top: -4px оставили. Кнопка по-прежнему меняет раскладку: подсказка под ней прыгает вверх на 4 px. Лишние свойства нужно убрать, а не добавить рядом новые."
  - name: no-transition
    kind: edge-case
    explanation: "Раскладка больше не двигается, но transition убран. Изменения происходят мгновенно, плавности нет. Исправить нужно было не отказом от перехода, а выбором другого свойства."
