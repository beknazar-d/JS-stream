hints:
  - "Направление: сначала разберитесь с valueAt: между 50% и 100% значение идёт от 1 к 0,5. Потом с progress: от времени отнимается задержка."
  - "Шаг: на 500 мс задержка ещё не прошла. На 3000 мс прошло ровно 2000 мс анимации, то есть один полный проход: остаток от деления на длительность равен нулю."
  - "Почти решение: 0.5, 0.75, 0.5, потом 0, 50, 0, 100, и последняя строка берёт значение анимации в середине прохода."
wrong:
  - name: ignores-delay
    kind: common-mistake
    explanation: "Ответ 25 в четвёртой строке значит, что задержка не учтена. На 500 мс анимация ещё не началась: задержка 1000 мс, поэтому прогресс 0. Сдвинуты и следующие строки."
  - name: iteration-boundary
    kind: edge-case
    explanation: "В шестой строке ответ 100. Но на 3000 мс закончился первый проход, а второй только начался: остаток от деления на длительность равен нулю, прогресс 0. Конец всей анимации наступит только на 5000 мс."
  - name: half-answer
    kind: partial
    explanation: "Заполнены три строки из восьми. Предсказать нужно каждый вызов console.log, в том числе тайминги."
