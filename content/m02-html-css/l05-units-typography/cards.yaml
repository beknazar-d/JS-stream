- id: rem-default
  front: Чему равен 1rem в браузере по умолчанию?
  back: "16px. Это размер шрифта корня html, пользователь может изменить его в настройках."
  answer: 16px
- id: rem-14
  front: Сколько пикселей в 0.875rem при корне 16px?
  back: "14px (0.875 × 16)."
  answer: 14px
- id: em-vs-rem
  front: От чего считаются em и rem?
  back: "em: от размера шрифта текущего элемента (для font-size: от родителя). rem: от размера шрифта корня html."
- id: em-nesting
  front: Почему вложенные списки с font-size 0.9em становятся мельче?
  back: "em считается от родителя, и множитель применяется на каждом уровне. Для шрифта в таких случаях берите rem."
- id: percent-base
  front: От чего считаются проценты в width и в font-size?
  back: "От того же свойства родителя: ширина родителя для width, размер шрифта родителя для font-size."
- id: vh-calc
  front: Сколько пикселей даёт 50vh при высоте окна 768px?
  back: "384px. 1vh — одна сотая высоты окна."
  answer: 384px
- id: line-height-unitless
  front: Почему line-height лучше писать без единиц (1.5)?
  back: "Число умножается на размер шрифта каждого элемента. 1.5em или 24px вычисляются у родителя и передаются потомкам готовой длиной."
- id: font-stack
  front: Что ставят последним в списке font-family?
  back: "Общее семейство: sans-serif, serif или monospace. Названия с пробелами пишут в кавычках."
  answer: sans-serif
- id: ch-measure
  front: Сколько символов в строке считается удобным и какой единицей ограничить колонку?
  back: "Около 60–75 символов. max-width: 65ch (ch — ширина символа 0 в текущем шрифте)."
  answer: 65ch
