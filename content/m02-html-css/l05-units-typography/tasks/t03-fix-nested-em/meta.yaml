order: 3
title: "Меню мельчает с каждым уровнем"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: html
tags: [em, rem, вложенность, меню]
hints:
  - "Направление: откройте DevTools и посмотрите вычисленный размер шрифта у пунктов разных уровней. Чем глубже, тем меньше. Сравните, от чего считается em."
  - "Шаг: em считается от размера шрифта родителя. Вложенный li берёт за основу уже уменьшенный размер. Нужна единица, которая всегда считается от корня."
  - "Почти решение: .menu li { font-size: 0.875rem; }"
wrong:
  - name: px-fixed
    kind: edge-case
    explanation: "14px на всех уровнях выглядит верно, но не реагирует на размер шрифта в браузере. При корне 20px пункты остаются 14px вместо 17.5px."
  - name: percent-compounds
    kind: common-mistake
    explanation: "Проценты в font-size, как и em, считаются от родителя. 87.5% на каждом уровне снова уменьшает размер: второй уровень получает 12.25px, третий 10.7px."
  - name: second-level-only
    kind: partial
    explanation: "Исправлен только второй уровень. Третий пункт всё ещё считается от второго и остаётся мельче 14px."
