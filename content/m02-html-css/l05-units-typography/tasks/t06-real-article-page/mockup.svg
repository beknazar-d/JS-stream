<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Макет: страница статьи</title>
  <desc id="d">Окно 1024 на 768. Сверху блок hero высотой 40 процентов окна, внутри по центру заголовок h1 размером 2,5 rem. Ниже колонка статьи по центру: вводный абзац 1,25 rem, заголовок h2 1,75 rem, абзацы по 60–75 символов, цитата с отступом слева, список.</desc>
