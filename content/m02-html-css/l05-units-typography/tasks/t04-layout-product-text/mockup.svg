<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Макет: текстовая колонка карточки товара</title>
  <desc id="d">Окно шириной 1024 пикселя. По центру колонка с заголовком 2rem, ценой 1.5rem, вводным абзацем 1.25rem и двумя абзацами основного текста 1rem. Ширина строки основного текста от 60 до 75 символов. Слева и справа от колонки равные поля.</desc>
  <rect x="10" y="10" width="620" height="400" rx="6" fill="none" stroke="currentColor" opacity="0.6"/>
  <text x="20" y="30" font-size="12" opacity="0.7">окно 1024px</text>
  <rect x="150" y="50" width="340" height="340" fill="none" stroke="currentColor" stroke-dasharray="6 4"/>
  <text x="320" y="44" text-anchor="middle" font-size="12" opacity="0.8">колонка по центру, поля равны</text>
  <rect x="170" y="70" width="230" height="22" rx="3" opacity="0.35"/>
  <text x="408" y="86" font-size="12">h1, 2rem</text>
  <rect x="170" y="108" width="80" height="16" rx="3" opacity="0.35"/>
  <text x="258" y="121" font-size="12">цена, 1.5rem</text>
  <rect x="170" y="140" width="290" height="14" rx="3" opacity="0.25"/>
  <rect x="170" y="160" width="190" height="14" rx="3" opacity="0.25"/>
  <text x="370" y="172" font-size="12">вводный, 1.25rem</text>
  <g opacity="0.2">
    <rect x="170" y="192" width="300" height="9" rx="2"/><rect x="170" y="210" width="300" height="9" rx="2"/>
    <rect x="170" y="228" width="300" height="9" rx="2"/><rect x="170" y="246" width="210" height="9" rx="2"/>
    <rect x="170" y="274" width="300" height="9" rx="2"/><rect x="170" y="292" width="300" height="9" rx="2"/>
    <rect x="170" y="310" width="300" height="9" rx="2"/><rect x="170" y="328" width="150" height="9" rx="2"/>
  </g>
  <text x="500" y="260" font-size="12">основной, 1rem</text>
  <text x="500" y="276" font-size="12">60–75 символов</text>
  <text x="500" y="292" font-size="12">в строке</text>
  <text x="500" y="308" font-size="12">line-height 1.5–1.8</text>
</svg>
