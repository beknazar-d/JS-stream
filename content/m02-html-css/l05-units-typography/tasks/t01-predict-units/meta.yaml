order: 1
title: "Пиксели макета и вложенные em"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [rem, em, единицы, пересчёт]
show: [tests/snippet.js]
hints:
  - "Направление: идите по строкам по одной. Для каждой запишите, что именно считается: деление на корень, умножение от родителя или длина строки."
  - "Шаг: строка с единицей внутри деления не превращается в число, получится NaN. Вложенные em умножаются друг на друга: первый уровень 16 × 1.5, второй — результат первого × 1.5."
  - "Почти решение: первые три строки — 1.5, 0.875, 2.5rem. Дальше NaN и 1.25. Вложенные блоки дают 36, а rem на любом уровне даёт 24. Последняя строка — 65."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Заполнена только первая половина. Нужно предсказать каждый вызов console.log, включая вложенные em и длину строки."
  - name: em-not-nested
    kind: common-mistake
    explanation: "В строке про три вложенных блока ответ 24: так было бы при rem. Но em считается от родителя, и множитель 1.5 применяется дважды: 16 × 1.5 × 1.5 = 36."
  - name: parsed-px-string
    kind: edge-case
    explanation: "В четвёртой строке ответ 1.25: так получится после Number.parseFloat. Но строка с px делится напрямую, и результат NaN."
