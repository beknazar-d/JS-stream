<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
  <title id="t">rem и em во вложенных блоках</title>
  <desc id="d">Слева три блока по 1,25 rem, все по 20 пикселей. Справа три блока по 1,25 em: 20, 25 и 31,25 пикселя.</desc>
  <g font-weight="700" text-anchor="middle">
    <text x="160" y="28">rem: от корня</text>
    <text x="480" y="28">em: от родителя</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="30" y="44" width="260" height="236" rx="8" opacity="0.6"/>
    <rect x="350" y="44" width="260" height="236" rx="8" opacity="0.6"/>
    <rect x="50" y="90" width="220" height="40" rx="4"/>
    <rect x="50" y="150" width="220" height="40" rx="4"/>
    <rect x="50" y="210" width="220" height="40" rx="4"/>
    <rect x="370" y="90" width="220" height="40" rx="4"/>
    <rect x="370" y="150" width="220" height="56" rx="4"/>
    <rect x="370" y="222" width="220" height="48" rx="4"/>
  </g>
  <g font-size="12" opacity="0.8">
    <text x="42" y="68">html: 16px</text>
    <text x="362" y="68">html: 16px</text>
  </g>
  <g>
    <text x="60" y="115">уровень 1: 20px</text>
    <text x="60" y="175">уровень 2: 20px</text>
    <text x="60" y="235">уровень 3: 20px</text>
    <text x="380" y="115">уровень 1: 20px</text>
    <text x="380" y="183" font-size="16">уровень 2: 25px</text>
    <text x="380" y="248" font-size="18">уровень 3: 31,25px</text>
  </g>
</svg>
