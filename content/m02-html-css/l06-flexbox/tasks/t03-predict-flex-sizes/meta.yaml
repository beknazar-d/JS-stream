order: 3
title: "Как Flexbox делит место"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [flex-grow, flex-shrink, flex-basis]
show: [tests/snippet.js]
hints:
  - "Направление: для каждого вызова найдите, больше или меньше места, чем нужно по базе. Если больше, работает grow, если меньше, работает shrink."
  - "Шаг: при избытке место делится по долям grow. При нехватке каждый элемент уменьшается пропорционально своей базе, умноженной на shrink. Элемент с shrink 0 не уменьшается."
  - "Почти решение: 200, 200, 200. Потом 250, 250. Третья строка 100, 100, 100. В четвёртой нехватка 150: убирается 75, 50 и 25. В пятой нехватку делят только вторые два: 300, 100, 50."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Заполнены только три строки из пяти. Нужно предсказать все вызовы console.log, включая случаи нехватки места."
  - name: shrink-ignored
    kind: common-mistake
    explanation: "В последней строке ответ 225, 150, 75: так было бы, если бы первый элемент тоже сжимался. Но у него flex-shrink: 0, поэтому он остаётся 300, а нехватку делят два других: 100 и 50."
  - name: grow-equal
    kind: edge-case
    explanation: "Во второй строке ответ 300, 200: так выходит при равных долях, когда свободные 200px делятся пополам. Но у второго элемента grow равен 3, и свободное место делится 1 к 3: 200 + 50 и 100 + 150, то есть 250 и 250."
