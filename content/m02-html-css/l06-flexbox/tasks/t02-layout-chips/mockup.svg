<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Макет: плитки категорий</title>
  <desc id="d">Контейнер шириной 480 пикселей. Плитки категорий идут слева направо с промежутком 12 пикселей и переносятся на новые строки с промежутком 8 пикселей между строками. Каждая строка начинается у левого края.</desc>
  <rect x="40" y="30" width="480" height="190" fill="none" stroke="currentColor" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="40" y="22" font-size="12" opacity="0.8">контейнер 480px</text>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="40" width="130" height="34" rx="17"/><rect x="182" y="40" width="190" height="34" rx="17"/><rect x="384" y="40" width="130" height="34" rx="17"/>
    <rect x="40" y="82" width="100" height="34" rx="17"/><rect x="152" y="82" width="150" height="34" rx="17"/><rect x="314" y="82" width="110" height="34" rx="17"/>
    <rect x="40" y="124" width="90" height="34" rx="17"/><rect x="142" y="124" width="130" height="34" rx="17"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="105" y="62">Холодильники</text><text x="277" y="62">Стиральные машины</text><text x="449" y="62">Чайники</text>
    <text x="90" y="104">Пылесосы</text><text x="227" y="104">Микроволновки</text><text x="369" y="104">Блендеры</text>
    <text x="85" y="146">Утюги</text><text x="207" y="146">Кофемашины</text>
  </g>
  <g stroke="currentColor"><path d="M170 57 H182"/><path d="M60 74 V82"/></g>
  <text x="530" y="60" font-size="12">gap по строке 12px</text>
  <text x="530" y="92" font-size="12">gap между строками 8px</text>
</svg>
