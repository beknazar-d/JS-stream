order: 5
title: "Порядок в разметке вместо order"
type: refactor
role: main
difficulty: 3
minutes: 15
language: html
tags: [order, доступность, порядок фокуса]
hints:
  - "Направление: сейчас порядок «название, цена, кнопка» получается только на экране, а в разметке он обратный. Проверьте клавишей Tab, куда попадает фокус первым."
  - "Шаг: переставьте элементы в index.html так, как они идут на экране, и удалите все order из styles.css. Остальные свойства оставьте."
  - "Почти решение: в каждом li сначала a.title, потом span.price, потом button.btn. В CSS остаются display: flex, gap, flex: 1 у .title, а строки с order удалены."
wrong:
  - name: remove-order-only
    kind: partial
    explanation: "Свойства order удалены, но разметка прежняя. Теперь на экране порядок обратный: кнопка, цена, название. Внешний вид изменился, а его нужно сохранить."
  - name: row-reverse
    kind: common-mistake
    explanation: "flex-direction: row-reverse возвращает нужный вид, но порядок в разметке по-прежнему обратный. Клавиша Tab снова попадает сначала на кнопку. Это тот же приём, что и order: меняется только картинка."
  - name: keep-one-order
    kind: edge-case
    explanation: "Разметка переставлена, но в CSS осталась строка order: 0 у кнопки. Значение нейтральное, но задача — убрать приём совсем, и проверка ищет свойство order в styles.css."
