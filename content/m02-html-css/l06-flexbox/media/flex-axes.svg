  <text x="44" y="252">главная ось (justify-content)</text>
  <text x="30" y="270" opacity="0.8">поперечная ось (align-items) — сверху вниз</text>
  <text x="344" y="252" opacity="0.8">поперечная ось (align-items)</text>
  <text x="344" y="270">главная ось (justify-content) — сверху вниз</text>
