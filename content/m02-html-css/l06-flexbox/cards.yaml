- id: flex-enable
  front: Что нужно написать у родителя, чтобы потомки стали гибкими элементами?
  back: "display: flex. Остальные свойства контейнера работают только после этого."
  answer: "display: flex"
- id: main-axis
  front: Какое свойство выравнивает элементы вдоль главной оси, а какое поперёк?
  back: "justify-content: вдоль главной оси. align-items: вдоль поперечной."
- id: column-axes
  front: "Что происходит с осями при flex-direction: column?"
  back: "Оси меняются местами: главная идёт сверху вниз, поперечная слева направо. justify-content теперь работает по вертикали."
- id: gap-vs-margin
  front: Чем gap лучше margin для промежутков между элементами?
  back: "gap ставит промежуток только между элементами, без лишнего отступа у первого и последнего."
- id: space-between
  front: "Что делает justify-content: space-between?"
  back: "Первый элемент у начала, последний у конца, свободное место делится поровну между элементами."
  answer: space-between
- id: flex-one
  front: "Что означает flex: 1 и чем он отличается от flex: auto?"
  back: "flex: 1 = grow 1, shrink 1, basis 0: элементы делят место поровну. flex: auto берёт ширину из содержимого, поэтому ширины разные."
- id: flex-wrap
  front: Как разрешить элементам переходить на новую строку?
  back: "flex-wrap: wrap на контейнере. Без него элементы сжимаются или вылезают."
  answer: "flex-wrap: wrap"
- id: shrink-zero
  front: Как запретить кнопке сжиматься в узкой строке?
  back: "flex-shrink: 0 на самой кнопке."
  answer: "flex-shrink: 0"
- id: margin-auto
  front: Как прижать кнопку к низу карточки, если карточка — flex-колонка?
  back: "margin-top: auto у кнопки: автоотступ забирает всё свободное место сверху."
- id: order-a11y
  front: Чем плох order для доступности?
  back: "Меняет только внешний вид. Клавиша Tab и экранный диктор идут по порядку в HTML, и он расходится с тем, что видно на экране. Меняйте разметку."
