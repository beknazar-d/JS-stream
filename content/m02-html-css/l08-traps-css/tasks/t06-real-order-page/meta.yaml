order: 6
title: "Ревью страницы заказа: четыре ловушки"
type: fix-bug
role: real
difficulty: 4
minutes: 30
language: html
tags: [специфичность, схлопывание, height, min-width, overflow-wrap, ревью]
hints:
  - "Направление: пройдите по симптомам по одному. Меню обрывается, заголовок прилип, страница ползёт вбок, активный пункт серый. Для каждого найдите из шести ловушек урока свою."
  - "Шаг: меню: процент высоты не работает без высоты родителя, дайте высоту родителю через min-height в vh. Заголовок: отступ ребёнка уходит наружу, верните его в блок. Прокрутка: flex-элемент и длинное слово. Активный пункт: перебивает идентификатор, понизьте вес правила."
  - "Почти решение: .layout { min-height: 100vh; } убрать height: 100% у .sidebar; .summary { display: flow-root; } .content { min-width: 0; } .note { overflow-wrap: anywhere; } #nav a заменить на .sidebar a."
wrong:
  - name: important-on-active
    kind: common-mistake
    explanation: "Активный пункт исправлен через !important. Цвет стал белым, но это та самая война важностей из урока: следующему правилу снова придётся добавлять !important."
  - name: break-word-only
    kind: edge-case
    explanation: "Для комментария добавлен overflow-wrap: break-word, а у .content нет min-width: 0. Значение break-word не уменьшает минимальную ширину гибкого элемента, поэтому длинная ссылка по-прежнему раздвигает страницу."
  - name: no-flow-root
    kind: partial
    explanation: "Меню, прокрутка и активный пункт исправлены, но отступ заголовка по-прежнему уходит через родителя наружу: жёлтый блок смещён вниз, а заголовок прижат к его верху."
