order: 1
title: "Кто победит среди селекторов"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [специфичность, каскад, селекторы]
show: [tests/snippet.js]
hints:
  - "Направление: сначала посчитайте тройку для каждого селектора: идентификаторы, потом классы с атрибутами и псевдоклассами, потом теги. Сравнивайте слева направо."
  - "Шаг: каждый вызов winner сравнивает две тройки. Первое отличающееся число решает. Если тройки равны, возвращается второй селектор. Атрибут [disabled] и псевдокласс :hover считаются как классы."
  - "Почти решение: первые пять строк — 0,0,1; 0,2,0; 0,1,3; 1,2,0; 0,1,1. Победители: .card .price; потом при равных тройках последний — .price; идентификатор побеждает: #promo; в последней строке .note (0,1,0) против main p (0,0,2)."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Заполнены только пять строк с тройками, а победители не определены. Нужно предсказать каждый вызов console.log."
  - name: more-classes-win
    kind: common-mistake
    explanation: "В восьмой строке ответ .card.sale.hit.new: так считают, если вес — это просто число селекторов. Но идентификатор весит больше любого числа классов: тройка 1,0,0 больше 0,4,0."
  - name: tie-first-wins
    kind: edge-case
    explanation: "В седьмой строке ответ .sale: у двух классов одинаковый вес 0,1,0, и тогда побеждает правило ниже по тексту. winner возвращает второй селектор .price."
