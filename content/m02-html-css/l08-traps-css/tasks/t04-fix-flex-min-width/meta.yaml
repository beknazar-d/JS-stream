order: 4
title: "Сумма заказа выпала из строки"
type: fix-bug
role: main
difficulty: 3
minutes: 15
language: html
tags: [flex, min-width, overflow-wrap, длинное слово]
hints:
  - "Направление: откройте DevTools и посмотрите ширину .order-name. Она больше свободного места. По умолчанию гибкий элемент не бывает уже самого длинного слова внутри."
  - "Шаг: нужны два изменения у .order-name: разрешить элементу сжиматься и разрешить слову переноситься. Для второго подойдёт значение, которое учитывается при расчёте минимальной ширины."
  - "Почти решение: .order-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }"
wrong:
  - name: break-word-only
    kind: common-mistake
    explanation: "overflow-wrap: break-word переносит слово визуально, но не уменьшает минимальную ширину гибкого элемента. Строка по-прежнему выталкивает сумму. Сработал бы anywhere или min-width: 0 с переносом."
  - name: ellipsis-cut
    kind: edge-case
    explanation: "Название обрезано троеточием: строка встала на место, но менеджер больше не видит полное название заказа. По задаче название должно быть видно целиком."
  - name: min-width-only
    kind: partial
    explanation: "min-width: 0 разрешил элементу сжаться, но слово не умеет переноситься. Оно торчит за границу блока и налезает на сумму."
