<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Карта шести ловушек CSS</title>
  <desc id="d">Таблица из трёх колонок и шести строк: ловушка, симптом и лекарство.</desc>
