- id: specificity-triple
  front: Как считается вес селектора?
  back: "Тройка чисел: идентификаторы, классы (атрибуты, псевдоклассы), теги. Сравнивают слева направо; при равенстве побеждает правило ниже по тексту."
- id: id-vs-classes
  front: Может ли много классов перебить один идентификатор?
  back: "Нет. 1,0,0 больше любого 0,N,N."
  answer: "нет"
- id: no-important
  front: Как переопределить стиль без !important?
  back: "Понизить вес исходного правила или поднять вес нового (добавить класс). !important порождает войну важностей."
- id: margin-collapse
  front: Какое расстояние между блоками с отступами 24px и 16px, если отступы схлопываются?
  back: "24px: берётся больший. Отрицательный отступ вычитается: 24 и -8 дают 16."
  answer: "24px"
- id: flow-root
  front: Как оставить отступ первого ребёнка внутри родителя?
  back: "display: flow-root у родителя (или padding или рамка)."
  answer: "display: flow-root"
- id: min-width-zero
  front: "Что делает min-width: 0 у flex-элемента?"
  back: "Разрешает элементу сжиматься уже его содержимого. По умолчанию минимум равен ширине самого длинного слова."
- id: overflow-wrap
  front: Какое свойство разрешает переносить длинное слово и учитывается при расчёте flex?
  back: "overflow-wrap: anywhere. Значение break-word переносит, но не уменьшает минимальную ширину элемента."
  answer: "overflow-wrap: anywhere"
- id: ellipsis-recipe
  front: Из каких трёх свойств состоит обрезание строки с многоточием?
  back: "white-space: nowrap; overflow: hidden; text-overflow: ellipsis."
- id: z-index-position
  front: Когда z-index работает?
  back: "У позиционированных элементов (position не static) и у дочерних элементов flex и grid. У обычного блока в потоке не работает."
- id: height-percent
  front: "Почему height: 100% не растягивает блок на высоту окна?"
  back: "Процент считается от высоты родителя. Если у родителя height: auto, процент превращается в auto. Используйте min-height: 100vh."
