<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13">
  <title id="t">Макеты карточки товара на 375 и 1024</title>
  <desc id="d">Слева телефон шириной 375: одна колонка. Картинка на всю ширину с отступами 16, три миниатюры в ряд, заголовок, цена, кнопка на всю ширину высотой не меньше 44, характеристики. Справа десктоп от 900: две колонки, галерея 480 и информация.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="20" y="16" width="150" height="330" rx="8" fill="none" stroke="#555555"/>
  <text x="95" y="34" text-anchor="middle" fill="#334155" font-weight="700">375 px</text>
  <rect x="32" y="44" width="126" height="94" rx="4" fill="#dfe7f1" stroke="#6b7a90"/>
  <g fill="#dfe7f1" stroke="#6b7a90"><rect x="32" y="144" width="38" height="28"/><rect x="76" y="144" width="38" height="28"/><rect x="120" y="144" width="38" height="28"/></g>
  <text x="32" y="196" fill="#1a1a1a" font-weight="700" font-size="15">Чайник ЧЭ-17</text>
  <text x="32" y="216" fill="#1a1a1a" font-weight="700">3 490 ₽</text>
  <rect x="32" y="228" width="126" height="26" rx="5" fill="#0b3d91"/>
  <text x="95" y="245" text-anchor="middle" fill="#ffffff">В корзину (на всю ширину)</text>
  <text x="32" y="276" fill="#4b5563">Объём  1,7 л</text>
  <text x="32" y="294" fill="#4b5563">Мощность  2200 Вт</text>
  <text x="95" y="330" text-anchor="middle" fill="#334155" font-size="11">отступы по 16 px</text>
  <rect x="200" y="16" width="420" height="330" rx="8" fill="none" stroke="#555555"/>
  <text x="410" y="34" text-anchor="middle" fill="#334155" font-weight="700">от 900 px (две колонки)</text>
  <rect x="216" y="44" width="190" height="142" rx="4" fill="#dfe7f1" stroke="#6b7a90"/>
  <g fill="#dfe7f1" stroke="#6b7a90"><rect x="216" y="194" width="38" height="28"/><rect x="260" y="194" width="38" height="28"/><rect x="304" y="194" width="38" height="28"/></g>
  <text x="426" y="60" fill="#1a1a1a" font-weight="700" font-size="16">Чайник Домотека ЧЭ-17</text>
  <text x="426" y="86" fill="#1a1a1a" font-weight="700">3 490 ₽</text>
  <rect x="426" y="98" width="80" height="26" rx="5" fill="#0b3d91"/>
  <text x="466" y="115" text-anchor="middle" fill="#ffffff">В корзину</text>
  <text x="426" y="148" fill="#4b5563">Объём  1,7 л</text>
  <text x="311" y="244" text-anchor="middle" fill="#334155" font-size="11">галерея 480</text>
  <text x="426" y="170" fill="#334155" font-size="11">зазор 32 между колонками</text>
  <text x="410" y="320" text-anchor="middle" fill="#334155" font-size="11">в одну колонку при ширине 899 и меньше, зазор 24</text>
</svg>
