order: 2
title: "Карточка товара: адаптив на 375, 768 и 1024"
type: fix-bug
role: warmup
difficulty: 3
minutes: 30
language: html
tags: [проект P2, адаптив, медиазапросы, mobile-first, aspect-ratio]
hints:
  - "Направление: найдите все фиксированные ширины: у .product, .product__image, .product__thumb, .product__buy. Замените их на значения, которые зависят от окна, и вынесите десктопную раскладку в медиазапрос."
  - "Шаг: пишите от узкого экрана: по умолчанию одна колонка, ширина min(960px, calc(100% - 32px)), картинка width: 100% с aspect-ratio: 4 / 3. Две колонки включайте в @media (min-width: 900px)."
  - "Почти решение: в @media (min-width: 600px) заголовок 32px и кнопка 200px. В @media (min-width: 900px) колонки 480px 1fr, зазор 32px и миниатюры repeat(3, 96px)."
wrong:
  - name: tablet-only
    kind: partial
    explanation: "Одна колонка включается на планшете, но на 375 заголовок остался 32px, а кнопка 200px вместо полной ширины. Адаптив нужно проверять на самой узкой ширине, не только на средней."
  - name: hide-overflow
    kind: common-mistake
    explanation: "Горизонтальная прокрутка спрятана через overflow-x: hidden, а фиксированные ширины остались. Страница перестала прокручиваться, но картинка по-прежнему выходит за край и обрезана."
  - name: max-width-900
    kind: edge-case
    explanation: "Граница сдвинута на один пиксель: две колонки начинаются с 901px. На ровно 900px карточка остаётся в одной колонке, хотя по требованию две. На границах медиазапросов ошибаются чаще всего."
