<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="12">
  <title id="t">Макет панели менеджера на 1024 и 375</title>
  <desc id="d">Слева панель на ширине 1024. Заголовок. Три карточки сводки в ряд, третья «Нет в наличии» с жирной оранжевой рамкой слева. Строка фильтров: поиск, список статусов, кнопка «Сбросить». Таблица заказов. Внизу кнопки «Назад» и «Вперёд» по краям и «Страница 1 из 5» по центру. Справа версия на 375: карточки и фильтры друг под другом, таблица в рамке с прокруткой, пейджер в одну строку.</desc>
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="20" y="22" font-weight="700" fill="#334155">1024 px</text>
  <text x="20" y="48" font-size="16" font-weight="700" fill="#1a1a1a">Панель менеджера</text>
  <g fill="#ffffff" stroke="#9aa5b1"><rect x="20" y="58" width="130" height="52" rx="6"/><rect x="156" y="58" width="130" height="52" rx="6"/><rect x="292" y="58" width="130" height="52" rx="6"/></g>
  <rect x="292" y="58" width="4" height="52" fill="#c2410c"/>
  <g fill="#4b5563" font-size="11"><text x="30" y="76">Новые заказы</text><text x="166" y="76">В доставке</text><text x="304" y="76">Нет в наличии</text></g>
  <g fill="#1a1a1a" font-size="20" font-weight="700"><text x="30" y="100">12</text><text x="166" y="100">7</text><text x="304" y="100">3</text></g>
  <g fill="#ffffff" stroke="#6b7280"><rect x="20" y="124" width="248" height="26" rx="4"/><rect x="278" y="124" width="90" height="26" rx="4"/></g>
  <rect x="378" y="124" width="64" height="26" rx="4" fill="#ffffff" stroke="#0b3d91"/>
  <text x="30" y="141" fill="#6b7280">Номер или клиент</text><text x="288" y="141" fill="#1a1a1a">Все статусы</text><text x="410" y="141" text-anchor="middle" fill="#0b3d91" font-weight="700">Сбросить</text>
  <rect x="20" y="162" width="422" height="20" fill="#f3f4f6"/>
  <g fill="#1a1a1a" font-weight="700" font-size="11"><text x="28" y="176">№</text><text x="70" y="176">Клиент</text><text x="190" y="176">Статус</text><text x="340" y="176" text-anchor="end">Сумма</text><text x="360" y="176">Дата</text></g>
  <g stroke="#e5e7eb"><path d="M20 206 H442 M20 230 H442 M20 254 H442 M20 278 H442"/></g>
  <rect x="186" y="188" width="56" height="14" rx="7" fill="#dcfce7"/><rect x="186" y="212" width="56" height="14" rx="7" fill="#dbeafe"/><rect x="186" y="260" width="70" height="14" rx="7" fill="#ffedd5"/>
  <text x="214" y="199" text-anchor="middle" fill="#166534" font-size="10">Оплачен</text><text x="214" y="223" text-anchor="middle" fill="#1e40af" font-size="10">В доставке</text><text x="221" y="271" text-anchor="middle" fill="#9a3412" font-size="10">Ждёт поставки</text>
  <rect x="20" y="292" width="64" height="26" rx="4" fill="#e5e7eb"/><text x="52" y="309" text-anchor="middle" fill="#6b7280">Назад</text>
  <text x="231" y="309" text-anchor="middle" fill="#374151">Страница 1 из 5</text>
  <rect x="378" y="292" width="64" height="26" rx="4" fill="#0b3d91"/><text x="410" y="309" text-anchor="middle" fill="#ffffff">Вперёд</text>
  <text x="231" y="342" text-anchor="middle" fill="#334155" font-size="11">карточки равной ширины, зазор 16; фильтры в ряд</text>
  <text x="231" y="358" text-anchor="middle" fill="#334155" font-size="11">колонки таблицы 110 | остаток | 140 | 120 | 120</text>
  <text x="231" y="374" text-anchor="middle" fill="#334155" font-size="11">новый статус «Ждёт поставки» и карточка «Нет в наличии»</text>
  <text x="520" y="22" text-anchor="middle" font-weight="700" fill="#334155">375 px</text>
  <rect x="470" y="30" width="100" height="400" rx="8" fill="none" stroke="#555555"/>
  <g fill="#ffffff" stroke="#9aa5b1"><rect x="478" y="56" width="84" height="30" rx="4"/><rect x="478" y="92" width="84" height="30" rx="4"/><rect x="478" y="128" width="84" height="30" rx="4"/></g>
  <rect x="478" y="128" width="3" height="30" fill="#c2410c"/>
  <g fill="#ffffff" stroke="#6b7280"><rect x="478" y="170" width="84" height="22" rx="3"/><rect x="478" y="196" width="84" height="22" rx="3"/></g>
  <rect x="478" y="222" width="84" height="22" rx="3" fill="#ffffff" stroke="#0b3d91"/>
  <rect x="478" y="256" width="84" height="64" fill="#f3f4f6" stroke="#9aa5b1" stroke-dasharray="3 3"/>
  <text x="520" y="292" text-anchor="middle" fill="#334155" font-size="10">прокрутка</text>
  <rect x="478" y="334" width="26" height="18" rx="3" fill="#e5e7eb"/><rect x="536" y="334" width="26" height="18" rx="3" fill="#0b3d91"/>
  <text x="520" y="347" text-anchor="middle" fill="#374151" font-size="9">1 из 5</text>
  <text x="520" y="380" text-anchor="middle" fill="#334155" font-size="10">до 599: всё столбиком,</text>
  <text x="520" y="394" text-anchor="middle" fill="#334155" font-size="10">пейджер в одну строку</text>
</svg>
