order: 6
title: "Панель менеджера: итоговая сборка"
type: layout
role: real
difficulty: 4
minutes: 75
language: html
tags: [проект P2, Grid, Flexbox, адаптив, таблица, доступность, изменение требований]
hints:
  - "Направление: работайте от узкого экрана. Сначала стили для телефона: всё в одну колонку. Потом один @media (min-width: 600px) раскладывает сводку и фильтры в ряд. Таблицу и статусы возьмите из прошлого этапа."
  - "Шаг: сводка .kpis сетка, на телефоне колонка с зазором 12, от 600 repeat(3, 1fr) с зазором 16. Фильтры flex-колонкой, от 600 строкой: поиск flex: 1, список 200px. Пейджер flex с justify-content: space-between."
  - "Почти решение: общий :focus-visible с outline 3px solid #0b57d0 и outline-offset 2px. Новое требование: .kpi--warning с border-left 4px solid #c2410c и .status--backorder с фоном #ffedd5 и цветом #9a3412 (около 6,4 к 1)."
wrong:
  - name: desktop-only
    kind: edge-case
    explanation: "Всё сверстано под широкий экран. На 375 три карточки сводки остаются в ряд и сжимаются, фильтры не умещаются. Адаптив нужно проверять на самой узкой ширине сразу, а не дописывать «потом»."
  - name: low-contrast
    kind: common-mistake
    explanation: "Раскладка точна, но новый статус «Ждёт поставки» оранжевый на светло-оранжевом (около 2 к 1), а подписи сводки светло-серые. Цвета выбраны на глаз. Каждую пару нужно проверять числом."
  - name: old-requirements
    kind: partial
    explanation: "Сделано всё из первой версии, а новое требование потеряно: карточка «Нет в наличии» не выделена, статус «Ждёт поставки» остался без цвета. Изменения требований проверяются так же строго, как исходные."
