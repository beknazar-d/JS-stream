<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="12">
  <title id="t">Макет таблицы заказов на ширине 1024</title>
  <desc id="d">Таблица шириной 960 с пятью колонками: номер заказа 110, клиент (остаток), статус 140, сумма 120 по правому краю, дата 120. Серая шапка высотой 44, четыре строки по 48 с тонкими линиями. Статусы в цветных бейджах. На телефоне таблица прокручивается внутри рамки.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="18" font-weight="700" fill="#1a1a1a">Заказы</text>
  <rect x="20" y="36" width="600" height="28" fill="#f3f4f6"/>
  <g font-weight="700" fill="#1a1a1a"><text x="30" y="55">№ заказа</text><text x="98" y="55">Клиент</text><text x="388" y="55">Статус</text><text x="548" y="55" text-anchor="end">Сумма</text><text x="560" y="55">Дата</text></g>
  <g stroke="#e5e7eb"><path d="M20 94 H620 M20 124 H620 M20 154 H620 M20 184 H620"/></g>
  <g fill="#1a1a1a">
    <text x="30" y="84">ДМ-1042</text><text x="98" y="84">Ирина Соколова</text><text x="548" y="84" text-anchor="end">12 480 ₽</text><text x="560" y="84">11.10.2026</text>
    <text x="30" y="114">ДМ-1043</text><text x="98" y="114">Павел Громов</text><text x="548" y="114" text-anchor="end">5 290 ₽</text><text x="560" y="114">11.10.2026</text>
    <text x="30" y="144">ДМ-1044</text><text x="98" y="144">Ольга Ким</text><text x="548" y="144" text-anchor="end">2 190 ₽</text><text x="560" y="144">10.10.2026</text>
    <text x="30" y="174">ДМ-1045</text><text x="98" y="174">Сергей Лебедев</text><text x="548" y="174" text-anchor="end">7 990 ₽</text><text x="560" y="174">09.10.2026</text>
  </g>
  <rect x="384" y="70" width="64" height="18" rx="9" fill="#dcfce7"/><text x="416" y="83" text-anchor="middle" fill="#166534" font-weight="700" font-size="11">Оплачен</text>
  <rect x="384" y="100" width="76" height="18" rx="9" fill="#dbeafe"/><text x="422" y="113" text-anchor="middle" fill="#1e40af" font-weight="700" font-size="11">В доставке</text>
  <rect x="384" y="130" width="84" height="18" rx="9" fill="#fef3c7"/><text x="426" y="143" text-anchor="middle" fill="#92400e" font-weight="700" font-size="11">Ждёт оплаты</text>
  <rect x="384" y="160" width="64" height="18" rx="9" fill="#fee2e2"/><text x="416" y="173" text-anchor="middle" fill="#991b1b" font-weight="700" font-size="11">Отменён</text>
  <g stroke="#555555" fill="none"><path d="M20 210 H620 M20 204 V216 M620 204 V216"/></g>
  <text x="320" y="230" text-anchor="middle" fill="#334155">колонки: 110 | остаток | 140 | 120 | 120, всего 960</text>
  <text x="320" y="252" text-anchor="middle" fill="#334155">шапка 44, строки 48, суммы по правому краю</text>
  <text x="320" y="274" text-anchor="middle" fill="#334155">на 375 таблица не уже 640 и прокручивается внутри контейнера</text>
</svg>
