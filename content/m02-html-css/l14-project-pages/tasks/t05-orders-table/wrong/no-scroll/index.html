<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы — панель менеджера Домотеки</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1 class="page__title">Заказы</h1>
    <div class="orders-scroll" data-scroll role="region" aria-label="Список заказов" tabindex="0">
      <table class="orders" data-table>
        <caption class="visually-hidden">Заказы за последние три дня</caption>
        <thead>
          <tr class="orders__row orders__row--head" data-head>
            <th scope="col" class="orders__cell orders__cell--number" data-col="number">№ заказа</th>
            <th scope="col" class="orders__cell orders__cell--customer" data-col="customer">Клиент</th>
            <th scope="col" class="orders__cell orders__cell--status" data-col="status">Статус</th>
            <th scope="col" class="orders__cell orders__cell--total" data-col="total">Сумма</th>
            <th scope="col" class="orders__cell orders__cell--date" data-col="date">Дата</th>
          </tr>
        </thead>
        <tbody>
          <tr class="orders__row" data-row>
            <th scope="row" class="orders__cell orders__cell--number" data-col="number">ДМ-1042</th>
            <td class="orders__cell orders__cell--customer" data-col="customer">Ирина Соколова</td>
            <td class="orders__cell orders__cell--status" data-col="status"><span class="status status--paid">Оплачен</span></td>
            <td class="orders__cell orders__cell--total" data-col="total">12 480 ₽</td>
            <td class="orders__cell orders__cell--date" data-col="date">11.10.2026</td>
          </tr>
          <tr class="orders__row" data-row>
            <th scope="row" class="orders__cell orders__cell--number" data-col="number">ДМ-1043</th>
            <td class="orders__cell orders__cell--customer" data-col="customer">Павел Громов</td>
            <td class="orders__cell orders__cell--status" data-col="status"><span class="status status--shipping">В доставке</span></td>
            <td class="orders__cell orders__cell--total" data-col="total">5 290 ₽</td>
            <td class="orders__cell orders__cell--date" data-col="date">11.10.2026</td>
          </tr>
          <tr class="orders__row" data-row>
            <th scope="row" class="orders__cell orders__cell--number" data-col="number">ДМ-1044</th>
            <td class="orders__cell orders__cell--customer" data-col="customer">Ольга Ким</td>
            <td class="orders__cell orders__cell--status" data-col="status"><span class="status status--waiting">Ждёт оплаты</span></td>
            <td class="orders__cell orders__cell--total" data-col="total">2 190 ₽</td>
            <td class="orders__cell orders__cell--date" data-col="date">10.10.2026</td>
          </tr>
          <tr class="orders__row" data-row>
            <th scope="row" class="orders__cell orders__cell--number" data-col="number">ДМ-1045</th>
            <td class="orders__cell orders__cell--customer" data-col="customer">Сергей Лебедев</td>
            <td class="orders__cell orders__cell--status" data-col="status"><span class="status status--cancelled">Отменён</span></td>
            <td class="orders__cell orders__cell--total" data-col="total">7 990 ₽</td>
            <td class="orders__cell orders__cell--date" data-col="date">09.10.2026</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
