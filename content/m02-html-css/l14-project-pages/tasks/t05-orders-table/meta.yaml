order: 5
title: "Таблица заказов: из div в настоящую table"
type: refactor
role: main
difficulty: 3
minutes: 35
language: html
tags: [проект P2, таблица, рефакторинг, scope, доступность, прокрутка]
hints:
  - "Направление: сначала замените структуру: table, caption, thead, tbody, tr, th, td. Классы оставьте. Потом посмотрите на ширины колонок: у таблицы они считаются иначе, чем у сетки."
  - "Шаг: table-layout: fixed и ширины в первой строке (th) задают колонки, как grid-template-columns. border-collapse: collapse убирает зазоры между ячейками. min-width: 640px оставляет таблице ширину при прокрутке."
  - "Почти решение: ширины колонок: number 110px, status 140px, total 120px, date 120px, customer остаток. Высоту строки задайте у ячеек (height: 48px). Контейнеру добавьте role=«region», aria-label и tabindex=«0»."
wrong:
  - name: aria-divs
    kind: common-mistake
    explanation: "К div добавлены role=«table», «row», «cell». Скринридер теперь читает таблицу, но первое правило ARIA нарушено: настоящий table делает то же самое без единого атрибута и надёжнее. Проверка требует нативные элементы."
  - name: no-headers
    kind: partial
    explanation: "Структура table есть, но заголовки колонок и номер заказа сделаны ячейками td. Выглядит так же, а скринридер не знает, какой заголовок относится к ячейке, и не может озвучить «Сумма, 12 480 ₽»."
  - name: no-scroll
    kind: edge-case
    explanation: "Таблица width: 100 процентов без минимальной ширины: на 375 колонки сжимаются, и текст налезает друг на друга, а прокручивать нечего. Таблице нужна ширина, а контейнеру прокрутка."
