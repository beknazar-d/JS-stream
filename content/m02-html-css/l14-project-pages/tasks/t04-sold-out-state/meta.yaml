order: 4
title: "Новое требование: состояние «нет в наличии»"
type: implement
role: main
difficulty: 3
minutes: 35
language: html
tags: [проект P2, модификатор, БЭМ, изменение требований, регрессия]
hints:
  - "Направление: не меняйте старые правила. Всё новое должно включаться только классом product--sold-out. Тогда карточка без него останется прежней по построению."
  - "Шаг: селектор вида .product--sold-out .product__badge (вес 0-2-0) перебьёт базовое display: none (0-1-0). Для кнопки и старой цены поставьте display: none под модификатором. Ссылка: flex, чтобы текст встал по центру."
  - "Почти решение: image: filter: grayscale(1); opacity: 0.6. Ссылка: width: 100%, в @media (min-width: 600px) width: 200px. Бейдж: #fde8e8 фон, #9b1c1c текст (около 7 к 1)."
wrong:
  - name: partial-state
    kind: partial
    explanation: "Бейдж и ссылка работают, кнопка скрыта, но картинка осталась яркой, а цена прежнего цвета. Состояние выглядит наполовину сделанным: по картинке не видно, что товара нет."
  - name: edits-base
    kind: common-mistake
    explanation: "Новые стили записаны в базовые правила, а не под модификатор. Теперь у каждой карточки скрыта кнопка «В корзину» и обесцвечена картинка. Регрессию поймали проверки состояния без модификатора."
  - name: pale-badge
    kind: edge-case
    explanation: "Состояние полностью реализовано, но бейдж светло-красный на розовом: контраст около 2 к 1. Цвета выбраны «по смыслу», а не проверены по формуле, и текст плохо читается."
