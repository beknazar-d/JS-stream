order: 1
title: "Карточка товара: разметка и десктопная вёрстка"
type: layout
role: warmup
difficulty: 2
minutes: 30
language: html
tags: [проект P2, вёрстка, Grid, семантика, макет, dl]
hints:
  - "Направление: сначала разметка, потом стили. Замените div на main, article, h1, button и dl, добавьте alt. Затем соберите две колонки: .product как сетка с колонками «480px и остаток»."
  - "Шаг: колонки .product: grid-template-columns: 480px 1fr, gap 32px, align-items: start, width 960px, margin: 32px auto. Миниатюры: отдельная сетка из трёх колонок по 96px с зазором 12px."
  - "Почти решение: заголовку margin: 0 0 8px, чтобы верх совпал с картинкой. Характеристики: dl с display: grid и grid-template-columns: 160px 1fr, у dd margin: 0."
wrong:
  - name: semantic-only
    kind: partial
    explanation: "Разметка исправлена, но стили не написаны: страница остаётся одной колонкой. Проект состоит из двух половин: структуры и вида, и принимается только целиком."
  - name: equal-columns
    kind: common-mistake
    explanation: "Колонки заданы как 1fr 1fr, а картинка тянется на всю колонку: галерея получилась шириной 464 вместо 480. По макету левая колонка фиксирована, правая забирает остаток."
  - name: low-contrast
    kind: edge-case
    explanation: "Раскладка точна, но цвета выбраны светлыми: белый текст на кнопке #5b8bd9 (около 3,5 к 1), серые подписи около 2 к 1. Контраст для обычного текста должен быть не меньше 4,5 к 1."
