<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="15" fill="currentColor">
  <title id="t">Как подпись связывается с полем</title>
  <desc id="d">Слева подпись label с атрибутом for равным email, справа поле input с id равным email. Одинаковые значения связаны стрелкой, клик по подписи переносит фокус в поле.</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="20" y="30" width="270" height="90" rx="10"/>
    <rect x="350" y="30" width="270" height="90" rx="10"/>
    <path d="M290 75 H350"/>
    <path d="M342 69 L350 75 L342 81"/>
    <rect x="20" y="170" width="600" height="100" rx="10" stroke-dasharray="6 4" opacity="0.8"/>
  </g>

  <g>
    <text x="40" y="62" font-family="ui-monospace, monospace" font-size="14">label for="email"</text>
    <text x="40" y="90" font-size="14" opacity="0.85">Ваш email</text>
    <text x="370" y="62" font-family="ui-monospace, monospace" font-size="14">input id="email"</text>
    <text x="370" y="90" font-size="14" opacity="0.85">type="email" name="email"</text>
    <text x="320" y="64" text-anchor="middle" font-size="12" opacity="0.8">совпадают</text>

    <text x="40" y="202" font-weight="700">Что даёт связь</text>
    <text x="40" y="226" font-size="14">Клик по подписи ставит курсор в поле.</text>
    <text x="40" y="248" font-size="14">Скринридер читает: «Ваш email, поле ввода».</text>
  </g>
</svg>
