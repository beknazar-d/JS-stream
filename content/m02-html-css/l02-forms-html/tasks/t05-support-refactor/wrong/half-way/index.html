<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Поддержка — Домотека</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Написать в поддержку</h1>
    <form class="support" action="/support" method="post">
      <div><label for="name">Ваше имя</label> <input id="name" type="text" name="name" placeholder="Анна"></div>
      <div><label for="email">Email</label> <input id="email" type="email" name="email" placeholder="anna@example.ru" required></div>
      <div><label for="order">Номер заказа</label> <input id="order" type="text" name="order" placeholder="DT-10542"></div>
      <div>
        Тема обращения:<br>
        <input type="radio" name="topic" value="delivery"> Доставка
        <input type="radio" name="topic" value="return"> Возврат
        <input type="radio" name="topic" value="other"> Другое
      </div>
      <div><label for="message">Сообщение</label> <textarea id="message" name="message" required></textarea></div>
      <div><input type="checkbox" name="agree"> Согласен на обработку данных</div>
      <button type="submit" class="send">Отправить</button>
    </form>
  </body>
</html>
