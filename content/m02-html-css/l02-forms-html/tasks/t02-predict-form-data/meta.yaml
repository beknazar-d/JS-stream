order: 2
title: "Что уйдёт на сервер из формы"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [форма, name, disabled, строки, преобразование типов]
show: [tests/snippet.js]
hints:
  - "Направление: сначала решите, какие поля функция пропускает (читайте условие с continue), и только потом смотрите на значения."
  - "Шаг: значения полей формы всегда строки, поэтому плюс склеивает. Number() превращает строку в число. Оператор in проверяет, есть ли ключ в объекте."
  - "Почти решение: в данные попадут email, qty и comment. Пятая строка зависит от того, что поле promo выключено."
wrong:
  - name: only-three
    kind: partial
    explanation: "Заполнены только три первые строки. Предсказать нужно каждый вызов console.log."
  - name: qty-is-number
    kind: common-mistake
    explanation: "Во второй строке ответ 4: решение сложило числа. Но значение поля qty — строка «3», и плюс склеивает её с единицей в «31»."
  - name: disabled-sent
    kind: edge-case
    explanation: "В ответе поле promo попало в данные. Но оно выключено (disabled), и браузер такие поля не отправляет. Это же правило объясняет «пропавший» промокод."
