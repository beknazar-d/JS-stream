<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Перезвоните мне — Домотека</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <form class="callback" action="/callback" method="post">
      <h2>Перезвоните мне</h2>
      <input aria-label="Имя" id="name" name="name" type="text" placeholder="Анна" autocomplete="name">
      <input aria-label="Телефон" id="phone" name="phone" type="tel" placeholder="+7 900 123-45-67" autocomplete="tel">
      <input aria-label="Email" id="email" name="email" type="email" placeholder="anna@example.ru" autocomplete="email">
      <input aria-label="Количество" id="qty" name="qty" type="number" min="1" value="1">
      <button type="submit">Перезвоните мне</button>
    </form>
  </body>
</html>
