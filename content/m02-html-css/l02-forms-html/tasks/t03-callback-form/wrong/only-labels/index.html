<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Перезвоните мне — Домотека</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <form class="callback" action="/callback" method="post">
      <h2>Перезвоните мне</h2>
      <label for="name">Имя</label>
      <input id="name" name="name" type="text" placeholder="Анна" autocomplete="name">
      <label for="phone">Телефон</label>
      <input id="phone" name="phone" type="text" placeholder="+7 900 123-45-67" autocomplete="tel">
      <label for="email">Email</label>
      <input id="email" name="email" type="text" placeholder="anna@example.ru" autocomplete="email">
      <label for="qty">Количество</label>
      <input id="qty" name="qty" type="text">
      <button>Перезвоните мне</button>
    </form>
  </body>
</html>
