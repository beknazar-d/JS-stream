  <title id="t">Макет: страница товара</title>
  <desc id="d">Колонка шириной 960 пикселей из двух колонок в пропорции 1,2 к 1 с промежутком 24 пикселя. Слева фото, оно занимает три ряда. Справа сверху вниз заголовок, цена и кнопка. Ниже описание на всю ширину. Ещё ниже слева характеристики, справа отзывы.</desc>
