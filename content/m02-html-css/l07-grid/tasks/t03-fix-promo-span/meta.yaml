order: 3
title: "Баннер не доходит до края сетки"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: html
tags: [grid-column, span, линии сетки]
hints:
  - "Направление: посчитайте колонки и линии сетки. В сетке из четырёх колонок линий пять: от 1 до 5."
  - "Шаг: в записи через косую черту числа — номера линий. Нужно дойти до последней линии. Для этого есть число со знаком минус."
  - "Почти решение: .promo { grid-column: 1 / -1; }"
wrong:
  - name: only-end
    kind: common-mistake
    explanation: "grid-column-end: -1 без начала. Начало остаётся автоматическим, и баннер занимает одну клетку, которая заканчивается у последней линии, то есть только четвёртую колонку. Нужны обе границы: 1 / -1."
  - name: hard-coded-end
    kind: edge-case
    explanation: "grid-column: 1 / 5 заканчивается на пятой линии и работает, пока колонок четыре. Если колонок станет три, баннер создаст лишнюю неявную колонку. Число -1 надёжнее: оно всегда указывает на последнюю линию."
  - name: width-percent
    kind: partial
    explanation: "width: 100% растягивает баннер лишь внутри его собственной клетки. Он остаётся в первых трёх колонках, а карточка встаёт справа от него."
