order: 2
title: "Размеры колонок сетки"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [fr, repeat, auto-fill, gap, span]
show: [tests/snippet.js]
hints:
  - "Направление: из ширины контейнера вычтите промежутки и фиксированные колонки. Остаток делится по долям fr."
  - "Шаг: число колонок auto-fill — целая часть от (контейнер + gap) / (минимум + gap). Ширина — контейнер минус промежутки, делённая на число колонок. Элемент на две колонки занимает две ширины и один промежуток между ними."
  - "Почти решение: 300, 300, 300; 200, 350, 350; 200, 400. Дальше «4 колонки по 235px» и «1 колонка по 400px». Элемент на две колонки: 490."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Заполнены только три строки из шести. Нужно предсказать каждый вызов console.log, включая auto-fill и span."
  - name: gap-forgotten
    kind: common-mistake
    explanation: "В первой строке ответ 320, 320, 320: так вышло бы без промежутков. Но от 960px сначала вычитаются два промежутка по 30px, остаётся 900px, и каждая колонка получает 300px."
  - name: span-without-gap
    kind: edge-case
    explanation: "В последней строке ответ 470: удвоена ширина колонки, а промежуток между двумя занятыми колонками забыт. Элемент растягивается и через промежуток: 2 × 235 + 20 = 490."
