<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Страница панели из пяти областей</title>
  <desc id="d">Сетка из трёх колонок и трёх рядов. Шапка header занимает три колонки сверху. В среднем ряду nav слева шириной 200 пикселей, main по центру на долю fr и aside справа шириной 240 пикселей. Подвал footer занимает три колонки снизу.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="30" y="30" width="580" height="50" rx="4"/>
    <rect x="30" y="92" width="130" height="150" rx="4"/>
    <rect x="172" y="92" width="270" height="150" rx="4"/>
    <rect x="454" y="92" width="156" height="150" rx="4"/>
    <rect x="30" y="254" width="580" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="320" y="60">header (все три колонки)</text>
    <text x="95" y="172">nav</text>
    <text x="307" y="172">main</text>
    <text x="532" y="172">aside</text>
    <text x="320" y="281">footer (все три колонки)</text>
  </g>
  <g text-anchor="middle" font-size="12" opacity="0.8">
    <text x="95" y="20">200px</text><text x="307" y="20">1fr</text><text x="532" y="20">240px</text>
  </g>
</svg>
