<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
  <title id="t">Переменные CSS передаются вниз по дереву</title>
  <desc id="d">Дерево элементов. Вверху html с переменной color-brand зелёного цвета. Под ним секция promo, где color-brand переопределена в красный, и в ней кнопка, которая получает красный. Рядом подвал footer без своих переменных, он получает зелёный от html. Стрелки идут только сверху вниз.</desc>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="200" y="20" width="240" height="56" rx="8"/>
    <rect x="30" y="140" width="250" height="56" rx="8"/>
    <rect x="380" y="140" width="230" height="56" rx="8" stroke-dasharray="6 4"/>
    <rect x="60" y="250" width="190" height="44" rx="8"/>
    <path d="M300 76 V108 H155 V140"/>
    <path d="M340 76 V108 H495 V140"/>
    <path d="M155 196 V250"/>
    <path d="M149 242 L155 250 L161 242"/>
    <path d="M149 132 L155 140 L161 132"/>
    <path d="M489 132 L495 140 L501 132"/>
  </g>
  <g>
    <text x="320" y="44" text-anchor="middle" font-weight="700">html (:root)</text>
    <text x="320" y="64" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace">--color-brand: green</text>
    <text x="155" y="164" text-anchor="middle" font-weight="700">section.promo</text>
    <text x="155" y="184" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace">--color-brand: crimson</text>
    <text x="495" y="164" text-anchor="middle" font-weight="700">footer</text>
    <text x="495" y="184" text-anchor="middle" font-size="13">своих переменных нет → green</text>
    <text x="155" y="270" text-anchor="middle" font-weight="700">button</text>
    <text x="155" y="287" text-anchor="middle" font-size="13">берёт ближайшее → crimson</text>
    <text x="495" y="260" text-anchor="middle" font-size="13">Соседи друг друга не видят:</text>
    <text x="495" y="278" text-anchor="middle" font-size="13">переменная идёт только вниз.</text>
  </g>
</svg>
