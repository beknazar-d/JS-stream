order: 2
title: "Какое значение переменной увидит элемент"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [custom properties, наследование, var, запасное значение]
show: [tests/snippet.js]
hints:
  - "Направление: для каждой строки пройдите по цепочке вверх от указанного элемента. Берётся первое найденное значение."
  - "Шаг: переменная из соседнего элемента (sidebar) в цепочке card не встречается. Запасное значение используется только когда переменной нет нигде в цепочке."
  - "Почти решение: darkgreen, 16px, 8px, navy, invalid, none, 16px."
wrong:
  - name: sibling-leaks
    kind: edge-case
    explanation: "Ответ red в пятой строке означает, что переменная соседнего блока sidebar попала к card. Переменные идут только вниз по дереву: потомок видит значения предков, сосед — нет."
  - name: fallback-wins
    kind: common-mistake
    explanation: "В последней строке ответ 4px. Но --gap объявлена у page, поэтому запасное значение не нужно: оно срабатывает, только если переменной нигде нет."
  - name: half-answer
    kind: partial
    explanation: "Заполнены четыре строки из семи. Предсказать нужно все семь вызовов console.log, в том числе случаи с соседним блоком и запасным значением."
