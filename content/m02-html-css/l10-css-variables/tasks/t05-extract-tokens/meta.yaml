order: 5
title: "Рефакторинг: цвета и отступы в токены"
type: refactor
role: main
difficulty: 3
minutes: 18
language: html
tags: [дизайн-токены, custom properties, рефакторинг, :root]
hints:
  - "Направление: выпишите каждое повторяющееся значение и дайте ему имя по смыслу (бренд, текст, поверхность), а не по цвету."
  - "Шаг: объявите переменные в :root и замените значения на var(). Белый встречается в двух ролях: фон поверхности и текст на брендовом фоне. Это разные токены."
  - "Почти решение: .site-header { background: var(--color-brand); color: var(--color-on-brand); padding: var(--space-md); }, .button { padding: 8px var(--space-md); }"
wrong:
  - name: header-literal
    kind: partial
    explanation: "Шапка осталась с #0b6e4f. Страница выглядит как прежде, но при смене --color-brand кнопка перекрасится, а шапка нет. Цвет в одном месте рано или поздно разойдётся."
  - name: tokens-on-body
    kind: edge-case
    explanation: "Переменные объявлены на body, а не в :root. На странице всё работает, но значение, заданное на html (например, переключателем темы), не действует: ближайшее объявление на body побеждает. Токены объявляют на самом верхнем элементе."
  - name: name-typo
    kind: common-mistake
    explanation: "В var() написано --colour-border вместо --color-border. Такой переменной нет, и рамка карточки пропадает: цвет рамки становится цветом текста. Консоль ничего не покажет, поэтому после рефакторинга нужно сверять вид страницы."
