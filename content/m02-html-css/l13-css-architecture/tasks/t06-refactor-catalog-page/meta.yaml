order: 6
title: "Рефакторинг стилей страницы каталога"
type: refactor
role: real
difficulty: 4
minutes: 60
language: html
tags: [БЭМ, "@layer", рефакторинг, утилиты, адаптив, переменные CSS]
hints:
  - "Направление: не переписывайте всё сразу. Пройдите блоками: сначала слои и утилиты, затем шапка, потом карточка, потом подвал. После каждого блока запускайте проверки внешнего вида: они должны оставаться зелёными."
  - "Шаг: адаптив (@media) кладите внутрь того же слоя, что и обычные правила блока. Селекторы в @media такие же плоские, как и вне его. Вариант «скидка» выражайте переменными --product-card-accent и --product-card-title."
  - "Почти решение: @layer reset, base, components, utilities; затем четыре блока @layer. В components живут все блоки вместе с их @media. В utilities три правила: .u-mt-24, .u-mt-32 и .u-hidden. В HTML у абзаца class=«catalog__note u-mt-24», у подвала class=«site-footer u-mt-32»."
wrong:
  - name: no-layers
    kind: partial
    explanation: "Классы по БЭМ, стили плоские, слоёв нет, а утилиты держатся на !important. Вид совпадает, но проблема приоритета не решена: следующая утилита снова потребует !important."
  - name: broke-mobile
    kind: edge-case
    explanation: "Переписали основной вид и забыли медиазапрос для узкого экрана. На 1024 всё в порядке, на 375 вместо одной колонки остаются две и шапка не сжимается. Рефакторинг нужно проверять на всех ширинах."
  - name: utility-in-components
    kind: common-mistake
    explanation: "Утилиты положены в слой components вместе с компонентами и даже перед ними. Внутри одного слоя снова работает специфичность и порядок, поэтому u-hidden не побеждает display: flex у карточки. Утилиты должны жить в последнем слое."
