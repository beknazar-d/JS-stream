order: 4
title: "Модификаторы кнопок не работают"
type: fix-bug
role: main
difficulty: 3
minutes: 20
language: html
tags: [специфичность, "!important", БЭМ, модификаторы, id-селекторы]
hints:
  - "Направление: сравните вес селектора #catalog .btn с весом .btn--accent. Пока у базового правила есть id, никакой класс его не перебьёт. Проблема в базовом правиле, а не в модификаторах."
  - "Шаг: замените #catalog .btn на .btn и уберите !important. Теперь у всех правил вес одного класса, и решает порядок: сначала базовый класс, потом модификаторы."
  - "Почти решение: порядок в файле: .btn, затем .btn--accent, .btn--ghost, .btn--small, и только после него .btn--wide, потому что у wide должна быть последняя возможность изменить отступы."
wrong:
  - name: important-everywhere
    kind: common-mistake
    explanation: "Кнопки выглядят верно, но каждый модификатор получил !important, а id остался. Это временная победа: следующий модификатор потребует ещё большего веса, и стили превратятся в гонку «кто громче»."
  - name: accent-only
    kind: partial
    explanation: "Выправлена только «Купить сейчас»: селектор #catalog .btn--accent повысил вес. Остальные модификаторы по-прежнему проигрывают: «В избранное» всё ещё серая. Лечить нужно причину, а не каждый симптом."
  - name: wrong-order
    kind: edge-case
    explanation: "Id и !important убраны, но .btn--wide объявлен раньше .btn--small. Веса равны, и побеждает более поздний: маленькая кнопка снова получила узкие отступы. При равных весах порядок в файле решает всё."
