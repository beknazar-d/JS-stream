order: 2
title: "Чей селектор победит"
type: predict
role: warmup
difficulty: 3
minutes: 10
language: js
tags: [специфичность, каскад, селекторы, id]
show: [tests/snippet.js]
hints:
  - "Направление: сначала посчитайте вес каждого селектора из первых трёх вызовов: id, затем классы (псевдокласс :hover считается классом), затем теги."
  - "Шаг: в winner сравнивают тройки слева направо и сразу останавливаются на первом отличии. Для четвёртого вызова решает первое число, для пятого весь вес равен и побеждает второй селектор."
  - "Почти решение: 0-1-0, 1-3-0, 0-0-3, затем #catalog .btn, затем .btn.btn--ghost. Последний вызов: у a.link вес 0-1-1, у .link:hover вес 0-2-0."
wrong:
  - name: only-first
    kind: partial
    explanation: "Верны только первые три строки с весами. Остальные три вызова тоже печатают результат, и пропустить их нельзя."
  - name: counts-tags-first
    kind: common-mistake
    explanation: "В четвёртой строке победителем назван селектор с большим числом классов. Но один id весит больше любого количества классов: сравнение начинается с первого числа тройки."
  - name: last-always-wins
    kind: edge-case
    explanation: "В последней строке победителем назван более поздний селектор по правилу «последний выигрывает». Порядок решает только при равных весах, а у .link:hover вес 0-2-0 больше, чем у a.link, 0-1-1."
