order: 1
title: "Порядок слоёв @layer"
type: recall
role: warmup
difficulty: 2
minutes: 12
language: html
tags: [каскад, "@layer", специфичность, "!important"]
hints:
  - "Направление: слой, объявленный позже, побеждает слой, объявленный раньше. Подумайте, в каком порядке должны идти сброс, компоненты и утилиты, чтобы каждый следующий мог переопределить предыдущий."
  - "Шаг: первой строкой файла напишите объявление порядка слоёв через запятую, затем оберните каждую группу правил в блок с именем слоя."
  - "Почти решение: @layer reset, components, utilities; затем @layer reset { button { ... } } @layer components { ... } @layer utilities { ... }."
wrong:
  - name: reset-last
    kind: edge-case
    explanation: "Слои объявлены, но сброс стоит последним. Утилиты по-прежнему побеждают, а вот сброс теперь перебивает компоненты: у кнопки пропали отступы. Порядок слоёв определяет приоритет, и ошибка в нём ломает совсем другое место."
  - name: important
    kind: common-mistake
    explanation: "Скрытие починено словом !important у утилиты, слои не использованы. Работает, пока не появится вторая утилита, которой тоже понадобится !important. Слои решают ту же задачу без перебора весов."
  - name: single-layer
    kind: partial
    explanation: "Всё положено в один слой app. Внутри слоя правила снова сравниваются по специфичности, поэтому компонент побеждает утилиту. Слоёв должно быть несколько, и утилиты должны лежать в последнем."
