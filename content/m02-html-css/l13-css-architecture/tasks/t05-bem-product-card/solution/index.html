<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Домотека — чайники</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="catalog">
    <h1 class="catalog__title">Чайники</h1>
    <div class="catalog__list">
      <div class="product-card" data-card>
        <div class="product-card__image" data-image></div>
        <div class="product-card__title" data-title>Чайник Домотека ЧЭ-17</div>
        <div class="product-card__price" data-price>3 490 ₽</div>
        <a class="product-card__button" href="/p/che-17" data-button>В корзину</a>
      </div>
      <div class="product-card product-card--sale" data-card>
        <div class="product-card__image" data-image></div>
        <div class="product-card__title" data-title>Чайник Домотека ЧС-30</div>
        <div class="product-card__price product-card__price--old" data-old-price>6 290 ₽</div>
        <div class="product-card__price" data-price>5 290 ₽</div>
        <a class="product-card__button" href="/p/chs-30" data-button>В корзину</a>
      </div>
      <div class="product-card" data-card>
        <div class="product-card__image" data-image></div>
        <div class="product-card__title" data-title>Чайник Домотека ЧК-12</div>
        <div class="product-card__price" data-price>2 190 ₽</div>
        <a class="product-card__button" href="/p/chk-12" data-button>В корзину</a>
      </div>
    </div>
  </div>
</body>
</html>
