order: 5
title: "Карточка товара по БЭМ"
type: refactor
role: main
difficulty: 3
minutes: 30
language: html
tags: [БЭМ, рефакторинг, специфичность, переменные CSS, модификаторы]
hints:
  - "Направление: сначала выпишите, какие части есть у карточки (картинка, название, цена, кнопка) и какие варианты (скидка, старая цена). Части станут элементами, варианты модификаторами."
  - "Шаг: перенесите классы в разметку, затем перепишите каждое правило в один класс. Для вариантов «скидка» используйте переменные CSS: блок получает значения по умолчанию, модификатор их переопределяет, элементы читают через var()."
  - "Почти решение: .product-card задаёт --product-card-accent: #0b3d91; .product-card--sale меняет её на #c2410c и ставит border-color; .product-card__button использует background: var(--product-card-accent); .product-card__title использует color: var(--product-card-title)."
wrong:
  - name: ids-left
    kind: partial
    explanation: "Классы в разметке переименованы, а в стилях остался идентификатор #catalog и !important у кнопки. Вид сохранён, но главная цель рефакторинга, плоские предсказуемые селекторы, не достигнута."
  - name: broke-look
    kind: common-mistake
    explanation: "При переписывании потеряли правило для кнопки в карточке со скидкой: она стала синей вместо оранжевой. Именно поэтому до рефакторинга нужны проверки внешнего вида: они ловят потерянные правила."
  - name: no-base-class
    kind: edge-case
    explanation: "Карточке со скидкой оставили только класс product-card--sale. В БЭМ модификатор дополняет блок, а не заменяет: без product-card пропали ширина, отступы и рамка."
