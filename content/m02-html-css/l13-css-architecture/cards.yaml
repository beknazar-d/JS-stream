- id: bem-meaning
  front: "Что означает БЭМ и как выглядит полное имя?"
  back: "Блок, элемент, модификатор: блок__элемент--модификатор. Например product-card__price--old."
- id: bem-element
  front: "Как записывается элемент блока product-card с именем title?"
  back: "product-card__title (два подчёркивания). Элемент не бывает вложен в элемент: не product-card__title__icon."
  answer: product-card__title
- id: bem-modifier
  front: "Как записывается модификатор sale блока product-card и как его вставить в разметку?"
  back: 'product-card--sale (два дефиса). В разметке рядом с блоком: class="product-card product-card--sale".'
  answer: product-card--sale
- id: bem-flat
  front: "Из чего состоит селектор в БЭМ?"
  back: "Из одного класса: .product-card__title. Без тегов, без id и без цепочек, поэтому у всех правил вес 0-1-0."
- id: id-selector
  front: "Почему id-селектор мешает в стилях?"
  back: "Один id весит больше любого числа классов (1-0-0 против 0-9-0). Перебить его можно только другим id или !important."
- id: important-problem
  front: "Почему !important опасен?"
  back: "Он побеждает любую специфичность, и перебить его можно только другим !important. Стили превращаются в гонку «кто громче»."
- id: layer-declare
  front: "Как одной строкой задать порядок слоёв сброс, компоненты, утилиты?"
  back: "@layer reset, components, utilities; — слой справа сильнее слоя слева."
  answer: "@layer reset, components, utilities;"
- id: layer-win
  front: "Что решает, какое правило победит, если они лежат в разных слоях?"
  back: "Порядок слоёв, а не специфичность. Специфичность и порядок в файле сравнивают только внутри одного слоя."
- id: layer-unlayered
  front: "Какое правило сильнее: вне слоя или внутри слоя?"
  back: "Вне слоя (unlayered) побеждает любой слой. Поэтому в проекте со слоями в слои кладут всё, включая @media."
- id: refactor-rule
  front: "Какой главный признак правильного рефакторинга стилей?"
  back: "Внешний вид не изменился: проверки вида (размеры, цвета, раскладка) проходили до правок и проходят после."
