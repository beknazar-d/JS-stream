order: 3
title: "Баг: красная кнопка не красная"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: html
tags: [специфичность, каскад, порядок правил, "!important"]
hints:
  - "Направление: запишите вес трёх правил, которые касаются кнопки со скидкой: .btn-sale, .btn и .product .btn. Какое из них сильнее?"
  - "Шаг: .btn-sale весит [0,1,0], а .product .btn весит [0,2,0]. Чтобы красный победил в обоих местах, вес правила для скидки должен быть не меньше, чем у самого сильного соперника, и оно должно стоять ниже."
  - "Почти решение: правило .btn.btn-sale (два класса на одном элементе) весит [0,2,0], как .product .btn. Поставьте его в конец файла: при равном весе побеждает позднее."
wrong:
  - name: important
    kind: common-mistake
    explanation: "Красный цвет «пробит» через !important. Кнопки стали красными, но теперь это правило невозможно переопределить без нового !important, и стилям придёт конец. Задание требует решения без него."
  - name: order-only
    kind: partial
    explanation: "Правило для скидки перенесено ниже .btn. В панели кнопка стала красной, а в карточке товара нет: .product .btn весит [0,2,0] и сильнее одного класса .btn-sale, порядок тут не помогает."
  - name: product-only
    kind: edge-case
    explanation: "Добавлено правило «.product .btn-sale», которое чинит карточку товара. Кнопка «Акция» в панели над каталогом осталась серой: она не лежит внутри .product."
