order: 5
title: "Рефакторинг: убрать !important и id"
type: refactor
role: main
difficulty: 3
minutes: 15
language: html
tags: [рефакторинг, "!important", специфичность, классы]
hints:
  - "Направление: выпишите для каждого элемента итоговые значения из текущих стилей. Потом решите, какие простые классовые селекторы дадут то же самое."
  - "Шаг: идентификаторы в CSS можно заменить классами меню и контента, например .menu a. Для варианта (active, warning, danger) нужно, чтобы его правило весило не меньше базового и стояло ниже."
  - "Почти решение: .menu a { color: #333333 } и .menu a.active { color: #dd0000; font-weight: 700 }. Для заметок .note и .note.warning, для кнопок .btn и .btn.danger."
wrong:
  - name: ids-left
    kind: partial
    explanation: "!important убран, но селекторы по идентификаторам остались. Страница выглядит так же, но правила по-прежнему привязаны к id, и новый компонент без такого id их не получит."
  - name: order-bug
    kind: common-mistake
    explanation: "Класс .danger описан выше .btn с таким же весом. Без !important побеждает нижнее правило, и опасная кнопка стала синей."
  - name: lost-bold
    kind: edge-case
    explanation: "Активная ссылка стала красной, но потеряла жирное начертание: у неё осталось только свойство color. В старом CSS жирность задавалась тем же правилом."
