<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Заказы — панель менеджера Домотеки</title>
    <style id="vendor">
      /* Библиотека таблиц. Не редактировать. */
      table.grid { border-collapse: collapse; width: 100%; }
      table.grid td, table.grid th { padding: 4px 8px; text-align: left; }
      table.grid td { color: #333333; }
      table.grid tbody tr:nth-child(even) td { background: #f5f5f5; }
    </style>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <table class="grid orders">
      <thead>
        <tr>
          <th>Номер</th>
          <th>Клиент</th>
          <th>Статус</th>
          <th class="num">Сумма</th>
        </tr>
      </thead>
      <tbody>
        <tr data-status="new">
          <td>DT-10501</td><td>Анна С.</td><td>Новый</td><td class="num">32 900 ₽</td>
        </tr>
        <tr data-status="new">
          <td>DT-10502</td><td>Игорь К.</td><td>Новый</td><td class="num">18 400 ₽</td>
        </tr>
        <tr data-status="paid">
          <td>DT-10503</td><td>Марина Л.</td><td>Оплачен</td><td class="num">41 990 ₽</td>
        </tr>
        <tr data-status="cancelled">
          <td>DT-10504</td><td>Олег Н.</td><td>Отменён</td><td class="num">7 300 ₽</td>
        </tr>
        <tr data-status="shipped" class="urgent">
          <td>DT-10505</td><td>Ирина В.</td><td>Отправлен</td><td class="num">25 000 ₽</td>
        </tr>
        <tr data-status="cancelled">
          <td>DT-10506</td><td>Павел Д.</td><td>Отменён</td><td class="num">9 100 ₽</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
