order: 6
title: "Таблица заказов поверх чужих стилей"
type: implement
role: real
difficulty: 4
minutes: 25
language: html
tags: [специфичность, каскад, комбинаторы, атрибуты, nth-child, "!important"]
hints:
  - "Направление: выпишите вес правил библиотеки: table.grid td, table.grid tbody tr:nth-child(even) td. Ваши правила должны весить больше там, где вы хотите победить."
  - "Шаг: сначала сравнивается число классов (вместе с атрибутами и псевдоклассами), потом число тегов. У зебры 2 класса и 4 тега: [0,2,4]. Чтобы её перебить, нужен хотя бы один лишний класс."
  - "Почти решение: добавьте оба класса таблицы и атрибут: .grid.orders tr[data-status=«new»] td имеет вес [0,3,2] и побеждает зебру. Для td.num достаточно .orders td.num с весом [0,2,1]."
wrong:
  - name: important
    kind: common-mistake
    explanation: "Каждое свойство снабжено !important. Таблица выглядит верно, но задание запрещает !important: такие правила нельзя будет переопределить при следующей доработке."
  - name: weak-new
    kind: edge-case
    explanation: "Подсветка новых заказов написана как «.orders tr[data-status=«new»] td», вес [0,2,2]. В нечётных строках она работает, а в чётных зебра [0,2,4] сильнее, и фон остаётся серым."
  - name: partial
    kind: partial
    explanation: "Сделаны выравнивание сумм и отменённые заказы. Подсветка новых и красная полоса срочных заказов отсутствуют."
