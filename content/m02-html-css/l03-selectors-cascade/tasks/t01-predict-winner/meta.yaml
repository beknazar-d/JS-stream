order: 1
title: "Какое правило победит"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [специфичность, каскад, вес селектора]
show: [tests/snippet.js]
hints:
  - "Направление: сравнивайте тройки слева направо. Сначала идентификаторы, потом классы, потом теги. Следующая позиция смотрится, только если предыдущие равны."
  - "Шаг: при полном равенстве побеждает более позднее правило, то есть то, что в списке ниже. Победитель каждого шага участвует в следующем сравнении."
  - "Почти решение: после шага с «.product .btn» победитель сменился на него, потому что веса равны. Последний победитель сохраняется до конца, а его вес печатается в последней строке."
wrong:
  - name: only-first
    kind: partial
    explanation: "Заполнены только первые две строки. Предсказать нужно каждый вызов console.log."
  - name: last-wins
    kind: common-mistake
    explanation: "В ответе победителем каждый раз становится последнее правило. Но порядок решает только при равном весе. «#cart .btn» с идентификатором не уступает ни одному из следующих."
  - name: tie-first
    kind: edge-case
    explanation: "На шаге с «.product .btn» вес такой же, как у «.card .btn». В CSS при равенстве побеждает позднее правило, а в ответе остался более раннее."
