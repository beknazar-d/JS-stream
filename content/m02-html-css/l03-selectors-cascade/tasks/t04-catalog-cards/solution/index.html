<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Каталог — Домотека</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <ul class="catalog">
      <li class="card">
        <span class="badge">Хит</span>
        <h2 class="card-title">Bosch WAN 2426</h2>
        <p class="old-price">36 000 ₽</p>
        <p class="price">32 900 ₽</p>
        <button class="buy" type="button">В корзину</button>
      </li>
      <li class="card" data-stock="0">
        <h2 class="card-title">LG F2V3 GS</h2>
        <p class="price">38 500 ₽</p>
        <button class="buy" type="button" disabled>Нет в наличии</button>
      </li>
      <li class="card">
        <h2 class="card-title">Indesit BWSA 61051</h2>
        <span class="badge">Новинка</span>
        <p class="price">21 700 ₽</p>
        <button class="buy" type="button">В корзину</button>
      </li>
    </ul>
  </body>
</html>
