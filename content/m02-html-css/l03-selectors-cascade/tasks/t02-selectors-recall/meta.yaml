order: 2
title: "Шесть селекторов по памяти"
type: recall
role: warmup
difficulty: 2
minutes: 8
language: html
tags: [селекторы, класс, атрибут, nth-child, комбинатор]
hints:
  - "Направление: подберите для каждой строки таблицы вид селектора: класс, потомок, чётные дети, атрибут, соседний элемент."
  - "Шаг: чётные карточки — :nth-child(even), внешние ссылки — a[href^=«https»], ссылка сразу после цены — .price + a."
  - "Почти решение: .card-sale .price весит больше, чем .price, поэтому красная цена скидки побеждает независимо от порядка правил в файле. Внешние ссылки выбирает a[href^=«https»], ссылку после цены — .price + a."
wrong:
  - name: odd-rows
    kind: common-mistake
    explanation: "Вместо чётных карточек подсвечены нечётные: :nth-child(odd) или 2n+1. Первая и третья карточки получили фон, а вторая и четвёртая нет."
  - name: all-links
    kind: edge-case
    explanation: "Цвет #0066cc задан всем ссылкам через селектор a. Внутренняя ссылка «Подробнее» тоже стала синей, а нужно было выбрать только адреса, начинающиеся с https."
  - name: only-two
    kind: partial
    explanation: "Написаны правила для заголовка и цены, остальные четыре пропущены."
