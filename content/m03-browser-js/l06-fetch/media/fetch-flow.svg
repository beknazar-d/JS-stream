<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Путь запроса через fetch</title>
  <desc id="d">Страница вызывает await fetch и получает ответ Response. Если сеть недоступна, fetch выбрасывает ошибку, её ловит catch. Если ответ пришёл, проверяется response.ok. Для неуспешного статуса показывается сообщение. Для успешного вызывается await response.json, и данные выводятся на страницу.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor"/></marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="20" width="170" height="54" rx="6"/>
    <rect x="235" y="20" width="170" height="54" rx="6"/>
    <rect x="460" y="20" width="170" height="54" rx="6"/>
    <rect x="235" y="130" width="170" height="54" rx="6"/>
    <rect x="460" y="130" width="170" height="54" rx="6"/>
    <rect x="10" y="130" width="170" height="54" rx="6" stroke-dasharray="5 4"/>
    <rect x="235" y="240" width="170" height="54" rx="6" stroke-dasharray="5 4"/>
    <rect x="460" y="240" width="170" height="54" rx="6"/>
    <path d="M180 47 H233" marker-end="url(#arr)"/>
    <path d="M405 47 H458" marker-end="url(#arr)"/>
    <path d="M545 74 V128" marker-end="url(#arr)"/>
    <path d="M460 157 H407" marker-end="url(#arr)"/>
    <path d="M320 74 V128" marker-end="url(#arr)" stroke-dasharray="5 4"/>
    <path d="M235 157 H182" marker-end="url(#arr)" stroke-dasharray="5 4"/>
    <path d="M320 184 V238" marker-end="url(#arr)"/>
    <path d="M545 184 V238" marker-end="url(#arr)"/>
  </g>
  <g text-anchor="middle">
    <text x="95" y="44">Страница</text><text x="95" y="62" opacity="0.8">await fetch(адрес)</text>
    <text x="320" y="44">Сервер</text><text x="320" y="62" opacity="0.8">считает и отвечает</text>
    <text x="545" y="44">Response</text><text x="545" y="62" opacity="0.8">status, ok, тело</text>
    <text x="320" y="154">Проверка</text><text x="320" y="172" opacity="0.8">response.ok ?</text>
    <text x="545" y="154">await response.json()</text><text x="545" y="172" opacity="0.8">текст в данные</text>
    <text x="95" y="154">catch</text><text x="95" y="172" opacity="0.8">нет сети: TypeError</text>
    <text x="320" y="264">Сообщение об ошибке</text><text x="320" y="282" opacity="0.8">404, 500, 503</text>
    <text x="545" y="264">Показать данные</text><text x="545" y="282" opacity="0.8">через textContent</text>
  </g>
  <text x="326" y="106" opacity="0.8">сети нет</text>
  <text x="326" y="214" opacity="0.8">нет</text>
  <text x="551" y="214" opacity="0.8">да</text>
</svg>
