order: 3
title: "Каталог не показывает товары"
type: fix-bug
role: warmup
difficulty: 3
minutes: 15
language: html
tags: [fetch, await, response.ok, status, обновление списка]
hints:
  - "Направление: ошибок три. Первая в первой строке функции: fetch возвращает обещание, а не ответ. Вторая в том, что код не смотрит на статус ответа. Третья в том, как список заполняется при повторном вызове."
  - "Шаг: перед fetch нужен await. После него проверьте response.ok и при false выведите сообщение со статусом, а дальше не идите (return). Перед выводом очистите список. При успехе очистите и #status."
  - "Почти решение: const response = await fetch('/api/products'); if (!response.ok) { status.textContent = 'Не удалось загрузить товары (' + response.status + ')'; return; } status.textContent = ''; ... list.textContent = '' перед циклом."
wrong:
  - name: no-ok-check
    kind: common-mistake
    explanation: "Добавлен await, но статус ответа не проверяется. При ответе 500 код пытается пройти по телу ошибки как по списку: объект не итерируется, функция падает, а на странице нет ни сообщения, ни товаров."
  - name: duplicates
    kind: edge-case
    explanation: "Загрузка и проверка статуса исправлены, но список не очищается. По кнопке «Обновить» к трём товарам добавляются ещё три."
  - name: status-stays
    kind: partial
    explanation: "Сообщение об ошибке выводится, но не убирается после успешной загрузки. Покупатель нажимает «Обновить», товары появились, а сверху по-прежнему написано «Не удалось загрузить товары»."
