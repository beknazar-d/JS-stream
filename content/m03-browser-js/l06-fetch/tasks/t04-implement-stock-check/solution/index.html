<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Каталог</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Каталог</h1>
    <ul id="products">
      <li class="card" data-sku="K-200">
        <h3>Чайник K-200</h3>
        <button class="check" type="button">Проверить наличие</button>
        <p class="stock" role="status"></p>
      </li>
      <li class="card" data-sku="B-50">
        <h3>Блендер B-50</h3>
        <button class="check" type="button">Проверить наличие</button>
        <p class="stock" role="status"></p>
      </li>
      <li class="card" data-sku="T-2">
        <h3>Тостер T-2</h3>
        <button class="check" type="button">Проверить наличие</button>
        <p class="stock" role="status"></p>
      </li>
    </ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
