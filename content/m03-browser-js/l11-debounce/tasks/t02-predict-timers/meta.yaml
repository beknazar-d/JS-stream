order: 2
title: "Что выведет отложенный поиск"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [setTimeout, clearTimeout, порядок выполнения]
show: [tests/snippet.js]
hints:
  - "Направление: сначала выполняется весь обычный код сверху вниз, и только потом срабатывают таймеры, по порядку их времени."
  - "Шаг: onInput('чай') отменяет таймер от onInput('ч'). Значит, из двух первых вызовов поиск сработает только для «чай». Таймер с задержкой 0 срабатывает раньше таймера с задержкой 10."
  - "Почти решение: сначала две строки «ввод» и «конец скрипта», потом «нулевая задержка», «поиск: чай», затем «ввод: чайник» и «поиск: чайник»."
wrong:
  - name: only-sync
    kind: partial
    explanation: "Записаны только строки обычного кода. Таймеры тоже что-то выводят, просто позже: их строки тоже нужны в ответе."
  - name: no-cancel
    kind: common-mistake
    explanation: "В ответе есть «поиск: ч». Но clearTimeout отменил таймер ещё до того, как он сработал, поэтому для «ч» поиска не будет."
  - name: zero-last
    kind: edge-case
    explanation: "Строка «нулевая задержка» поставлена после «поиск: чай». Таймер с задержкой 0 всё равно ждёт окончания основного кода, но срабатывает раньше таймера на 10 мс."
