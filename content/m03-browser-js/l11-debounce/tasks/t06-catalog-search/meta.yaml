order: 6
title: "Поиск по каталогу: дебаунс, отмена и состояния"
type: implement
role: real
difficulty: 4
minutes: 40
language: html
tags: [debounce, AbortController, fetch, состояния, неясности]
hints:
  - "Направление: разделите работу на три слоя. Первый: обработчик input, который вызывает дебаунснутый loadResults. Второй: внутри loadResults отмена прошлого запроса и свежий AbortController. Третий: состояния загрузки, пустого результата и ошибки в #status."
  - "Шаг: перед запросом controller.abort() для прошлого и controller = new AbortController(); передайте signal в fetch. В catch сначала проверьте error.name === 'AbortError' и выйдите. Остальные ошибки показывают статус и кнопку #retry. response.ok = false тоже считается ошибкой."
  - "Почти решение: debounce(loadResults, 300) подписан на input; loadResults запоминает lastText для #retry, ставит статус «Загрузка…», после ответа выводит список и ставит статус «Ничего не найдено» только для пустого массива; кнопка #retry вызывает loadResults(lastText)."
wrong:
  - name: no-abort
    kind: race
    explanation: "Дебаунс, состояния и повтор есть, но прошлый запрос не отменяется и ответы не сравниваются. Медленный ответ на «чай» приходит после ответа на «чайник» и подменяет список."
  - name: abort-as-error
    kind: common-mistake
    explanation: "Запрос отменяется, но AbortError попадает в общую ветку ошибок. После каждого нового запроса пользователь видит «Не удалось загрузить результаты» и кнопку повтора, хотя всё в порядке."
  - name: no-states
    kind: partial
    explanation: "Дебаунс и отмена сделаны, а состояний нет: ни «Загрузка», ни «Ничего не найдено», ни ошибки с повтором. Пользователь не понимает, идёт ли поиск и сломался ли он."
