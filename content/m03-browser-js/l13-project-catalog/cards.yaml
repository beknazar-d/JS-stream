- id: state-single-source
  front: Как организовать состояние каталога (поиск, фильтры, страница)?
  back: "Одним объектом state. Любое действие меняет state, а запрос, поля и адрес выводятся из него."
- id: states-four
  front: Какие четыре состояния нужны списку, который грузится по сети?
  back: "Загрузка, успех с данными, успех без данных (пусто), ошибка с кнопкой «Повторить»."
- id: response-ok
  front: Почему после fetch нужна проверка response.ok?
  back: "fetch отклоняет промис только при падении сети. Ответ 404 или 503 приходит как успех, поэтому код проверяют вручную."
  answer: response.ok
- id: reset-page
  front: Что делать с номером страницы при смене поиска или фильтра?
  back: "Сбрасывать на 1. Иначе можно оказаться на странице, которой в новой выдаче нет."
- id: pushstate
  front: Чем pushState отличается от replaceState?
  back: "pushState добавляет запись в историю (работает «Назад»), replaceState заменяет текущую запись."
  answer: pushState
- id: popstate-no-push
  front: Можно ли в обработчике popstate вызывать pushState?
  back: "Нет. «Назад» уже поменял запись. Применяйте состояние из event.state и грузите данные, иначе пропадёт «Вперёд»."
- id: parse-boundary
  front: Почему значения из адреса нужно проверять?
  back: "Адрес может написать кто угодно. Неизвестные sort, category и странные page заменяйте значениями по умолчанию."
- id: change-request
  front: Как встречать изменение требований посередине проекта?
  back: "Найти все места, зависящие от изменённого (формат ответа, цена), поправить их, прогнать старые проверки. Хорошая структура делает изменение дешёвым."
- id: questions-first
  front: Что делать с неясным местом в ТЗ?
  back: "Записать вопрос заказчику и временное допущение до кода. Допущение должно легко меняться."
