<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Домотека — каталог</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Каталог «Домотеки»</h1>
  </header>
  <main class="layout">
    <div class="filters">
      <button id="reload" type="button">Обновить</button>
    </div>
    <p id="total"></p>
    <p id="status" role="status"></p>
    <button id="retry" type="button" hidden>Повторить</button>
    <ul id="grid" class="grid" aria-busy="false"></ul>
    <nav class="pager" aria-label="Страницы">
      <button id="prev" type="button">Назад</button>
      <span id="page-info"></span>
      <button id="next" type="button">Вперёд</button>
    </nav>
  </main>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
