order: 3
title: "Этап 3. Исправить пагинацию"
type: fix-bug
role: warmup
difficulty: 3
minutes: 20
language: html
tags: [проект, пагинация, отладка, границы]
hints:
  - "Направление: симптомов несколько, а причин меньше. Посмотрите, откуда берётся число страниц, и как проверяются границы в обработчиках и в showPager."
  - "Шаг: lastPages должен браться из data.pages, а не из data.total. Границы проверяйте и при отключении кнопок, и в самих обработчиках: кнопка ещё не успела отключиться, а второй клик уже случился. Кнопка «Обновить» не должна менять state.page."
  - "Почти решение: lastPages = data.pages; prevButton.disabled = state.page <= 1; nextButton.disabled = state.page >= lastPages; в обработчиках первой строкой if (state.page <= 1) return; и if (state.page >= lastPages) return; reloadButton вызывает loadProducts напрямую."
wrong:
  - name: label-only
    kind: partial
    explanation: "Исправлено число страниц, из-за которого подпись и кнопка «Вперёд» вели себя странно. Но «Назад» по-прежнему уходит на страницу 0, а «Обновить» сбрасывает номер страницы."
  - name: disabled-only
    kind: race
    explanation: "Кнопки отключаются правильно, но только после ответа сервера. Если нажать «Вперёд» много раз подряд, пока запрос идёт, обработчики не проверяют границу и уходят за последнюю страницу."
  - name: wrap-around
    kind: common-mistake
    explanation: "На последней странице «Вперёд» не отключается, а прыгает на первую страницу. Это не то, что просили: по ТЗ на последней странице кнопка отключена."
