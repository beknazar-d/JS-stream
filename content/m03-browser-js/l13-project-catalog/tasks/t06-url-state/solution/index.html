<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Домотека — каталог</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Каталог «Домотеки»</h1>
  </header>
  <main class="layout">
    <div class="filters">
      <div class="field">
        <label for="search">Поиск</label>
        <input id="search" type="search" autocomplete="off">
      </div>
      <div class="field">
        <label for="category">Категория</label>
        <select id="category">
          <option value="">Все категории</option>
          <option value="kitchen">Кухня</option>
          <option value="cleaning">Уборка</option>
          <option value="climate">Климат</option>
          <option value="laundry">Стирка</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">Сортировка</label>
        <select id="sort">
          <option value="popular">По популярности</option>
          <option value="price-asc">Сначала дешёвые</option>
          <option value="price-desc">Сначала дорогие</option>
        </select>
      </div>
      <button id="reload" type="button">Обновить</button>
    </div>
    <p id="total"></p>
    <p id="status" role="status"></p>
    <button id="retry" type="button" hidden>Повторить</button>
    <ul id="grid" class="grid" aria-busy="false"></ul>
    <nav class="pager" aria-label="Страницы">
      <button id="prev" type="button">Назад</button>
      <span id="page-info"></span>
      <button id="next" type="button">Вперёд</button>
    </nav>
  </main>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="url.js"></script>
  <script src="script.js"></script>
</body>
</html>
