order: 2
title: "Имена в dataset и строка «0»"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [dataset, строки, приведение типов]
show: [tests/snippet.js]
hints:
  - "Направление: сначала пройдите две функции на примерах. Одна превращает каждый дефис с последующей буквой в заглавную букву, другая делает обратное."
  - "Шаг: строка '0' непустая, а непустая строка при приведении к логическому значению истинна. Число получается только после Number. Плюс со строкой склеивает."
  - "Почти решение: productId, oldPriceRub, data-stock-left, data-id. Потом string, true, false, а последняя строка получается склейкой строки и числа: 01."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Записаны только четыре строки из восьми: первые вызовы с именами. Нужно предсказать все вызовы console.log, включая проверки значения '0'."
  - name: zero-is-false
    kind: common-mistake
    explanation: "В шестой строке ответ false: так было бы с числом 0. Но значение из dataset — строка '0', а непустая строка в логическом контексте истинна. Поэтому условие if (card.dataset.stock) для нуля срабатывает."
  - name: one-hyphen
    kind: edge-case
    explanation: "Во второй строке ответ oldPrice-rub: заменён только один дефис. Регулярное выражение со флагом g обрабатывает каждый дефис, поэтому получается oldPriceRub."
