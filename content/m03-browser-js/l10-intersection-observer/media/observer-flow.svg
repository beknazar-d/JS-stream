<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Область слежения и rootMargin</title>
  <desc id="d">Слева окно браузера с областью слежения, расширенной сверху и снизу на rootMargin. Три блока: один внутри окна, один в расширенной зоне под окном, один дальше. Справа порядок событий: observe, первое уведомление с isIntersecting false, блок входит в зону, колбэк с isIntersecting true, unobserve.</desc>
  <g font-weight="700"><text x="20" y="22">Окно и область слежения</text><text x="380" y="22">Порядок событий</text></g>
  <rect x="20" y="44" width="320" height="156" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="30" y="62" font-weight="700">окно браузера</text>
  <rect x="20" y="200" width="320" height="56" fill="currentColor" opacity="0.12"/>
  <path d="M20 256 H340" stroke="currentColor" stroke-dasharray="6 4"/>
  <text x="30" y="248" opacity="0.8">запас rootMargin</text>
  <rect x="50" y="90" width="120" height="34" rx="4" fill="currentColor" opacity="0.35"/>
  <text x="180" y="112">блок 1: на экране</text>
  <rect x="50" y="210" width="120" height="28" rx="4" fill="currentColor" opacity="0.35"/>
  <text x="180" y="229">блок 2: в запасе, грузится</text>
  <rect x="50" y="274" width="120" height="28" rx="4" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="180" y="293">блок 3: далеко, ждёт</text>
  <g>
    <rect x="380" y="40" width="240" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <text x="392" y="60">1. observer.observe(block)</text>
    <rect x="380" y="90" width="240" height="44" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <text x="392" y="108">2. первое уведомление:</text>
    <text x="392" y="126">isIntersecting: false</text>
    <rect x="380" y="154" width="240" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <text x="392" y="174">3. блок вошёл в область</text>
    <rect x="380" y="204" width="240" height="44" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <text x="392" y="222">4. колбэк: isIntersecting: true,</text>
    <text x="392" y="240">загружаем картинку</text>
    <rect x="380" y="268" width="240" height="30" rx="4" fill="none" stroke="currentColor" opacity="0.7"/>
    <text x="392" y="288">5. observer.unobserve(block)</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="currentColor">
    <path d="M500 72 V88"/><path d="M500 88 l-5 -8 h10 z"/>
    <path d="M500 136 V152"/><path d="M500 152 l-5 -8 h10 z"/>
    <path d="M500 186 V202"/><path d="M500 202 l-5 -8 h10 z"/>
    <path d="M500 250 V266"/><path d="M500 266 l-5 -8 h10 z"/>
  </g>
</svg>
