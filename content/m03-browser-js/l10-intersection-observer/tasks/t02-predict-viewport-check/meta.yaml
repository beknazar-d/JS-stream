order: 2
title: "Попадёт ли блок в область слежения"
type: predict
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [IntersectionObserver, rootMargin, threshold]
show: [tests/snippet.js]
hints:
  - "Направление: для каждого вызова найдите область слежения (окно плюс rootMargin с обеих сторон), потом посчитайте, сколько элемента в неё попало."
  - "Шаг: область слежения без отступа — от 0 до 800, с отступом 200 — от -200 до 1000. Доля видимой части — видимая высота, делённая на высоту элемента. Число выводится как есть: 0.5, а не 50%."
  - "Почти решение: false 0, true 1, true 0.5, false 0.5, false 0, true 0.5. В четвёртой строке доля 0.5 меньше порога 0.75, поэтому false. В последней доля ровно 0.5, порог 0.5 выполнен."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Верны первые три строки, остальные не заполнены. Предсказать нужно каждый вызов console.log."
  - name: margin-ignored
    kind: common-mistake
    explanation: "Во второй строке ответ false 0. Но rootMargin 200 расширяет область слежения до 1000, и блок 900–1000 целиком в неё попадает: true 1. Поэтому изображения и начинают грузиться заранее."
  - name: threshold-ignored
    kind: edge-case
    explanation: "В четвёртой строке ответ true 0.5. Но порог 0.75 требует, чтобы была видна как минимум три четверти блока, а видна половина. Результат false."
