<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Путь отправки формы</title>
  <desc id="d">Нажатие кнопки или Enter запускает проверку правил браузера. Если поле неверно, браузер показывает подсказку и событие submit не наступает. Если всё верно, наступает submit, обработчик вызывает preventDefault, читает FormData, проверяет данные своим кодом и показывает ошибки или результат.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="currentColor"/></marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="10" y="20" width="130" height="50" rx="6"/>
    <rect x="190" y="20" width="170" height="50" rx="6"/>
    <rect x="410" y="20" width="220" height="50" rx="6"/>
    <rect x="190" y="130" width="170" height="50" rx="6" stroke-dasharray="5 4"/>
    <rect x="410" y="110" width="220" height="90" rx="6"/>
    <rect x="410" y="230" width="220" height="50" rx="6"/>
    <path d="M140 45 H188" marker-end="url(#arr)"/>
    <path d="M360 45 H408" marker-end="url(#arr)"/>
    <path d="M275 70 V128" marker-end="url(#arr)"/>
    <path d="M520 70 V108" marker-end="url(#arr)"/>
    <path d="M520 200 V228" marker-end="url(#arr)"/>
  </g>
  <g text-anchor="middle">
    <text x="75" y="42">Кнопка</text><text x="75" y="60" opacity="0.8">или Enter</text>
    <text x="275" y="42">Проверка правил</text><text x="275" y="60" opacity="0.8">required, type, pattern</text>
    <text x="520" y="42">Событие submit</text><text x="520" y="60" opacity="0.8">только если всё верно</text>
    <text x="275" y="152">Подсказка браузера</text><text x="275" y="170" opacity="0.8">submit не наступает</text>
    <text x="520" y="132">Ваш обработчик</text>
    <text x="520" y="152" opacity="0.8">1. event.preventDefault()</text>
    <text x="520" y="170" opacity="0.8">2. new FormData(form)</text>
    <text x="520" y="188" opacity="0.8">3. своя проверка</text>
    <text x="520" y="252">Ошибки под полями или результат</text>
  </g>
  <text x="283" y="102" opacity="0.8">есть неверное поле</text>
  <text x="528" y="92" opacity="0.8">всё верно</text>
</svg>
