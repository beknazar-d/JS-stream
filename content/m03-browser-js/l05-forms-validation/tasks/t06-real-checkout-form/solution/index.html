<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Оформление заказа</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Оформление заказа</h1>
    <form id="checkout-form" novalidate>
      <div class="field">
        <label for="name">Имя</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <p class="field-error" id="name-error"></p>
      </div>
      <div class="field">
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
        <p class="field-error" id="phone-error"></p>
      </div>
      <fieldset class="field">
        <legend>Способ получения</legend>
        <label><input type="radio" name="method" value="delivery" checked> Доставка</label>
        <label><input type="radio" name="method" value="pickup"> Самовывоз</label>
      </fieldset>
      <div class="field">
        <label for="address">Адрес</label>
        <input id="address" name="address" type="text" autocomplete="street-address">
        <p class="field-error" id="address-error"></p>
      </div>
      <div class="field">
        <label for="promo">Промокод</label>
        <input id="promo" name="promo" type="text">
      </div>
      <button type="submit">Оформить заказ</button>
    </form>
    <p id="summary" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
