<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Оформление заказа</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Оформление заказа</h1>
    <form id="order-form">
      <div class="field">
        <label for="name">Имя и фамилия</label>
        <input id="name" name="name" type="text" required minlength="2">
      </div>
      <div class="field">
        <label for="phone">Телефон в формате +79001234567</label>
        <input id="phone" name="phone" type="tel" required pattern="\+7\d{10}" title="Плюс, семёрка и десять цифр без пробелов">
      </div>
      <div class="field">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="field">
        <label for="qty">Количество (от 1 до 10)</label>
        <input id="qty" name="qty" type="number" required min="1" max="10" step="1">
      </div>
      <div class="field">
        <label for="postcode">Почтовый индекс</label>
        <input id="postcode" name="postcode" type="text" required pattern="\d{6}" title="Шесть цифр">
      </div>
      <div class="field">
        <label for="comment">Комментарий курьеру</label>
        <textarea id="comment" name="comment" rows="3" maxlength="200"></textarea>
      </div>
      <button type="submit">Оформить заказ</button>
    </form>
  </main>
</body>
</html>
