<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Адрес доставки</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Адрес доставки</h1>
    <form id="delivery-form" novalidate>
      <div class="field">
        <label for="address">Адрес</label>
        <input id="address" name="address" type="text" required>
        <p class="field-error" id="address-error"></p>
      </div>
      <div class="field">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" required>
        <p class="field-error" id="email-error"></p>
      </div>
      <div class="field">
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" required pattern="\+7\d{10}">
        <p class="field-error" id="phone-error"></p>
      </div>
      <button type="submit">Сохранить адрес</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
