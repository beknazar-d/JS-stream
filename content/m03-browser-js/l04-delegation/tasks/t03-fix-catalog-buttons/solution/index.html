<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Каталог</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p id="cart-count">В корзине: 0</p>
  <ul id="catalog">
    <li class="card" data-id="k200">
      <span class="card__title">Чайник K-200</span>
      <button class="add" type="button"><span class="add__icon">+</span> В корзину</button>
    </li>
    <li class="card" data-id="b50">
      <span class="card__title">Блендер B-50</span>
      <button class="add" type="button"><span class="add__icon">+</span> В корзину</button>
    </li>
  </ul>
  <button id="more" type="button">Показать ещё</button>
  <script src="script.js"></script>
</body>
</html>
