- id: bubbling
  front: Что такое всплытие события?
  back: "Событие срабатывает на элементе, где случилось, затем поднимается к родителю, к его родителю и так до документа. На каждом уровне вызываются подключённые обработчики."
- id: target-vs-current
  front: Чем event.target отличается от event.currentTarget?
  back: "target — элемент, на котором событие случилось (самый глубокий). currentTarget — элемент, на котором висит работающий обработчик."
- id: closest
  front: Что делает element.closest('.selector')?
  back: "Поднимается от элемента к родителям и возвращает первого, кто подходит под селектор (включая сам элемент). Если такого нет, вернёт null."
  answer: closest
- id: delegation
  front: Что такое делегирование событий?
  back: "Один обработчик на общем родителе (списке) вместо обработчика на каждом потомке. Он ищет нужный элемент через event.target.closest(...)."
- id: delegation-profit
  front: Какие два плюса даёт делегирование?
  back: "Работает для элементов, добавленных позже, и не плодит сотни обработчиков."
- id: null-check
  front: Что обязательно проверить в делегированном обработчике после closest?
  back: "Что результат не null: клик мог прийти мимо кнопки. if (!button) return;"
- id: contains
  front: Зачем нужна проверка list.contains(button) после closest?
  back: "Если списки вложены, closest может найти кнопку за пределами вашего списка. contains гарантирует, что она внутри."
- id: stop-propagation
  front: Почему stopPropagation лучше не использовать?
  back: "Он скрывает событие от всех обработчиков выше: аналитики, закрытия меню по клику снаружи. Такие баги трудно найти. Лучше проверить условие в самом обработчике."
- id: no-bubble
  front: Какие события не всплывают?
  back: "focus и blur (для делегирования есть focusin и focusout), а также mouseenter и mouseleave."
