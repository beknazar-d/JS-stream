order: 2
title: "Что делает экранирование"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [innerHTML, XSS, экранирование, строки]
show: [tests/snippet.js]
hints:
  - "Направление: замены выполняются по порядку, слева направо по строке и сверху вниз по методам. Первой идёт замена амперсанда."
  - "Шаг: четвёртый вызов получает строку, которая уже содержит амперсанд. Он тоже заменяется. В reviewHtml экранируются только автор и текст, а теги li и b пишет сама функция. Счётчик считает открывающие теги."
  - "Почти решение: Хлеб &amp; соль, 5 &lt; 7, &lt;b&gt;Скидка&lt;/b&gt;, &amp;lt;. Дальше строка с li и b, где i заменён кодами, и два раза число 2."
wrong:
  - name: unfinished
    kind: partial
    explanation: "Заполнены только четыре строки из семи. Нужно предсказать все вызовы console.log, включая результат reviewHtml и счётчики тегов."
  - name: no-ampersand
    kind: edge-case
    explanation: "В четвёртой строке ответ &lt;: так было бы, если бы функция не трогала уже существующий амперсанд. Но replaceAll('&', '&amp;') срабатывает на любой амперсанд, и получается &amp;lt;. Экранированную строку повторно экранировать нельзя: она покажется как текст с кодом."
  - name: tags-stay
    kind: common-mistake
    explanation: "В последних строках теги i оставлены разметкой, и счётчик равен 3. Но escapeHtml заменяет скобки, поэтому внутри отзыва нет тегов: остаются только li и b, которые написала сама функция. Счётчик равен 2 в обоих случаях."
