<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Корзина</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cart-row" data-price="2990">
    <span class="cart-row__title">Чайник K-200</span>
    <button class="minus" type="button" aria-label="Уменьшить количество">-</button>
    <input class="qty" type="text" inputmode="numeric" value="1" aria-label="Количество">
    <button class="plus" type="button" aria-label="Увеличить количество">+</button>
    <span class="line-total">2 990 ₽</span>
  </div>
  <script src="script.js"></script>
</body>
</html>
