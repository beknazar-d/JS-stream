<!doctype html>
<html lang="ru">
<head>

  <title>Каталог</title>

</head>
<body>

  <p id="status" role="status">Найдено: 8</p>

  <ul id="results">
    <li>Чайник K-200</li>
    <li>Чайник стеклянный G-10</li>
    <li>Блендер B-50</li>
    <li>Тостер T-2</li>
    <li>Фен F-9</li>
    <li>Кофеварка C-300</li>
    <li>Миксер M-7 (мини)</li>
    <li>Весы кухонные V-1 [серые]</li>
  </ul>
  <script src="script.js"></script>
</body>
</html>
