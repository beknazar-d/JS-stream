<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Домотека — избранное</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Избранное</h1>
    <ul class="products">
      <li>
        <h2>Электрический чайник Domo K-17</h2>
        <button class="buy" type="button" data-id="k-17"><span class="icon">+</span> В корзину</button>
      </li>
      <li>
        <h2>Тостер Vento T-2</h2>
        <button class="buy" type="button" data-id="t-2"><span class="icon">+</span> В корзину</button>
      </li>
      <li>
        <h2>Утюг Domo S-5</h2>
        <button class="buy" type="button" data-id="s-5"><span class="icon">+</span> В корзину</button>
      </li>
    </ul>
    <section>
      <h2>Корзина: <output id="cart-count">0</output></h2>
      <p id="cart-list"></p>
      <button id="clear" type="button">Очистить корзину</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
