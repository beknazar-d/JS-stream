order: 4
title: "Исправить: обработчики копятся при перерисовке"
type: fix-bug
role: main
difficulty: 3
minutes: 20
language: html
tags: [addEventListener, перерисовка, делегирование, дубли обработчиков]
hints:
  - "Направление: посмотрите, где вызывается addEventListener. Если он внутри render, а render вызывается после каждого клика и по кнопке «Обновить», то обработчиков становится всё больше."
  - "Шаг: подписку нужно выполнить один раз, снаружи render. Список ul при перерисовке не заменяется (меняется только его содержимое), поэтому один обработчик на ul переживёт все перерисовки. Нужную кнопку находите через event.target.closest."
  - "Почти решение: уберите list.addEventListener из render и поставьте его после функции render один раз; внутри обработчика остаётся тот же код. Вызов render() в конце обработчика оставьте."
wrong:
  - name: once-true
    kind: common-mistake
    explanation: "Опция once: true снимает обработчик после срабатывания, а render добавляет новый. Пока кликают подряд, кажется, что всё работает. Но каждое нажатие «Обновить» добавляет ещё один обработчик, и следующий клик по «+» срабатывает несколько раз."
  - name: remove-new-function
    kind: partial
    explanation: "removeEventListener вызывается с функцией, которая создана заново на этой перерисовке, а не с той, что добавлена раньше. Это другая функция, и удалить она ничего не может: дубли остаются."
  - name: skip-render
    kind: edge-case
    explanation: "Дубли убраны тем, что render возвращается раньше, если список не пуст. Но тогда список вообще не обновляется: количество на экране не меняется после клика."
