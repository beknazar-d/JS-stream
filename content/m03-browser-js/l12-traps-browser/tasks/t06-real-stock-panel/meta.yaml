order: 6
title: "Панель остатков: несколько багов сразу"
type: fix-bug
role: real
difficulty: 4
minutes: 40
language: html
tags: [this, innerHTML, NaN, строки из формы, делегирование, неясности]
hints:
  - "Направление: у письма три симптома, значит, минимум три причины. Удаляется только последняя строка — смотрите, как добавляется строка. Красная ошибка в консоли — смотрите, чему равен this. Цепочка цифр и NaN — смотрите, что приходит из полей формы."
  - "Шаг: добавляйте строки через createElement и rows.append (или insertAdjacentHTML), а не через innerHTML +=. Для кнопок удаления используйте один обработчик на tbody с event.target.closest('.del'). Значения полей превращайте в числа через Number и проверяйте: пустая строка и NaN недопустимы."
  - "Почти решение: функция parseNumber(text): trim, пустая строка даёт null, Number, Number.isFinite, иначе null. В submit: если name пуст или qty или price равны null, сообщение в #form-error и return. Иначе addRow с числами, form.reset()."
wrong:
  - name: this-only
    kind: partial
    explanation: "Заменено только this на event.currentTarget, а innerHTML += остался. Каждое добавление пересоздаёт все строки, и кнопки «Удалить» остаются только у последней. Итоги по-прежнему склеивают строки."
  - name: no-validation
    kind: edge-case
    explanation: "Строки превращаются в числа через Number, но проверки нет. Пустое поле даёт 0 и добавляет строку с нулём, а текст «abc» даёт NaN в таблице и в итогах."
  - name: string-sum
    kind: common-mistake
    explanation: "Ввод проверяется, но в позицию записывается исходная строка. Количества складываются плюсом как строки: к 5 дописывается «4», и вместо 9 в итоге получается «54»."
