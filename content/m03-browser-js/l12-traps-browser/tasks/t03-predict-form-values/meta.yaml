order: 3
title: "Что выведет поле формы"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [NaN, преобразование типов, строки из формы, Number]
show: [tests/snippet.js]
hints:
  - "Направление: значение поля — всегда строка. Умножение превращает строки в числа, а плюс с строкой склеивает."
  - "Шаг: пустая строка при преобразовании в число даёт 0, а не NaN. NaN дают строки, в которых есть буквы, если брать их целиком через Number. parseInt, наоборот, читает число с начала строки и останавливается на первом лишнем символе."
  - "Почти решение: 0, 0, затем «31» (склейка), затем 7470, затем NaN (Number от «2 шт»), и последняя строка — результат проверки Number.isNaN(2): это false."
wrong:
  - name: plus-adds
    kind: common-mistake
    explanation: "В третьей строке ответ 4. Но field.value — строка '3', и плюс со строкой склеивает: получается '31'."
  - name: empty-is-nan
    kind: edge-case
    explanation: "В первой и второй строке ответ NaN. Пустая строка превращается в число 0, а не в NaN. Именно поэтому пустое поле молча даёт «0 ₽»."
  - name: parseint-nan
    kind: partial
    explanation: "В последней строке ответ true. Но parseInt('2 шт') читает число с начала строки и возвращает 2, это не NaN. Так parseInt прячет ошибку ввода, которую Number показал бы."
