order: 3
title: "Кнопка «Повторить» не работает"
type: fix-bug
role: warmup
difficulty: 3
minutes: 15
language: html
tags: [retry, состояния, addEventListener, loading]
hints:
  - "Направление: ошибок три, они в разных местах функции и в последних строках файла. Следите за тем, в каком состоянии остаются status и retry после каждой ветки."
  - "Шаг: посмотрите, что делает catch с кнопкой. Посмотрите, кто очищает «Загрузка…» при успехе. И сравните две последние строки файла: в одной обработчик передан, в другой вызван."
  - "Почти решение: в catch retry.hidden = false; при успехе status.textContent = ''; в addEventListener передайте loadOrders без скобок."
wrong:
  - name: status-stays
    kind: partial
    explanation: "Кнопка и обработчик исправлены, но надпись «Загрузка…» при успехе не убирается. Список заказов выведен, а сверху по-прежнему написано «Загрузка…»."
  - name: retry-hidden
    kind: common-mistake
    explanation: "В catch кнопка по-прежнему скрывается, а не показывается. Сообщение об ошибке есть, нажать «Повторить» нельзя."
  - name: double-request
    kind: edge-case
    explanation: "Обработчик передан как loadOrders(), то есть вызван сразу. Функция запускается при подключении обработчика и ещё раз в конце файла, поэтому при открытии уходит два запроса, а второй забирает успешный ответ."
