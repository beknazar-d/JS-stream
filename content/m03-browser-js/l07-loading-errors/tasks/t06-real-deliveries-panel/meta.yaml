order: 6
title: "Панель доставок: загрузка, ошибки, повтор"
type: api
role: real
difficulty: 5
minutes: 40
language: html
tags: [fetch, AbortController, состояния, retry, aria-live, неясности]
hints:
  - "Направление: сведите всё к одной функции loadDeliveries с флагом loading. В начале она выходит, если загрузка уже идёт; потом ставит состояние загрузки, создаёт контроллер и таймер; в try разбирает исходы; в finally сбрасывает таймер и флаг."
  - "Шаг: исходов пять: статус не ok, пустой массив, успех, AbortError (таймаут), любая другая ошибка (сеть). Для ошибок заведите функцию showError(text), которая пишет текст и показывает кнопку. Для остальных исходов кнопка скрыта."
  - "Почти решение: let loading = false; в начале if (loading) return; loading = true; в finally loading = false. Сигнал: fetch('/api/deliveries', { signal: controller.signal }); таймер setTimeout(() => controller.abort(), 800), его сбрасывает clearTimeout в finally."
wrong:
  - name: parallel-requests
    kind: race
    explanation: "Нет защиты от параллельных запросов. Пока первый запрос не закончился, нажатие «Обновить» запускает второй. Ответы приходят в любом порядке, и более старый ответ может затереть более свежий, а сервер получает лишнюю нагрузку."
  - name: no-timeout
    kind: partial
    explanation: "Состояния и «Повторить» работают, но таймаута нет. Если сервер молчит, страница бесконечно показывает загрузку: ни сообщения, ни кнопки."
  - name: no-empty-state
    kind: edge-case
    explanation: "Пустой массив не обрабатывается: статус очищается, а списка нет. Менеджер не может понять, сломалась страница или доставок сегодня нет."
