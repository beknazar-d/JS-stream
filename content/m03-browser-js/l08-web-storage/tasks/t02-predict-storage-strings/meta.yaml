    kind: common-mistake
    explanation: "Ответ 4 во второй строке означает, что qty считается числом. Но getItem вернул строку «3», и плюс склеил её с единицей: получилось «31»."
  - name: missing-undefined
    kind: edge-case
    explanation: "В пятой строке ответ undefined. Для отсутствующего ключа Storage.getItem возвращает null, и модель из задания повторяет это."
