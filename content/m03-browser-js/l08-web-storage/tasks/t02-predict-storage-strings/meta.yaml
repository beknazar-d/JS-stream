hints:
  - "Направление: посмотрите на setItem. Что он делает со значением перед тем, как положить его в Map?"
  - "Шаг: String(3) даёт строку «3», String([4, 7]) даёт «4,7», String({}) даёт «[object Object]». Для отсутствующего ключа getItem возвращает null, а не undefined."
  - "Почти решение: первые три строки — string, 31, 4,7. Четвёртая — «[object Object]». Пятая — null. Последняя — true: JSON возвращает настоящее булево значение."
wrong:
