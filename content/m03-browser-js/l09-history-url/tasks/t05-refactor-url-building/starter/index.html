<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Каталог «Домотеки»</title>
</head>
<body>
  <h1>Каталог</h1>
  <form id="filters">
    <label for="q">Поиск</label>
    <input id="q" type="search">
    <label for="category">Категория</label>
    <select id="category">
      <option value="all">Все товары</option>
      <option value="kettles">Чайники</option>
      <option value="blenders">Блендеры</option>
      <option value="coffee">Кофе и чай</option>
    </select>
    <button type="submit">Найти</button>
  </form>
  <ul id="results"></ul>
  <script src="script.js"></script>
</body>
</html>
