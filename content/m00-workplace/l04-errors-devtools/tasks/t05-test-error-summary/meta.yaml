order: 5
title: "Тесты для разбора строки ошибки"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, ошибки, граничные случаи, строки]
show: [subject/index.js]
hints:
  - "Направление: сначала обычные строки с типом ошибки. Потом подумайте, какой «грязный» ввод бывает в логах: пробелы, перевод строки, двоеточие в тексте, строка без типа."
  - "Шаг: проверьте строку с двумя двоеточиями в тексте, строку с пробелами и переводом строки по краям и строку вообще без «: »."
  - "Почти решение: errorSummary(\"Error: Failed: timeout\"), errorSummary(\"  TypeError: x is not a function\\n\") и errorSummary(\"connection lost\") с ожидаемыми объектами."
mutants:
  - name: split-colon
    description: "Строка режется split по каждому «: », и текст после второго двоеточия теряется."
  - name: no-trim
    description: "Убран вызов trim(). Пробелы и перевод строки по краям попадают в тип и текст."
  - name: no-fallback
    description: "Нет обработки строки без «: ». indexOf возвращает -1, и результат получается мусорным."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверены только две обычные строки с типом. Двоеточие в тексте, пробелы и строка без типа не проверены, поэтому все три ошибки остаются незамеченными."
  - name: no-fallback-case
    kind: edge-case
    explanation: "Тесты ловят двоеточие в тексте и пробелы, но не проверяют строку без типа. Ошибка в обработке такой строки остаётся незамеченной."
  - name: clean-lines-only
    kind: common-mistake
    explanation: "Все строки чистые, без пробелов по краям. Но в реальных логах строки приходят с отступами и переводом строки. Ошибка с пропавшим trim() проходит незамеченной."
