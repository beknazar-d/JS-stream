order: 2
title: "Что напечатают отладочные логи"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [console.log, отладка, NaN, undefined]
show: [tests/snippet.js]
hints:
  - "Направление: функция печатает значения по шагам, а потом возвращает результат. Внешний console.log печатает итог только после того, как функция вернула значение."
  - "Шаг: если второй аргумент не передан, параметр равен undefined. Умножение числа на undefined даёт NaN, а любая арифметика с NaN снова даёт NaN."
  - "Почти решение: первый вызов даёт четыре строки (три отладочные и итог 1700), второй — тоже четыре, но со словом undefined и значением NaN."
wrong:
  - name: first-half
    kind: partial
    explanation: "Описан только первый вызов. Но функция вызывается дважды, и каждый вызов печатает по четыре строки: всего восемь."
  - name: ignores-undefined
    kind: common-mistake
    explanation: "Во втором вызове ответ «Итого: 500» означает, что отсутствие скидки посчитано как ноль. Но параметр percent равен undefined, умножение даёт NaN, и итог тоже NaN. Ошибки при этом нет, и именно поэтому такие баги ищут по логам."
  - name: result-first
    kind: edge-case
    explanation: "Строка «Итого» поставлена перед отладочными. Но сначала вычисляется функция (и печатает свои логи), и только потом внешний console.log печатает результат."
