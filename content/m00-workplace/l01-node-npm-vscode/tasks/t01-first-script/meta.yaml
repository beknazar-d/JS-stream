order: 1
title: "Первый скрипт склада"
type: recall
role: warmup
difficulty: 1
minutes: 5
language: js
tags: [console.log, строки, первый скрипт]
hints:
  - "Направление: каждая строка вывода — отдельный вызов console.log. Текст в кавычках."
  - "Шаг: три строки вывода — три вызова. Двоеточие и пробел после него входят в текст, а число 12 можно написать вторым значением через запятую."
  - "Почти решение: console.log(\"Склад «Центральный»\"); console.log(\"Заказов в обработке:\", 12); и третья строка с текстом «Готов к отгрузке»."
wrong:
  - name: two-lines
    kind: partial
    explanation: "Напечатаны только две строки из трёх. Каждая строка вывода требует своего вызова console.log, третью строку забыли."
  - name: no-space
    kind: common-mistake
    explanation: "Текст «Заказов в обработке:» и число склеены без пробела: получилось «Заказов в обработке:12». Пробел после двоеточия нужно написать внутри кавычек или передать число вторым значением через запятую."
  - name: plain-quotes
    kind: edge-case
    explanation: "В названии склада вместо ёлочек стоят обычные кавычки. В задании строка записана с ёлочками «Центральный», вывод проверяется символ в символ."
