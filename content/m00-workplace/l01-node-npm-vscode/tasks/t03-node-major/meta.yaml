order: 3
title: "Мажорная версия из вывода node -v"
type: implement
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [строки, split, slice, Number, вывод терминала]
hints:
  - "Направление: вывод команды — обычная строка вроде «v22.22.0». Нужна первая часть до точки без буквы v, превращённая в число."
  - "Шаг: сначала trim(), потом slice(1) убирает букву v, потом split(\".\") режет на части. Первая часть — parts[0]. Строку из цифр превращает в число Number()."
  - "Почти решение: const parts = versionOutput.trim().slice(1).split(\".\"); return Number(parts[0]);"
wrong:
  - name: forgot-number
    kind: common-mistake
    explanation: "Функция вернула строку «22» вместо числа 22. Проверка toBe(22) строгая: строка и число — разные типы. Часть версии нужно превратить через Number()."
  - name: first-digit
    kind: partial
    explanation: "Берётся только одна цифра после «v». Для «v22.22.0» получится 2, а не 22. Версии с двумя цифрами в первой части — обычное дело, режьте по точке."
  - name: no-trim
    kind: edge-case
    explanation: "Работает только на чистой строке. Если вывод скопирован с пробелом в начале (например, из терминала с отступом), slice(1) отрезает пробел, а не букву v, и получается NaN. Перед разбором нужно вызвать trim()."
