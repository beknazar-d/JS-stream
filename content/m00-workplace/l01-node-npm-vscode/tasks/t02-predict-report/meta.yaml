order: 2
title: "Что выведет отчёт склада"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [console.log, арифметика, склейка строк]
show: [tests/snippet.js]
hints:
  - "Направление: разберите каждый console.log отдельно. Запятая между значениями печатает пробел. Плюс между числами складывает, а плюс рядом со строкой склеивает."
  - "Шаг: в третьей строке слева направо идёт: строка, плюс число 12, плюс число 5. Сначала получается строка «Всего: 12», потом к ней приклеивается 5."
  - "Почти решение: ответ начинается с «Заказов в обработке: 12» и «Всего: 17». Третья строка похожа на вторую, но в ней нет сложения. Последняя строка — результат деления без хвоста."
wrong:
  - name: first-half
    kind: partial
    explanation: "Верны только три первых элемента. Предсказать нужно каждый вызов console.log: их шесть."
  - name: plus-adds
    kind: common-mistake
    explanation: "В третьей строке ответ «Всего: 17» означает, что плюсы сложили числа. Но слева стоит строка, поэтому каждый плюс склеивает: «Всего: » + 12 даёт «Всего: 12», потом «Всего: 125»."
  - name: decimal
    kind: edge-case
    explanation: "Деление 12 на 4 в JavaScript даёт 3, а не 3.0. В JavaScript все числа одного типа, и целый результат печатается без дробной части."
