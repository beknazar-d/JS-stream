order: 4
title: "Баг: скрипт отчёта падает при запуске"
type: fix-bug
role: main
difficulty: 2
minutes: 12
language: js
tags: [ошибки, опечатки, console.log, ReferenceError, TypeError]
hints:
  - "Направление: читайте сообщение сверху вниз. Первая строка показывает файл и номер строки, последняя строка перед стеком — тип и текст ошибки. Исправьте первую ошибку и запустите снова: за ней может прятаться вторая."
  - "Шаг: в строке 7 имя переменной написано с опечаткой, сравните с тем, что объявлено выше. Во второй ошибке неверный регистр буквы в console. Когда скрипт заработает, внимательно сверьте вывод с ожидаемым: двоеточие и пробел."
  - "Почти решение: shiped заменить на shipped, console.Log на console.log, а в последней строке добавить пробел после двоеточия."
wrong:
  - name: only-first-typo
    kind: partial
    explanation: "Исправлена только первая ошибка (shiped). Скрипт доходит до строки с console.Log и падает с TypeError. Ошибки приходят по одной: после исправления нужно запустить скрипт снова."
  - name: missing-space
    kind: common-mistake
    explanation: "Скрипт больше не падает, но последняя строка печатается как «Всего движений:19»: после двоеточия нет пробела. Сообщения об ошибке тут нет, расхождение видно только при сверке вывода с ожидаемым."
  - name: forgot-returned
    kind: edge-case
    explanation: "Опечатки исправлены, но в итоговую сумму не попали возвраты: напечатано 17 вместо 19. В итоге учитываются все три величины: в обработке, отгружено и возвраты."
