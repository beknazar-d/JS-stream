order: 5
title: "Тесты для проверки версии Node.js"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, граничные случаи, вывод терминала, сравнение]
show: [subject/index.js]
hints:
  - "Направление: сначала обычные случаи (версия новее и старее минимума). Потом ищите, где ответ меняется с true на false и какой «мусор» может прийти из терминала."
  - "Шаг: проверьте версию ровно равную минимуму, однозначную мажорную версию (v8) против минимума 22, вывод с пробелами по краям и текст ошибки терминала вместо версии."
  - "Почти решение: нужны проверки isSupportedNode(\"v22.22.0\", 22) → true, isSupportedNode(\"v8.17.0\", 22) → false, isSupportedNode(\"  v22.22.0\\n\", 22) → true и isSupportedNode(\"bash: node: command not found\", 22) → false."
mutants:
  - name: strict-boundary
    description: "Знак «не меньше» заменён на «больше»: версия ровно равная минимуму считается неподдерживаемой."
  - name: text-compare
    description: "Мажорная версия сравнивается с минимумом как текст, без превращения в число. По алфавиту «8» больше «22», и очень старый Node.js считается подходящим."
  - name: no-trim
    description: "Убран вызов trim(). Вывод с пробелом в начале разбирается неверно, и подходящая версия отклоняется."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверены только явно новая и явно старая версии. Граница, однозначная версия и пробелы не проверены, поэтому все три ошибки остаются незамеченными."
  - name: no-boundary
    kind: edge-case
    explanation: "Тесты ловят пробелы и однозначную версию, но не проверяют версию ровно равную минимуму. Ошибка «больше» вместо «не меньше» остаётся незамеченной."
  - name: clean-input-only
    kind: common-mistake
    explanation: "Все входные строки чистые, как в учебнике. Но реальный вывод терминала бывает с пробелами и переводом строки. Ошибка с пропавшим trim() проходит незамеченной."
