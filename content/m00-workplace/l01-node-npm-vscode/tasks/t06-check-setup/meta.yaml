order: 6
title: "Проверка окружения нового разработчика"
type: implement
role: real
difficulty: 3
minutes: 25
language: js
tags: [вывод терминала, строки, Number, массивы, проверка окружения]
hints:
  - "Направление: в функции две независимые проверки, Node.js и npm. Собирайте найденные проблемы в массив и возвращайте его целиком. Пустой массив значит «всё в порядке»."
  - "Шаг: версия — это строка. Если после trim() она не начинается с «v» или первая часть после v не превращается в число (Number.isNaN), Node.js не найден. Иначе сравните число с minNodeMajor. Для npm достаточно проверить, что Number от первой части до точки — не NaN."
  - "Почти решение: const problems = []; затем if для Node.js с problems.push(...), потом if для npm с problems.push(...), в конце return problems. Не используйте return внутри проверок, иначе вторая проверка не выполнится."
wrong:
  - name: no-npm-check
    kind: partial
    explanation: "Проверяется только Node.js. Если Node.js стоит, а npm не найден (например, установка прервана), функция вернёт пустой список и скажет, что всё в порядке."
  - name: no-version-check
    kind: edge-case
    explanation: "Функция замечает отсутствие Node.js, но не сравнивает версию с минимумом. Разработчик с Node.js 18 получит «всё в порядке» и дальше столкнётся с непонятными ошибками."
  - name: stops-at-first
    kind: common-mistake
    explanation: "После первой найденной проблемы функция сразу возвращает результат. Если не найдено и Node.js, и npm, придёт одно сообщение вместо двух. Разработчик исправит одно и увидит второе только при следующем запуске."
