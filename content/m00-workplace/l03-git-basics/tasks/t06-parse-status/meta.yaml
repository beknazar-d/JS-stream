order: 6
title: "Разбор вывода git status: что войдёт в коммит"
type: implement
role: real
difficulty: 4
minutes: 30
language: js
tags: [git status, индекс, строки, массивы, объекты, split]
hints:
  - "Направление: пройдите по строкам вывода и для каждой определите три вещи: имя файла, состояние индекса (первый символ кода) и состояние рабочей папки (второй). Один файл может попасть сразу в два списка."
  - "Шаг: для «??» файл идёт только в untracked. Иначе: первый символ не пробел — в staged, второй не пробел — в unstaged (это две отдельные проверки, не if/else). Имя: slice(3); у переименования берите часть после «->»; кавычки уберите."
  - "Почти решение: let name = line.slice(3); const arrow = name.indexOf(\" -> \"); if (arrow !== -1) { name = name.slice(arrow + 4); } затем уберите кавычки, если они есть по краям. Дальше if (code === \"??\") ... else { if (code[0] !== \" \") staged.push(name); if (code[1] !== \" \") unstaged.push(name); }"
wrong:
  - name: either-or
    kind: partial
    explanation: "Файл попадает либо в staged, либо в unstaged (else if). Но у файла с кодом MM есть изменения и в индексе, и в рабочей папке: он должен быть в обоих списках."
  - name: rename-old-name
    kind: edge-case
    explanation: "У переименования в список попадает вся запись «старое -> новое». Нужно только новое имя: именно оно будет в коммите."
  - name: quotes-kept
    kind: common-mistake
    explanation: "Имя файла с пробелом возвращается вместе с кавычками, которые Git добавляет только в выводе. Настоящее имя файла — без них."
