order: 2
title: "Что покажет разбор строк git status"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [git status, slice, индекс, строки]
show: [tests/snippet.js]
hints:
  - "Направление: код разбирает строки формата git status --short. Первые два символа — код, потом пробел, потом имя. Первый символ кода показывает индекс."
  - "Шаг: переменная staged истинна, если первый символ кода — не пробел и не вопросительный знак. Для строки \" M src/cart.js\" первый символ пробел, значит staged ложна."
  - "Почти решение: первые четыре строки печатают имя и true или false. Пятая строка проверяет равенство кода значению \"MM\". Шестая оборачивает код в квадратные скобки, пробел внутри сохраняется."
wrong:
  - name: first-half
    kind: partial
    explanation: "Верны только три первых элемента. Предсказать нужно все шесть вызовов console.log, а цикл печатает четыре строки."
  - name: all-staged
    kind: common-mistake
    explanation: "Для всех четырёх файлов ответ true означает, что учитывалось только наличие изменений. Но ` M` — это изменение в рабочей папке, оно не в индексе, и вопросительные знаки ?? тоже не индекс."
  - name: lost-space
    kind: edge-case
    explanation: "В последней строке потерян пробел внутри скобок: [M] вместо [ M]. slice(0, 2) берёт два символа, и пробел — один из них."
