order: 5
title: "Тесты для проверки правил .gitignore"
type: write-tests
role: main
difficulty: 4
minutes: 25
language: js
tags: [тесты, gitignore, граничные случаи, пути]
show: [subject/index.js]
hints:
  - "Направление: для каждого вида правила (папка, расширение, имя файла) проверьте и случай «подходит», и случай «похоже, но не подходит». Ошибки обычно прячутся в похожих именах и во вложенных папках."
  - "Шаг: какие файлы нельзя терять из репозитория, хотя название похоже на игнорируемое? Подумайте про .env.example при правиле .env и про changelog при правиле *.log. И проверьте папку на втором-третьем уровне вложенности."
  - "Почти решение: нужны проверки shouldIgnore(\".env.example\", [\".env\"]) → false, shouldIgnore(\"changelog\", [\"*.log\"]) → false и shouldIgnore(\"packages/app/node_modules/lib.js\", [\"node_modules/\"]) → true."
mutants:
  - name: substring-name
    description: "Правило-имя файла проверяется как «имя содержит правило». Правило .env начинает игнорировать файл .env.example, который как раз нужно хранить в репозитории."
  - name: top-level-only
    description: "Правило-папка проверяется только для первой папки пути. Вложенная папка node_modules внутри пакета перестаёт игнорироваться."
  - name: extension-without-dot
    description: "Правило *.log превращено в проверку «имя заканчивается на log» без точки. Файл changelog, в котором нет расширения .log, ошибочно игнорируется."
wrong:
  - name: happy-path-only
    kind: partial
    explanation: "Проверены только очевидные случаи: файл в игнорируемой папке в корне, точное имя, расширение и обычный файл. Ни похожие имена, ни вложенные папки не проверены, поэтому все три ошибки остаются незамеченными."
  - name: no-lookalikes
    kind: edge-case
    explanation: "Тесты проверяют вложенную папку, но не проверяют похожие имена вроде .env.example и changelog. Ошибки со склейкой «содержит» и с потерянной точкой остаются незамеченными."
  - name: root-level-only
    kind: common-mistake
    explanation: "Тесты проверяют похожие имена, но все пути лежат в корне проекта. Ошибка, при которой вложенная папка не игнорируется, проходит незамеченной."
