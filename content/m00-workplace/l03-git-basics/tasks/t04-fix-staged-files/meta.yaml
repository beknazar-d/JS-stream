order: 4
title: "Баг: в списке «войдёт в коммит» лишние файлы"
type: fix-bug
role: main
difficulty: 3
minutes: 15
language: js
tags: [git status, индекс, строки, циклы, массивы]
hints:
  - "Направление: сейчас функция смотрит на второй символ кода, а он описывает рабочую папку. В индексе то, что записано в первом символе."
  - "Шаг: первый символ кода — code[0]. Файл в индексе, если этот символ не пробел и не вопросительный знак. Для кода MM первый символ M, и такой файл тоже попадёт в коммит."
  - "Почти решение: замените code[1] на code[0] в обоих сравнениях."
wrong:
  - name: only-modified
    kind: partial
    explanation: "Учитывается только код «M » (изменён и добавлен в индекс). Новые файлы (A), удалённые (D) и переименованные (R), тоже находящиеся в индексе, теряются."
  - name: skips-mm
    kind: edge-case
    explanation: "Файл с кодом MM пропускается: проверяется весь код целиком, и требуется, чтобы второй символ был пробелом. Но в индексе у MM есть изменения, и они войдут в коммит."
  - name: includes-untracked
    kind: common-mistake
    explanation: "Проверяется только, что первый символ не пробел. Тогда файлы с кодом ?? (неотслеживаемые) попадают в список, хотя в индексе их нет."
