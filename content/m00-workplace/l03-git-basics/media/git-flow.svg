<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="15" fill="currentColor">
  <title id="t">Путь изменения в Git: от файла до GitHub</title>
  <desc id="d">Четыре блока слева направо: рабочая папка, индекс, история коммитов на вашем компьютере и GitHub. Между блоками команды: git add переносит изменения в индекс, git commit записывает их в историю, git push отправляет историю на GitHub.</desc>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <rect x="10" y="60" width="130" height="84" rx="10"/>
    <rect x="175" y="60" width="130" height="84" rx="10"/>
    <rect x="340" y="60" width="130" height="84" rx="10"/>
    <rect x="505" y="60" width="125" height="84" rx="10" stroke-dasharray="6 4"/>
    <path d="M140 102 H175 M305 102 H340 M470 102 H505"/>
    <path d="M168 96 L175 102 L168 108 M333 96 L340 102 L333 108 M498 96 L505 102 L498 108"/>
    <path d="M340 24 H505" opacity="0"/>
  </g>

  <g text-anchor="middle">
    <text x="75" y="44" font-weight="700">Рабочая папка</text>
    <text x="240" y="44" font-weight="700">Индекс</text>
    <text x="405" y="44" font-weight="700">История</text>
    <text x="567" y="44" font-weight="700">GitHub</text>

    <text x="75" y="98">ваши файлы</text>
    <text x="75" y="120" font-size="13" opacity="0.8">вы их правите</text>
    <text x="240" y="98">коробка</text>
    <text x="240" y="120" font-size="13" opacity="0.8">что войдёт в коммит</text>
    <text x="405" y="98">коммиты</text>
    <text x="405" y="120" font-size="13" opacity="0.8">снимки проекта</text>
    <text x="567" y="98">копия в сети</text>
    <text x="567" y="120" font-size="13" opacity="0.8">для резерва и команды</text>

    <text x="157" y="172" font-family="ui-monospace, monospace" font-size="14">git add</text>
    <text x="322" y="172" font-family="ui-monospace, monospace" font-size="14">git commit</text>
    <text x="487" y="172" font-family="ui-monospace, monospace" font-size="14">git push</text>
    <path d="M157 160 V112 M322 160 V112 M487 160 V112" stroke="currentColor" stroke-width="1" opacity="0.5"/>

    <text x="320" y="228" font-size="14" opacity="0.85">git status показывает, на каком из этих мест сейчас каждый файл</text>
  </g>
</svg>
