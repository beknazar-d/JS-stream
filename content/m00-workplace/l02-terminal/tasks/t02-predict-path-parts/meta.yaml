order: 2
title: "Из чего состоит путь"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [пути, split, join, массивы, индексы]
show: [tests/snippet.js]
hints:
  - "Направление: split(\"/\") режет строку по каждой косой черте. Если строка начинается с косой черты, первым элементом будет пустая строка."
  - "Шаг: нумерация элементов начинается с нуля. Последний элемент имеет номер длина минус один. slice(0, 3) берёт элементы с номерами 0, 1 и 2."
  - "Почти решение: у пути из четырёх папок пять частей, первая пустая. Метод join(\"/\") склеивает части обратно, и пустая первая часть даёт косую черту в начале."
wrong:
  - name: first-half
    kind: partial
    explanation: "Верны только три первых элемента. Предсказать нужно все шесть вызовов console.log."
  - name: counts-slashes
    kind: common-mistake
    explanation: "В первой строке ответ 4 означает, что считались только папки. Но split(\"/\") даёт ещё и пустую часть перед первой косой чертой, поэтому частей пять."
  - name: no-empty-start
    kind: edge-case
    explanation: "В четвёртой строке ответ «home/anna» потерял начальную косую черту. Пустая первая часть тоже входит в slice(0, 3), поэтому join даёт «/home/anna»."
