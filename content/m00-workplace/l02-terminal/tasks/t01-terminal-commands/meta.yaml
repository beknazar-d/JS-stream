order: 1
title: "Пять команд терминала по памяти"
type: recall
role: warmup
difficulty: 1
minutes: 5
language: js
tags: [терминал, pwd, ls, cd, mkdir, node]
hints:
  - "Направление: вспомните таблицу команд из урока. Каждая команда — одно слово и, возможно, имя папки или файла через пробел."
  - "Шаг: «где я» — три буквы, «что здесь» — две буквы, «создать папку» — mkdir и имя, «подняться» — cd и две точки через пробел, «запустить» — node и путь к файлу."
  - "Почти решение: pwd, ls, mkdir reports, cd .. и node src/index.js — все буквы строчные."
wrong:
  - name: three-of-five
    kind: partial
    explanation: "Заполнены только три команды из пяти. Остальные константы остались пустыми, а тест проверяет каждую."
  - name: no-spaces
    kind: common-mistake
    explanation: "В команде подъёма написано cd.. без пробела. В macOS и Linux такая команда не найдётся: терминал ищет программу cd.., а не команду cd с аргументом."
  - name: uppercase
    kind: edge-case
    explanation: "Команды написаны заглавными буквами. На macOS и Linux регистр важен: PWD и LS не существуют, есть только pwd и ls."
