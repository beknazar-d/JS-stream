order: 6
title: "Разбор вывода ls -la: папки, файлы, размер"
type: implement
role: real
difficulty: 4
minutes: 30
language: js
tags: [вывод терминала, ls, split, циклы, массивы, объекты, Number]
hints:
  - "Направление: вывод — многострочный текст. Режьте его по переводам строки на строки, а каждую строку — по пробелам на поля. Между полями бывает несколько пробелов, поэтому после split(\" \") останутся пустые куски: оставьте только непустые."
  - "Шаг: у строки с файлом девять полей: права, ссылки, владелец, группа, размер, месяц, число, время, имя. Имя с пробелами занимает все поля, начиная с восьмого: fields.slice(8).join(\" \"). Первый символ первого поля d значит «папка». Строку «total ...» и пустую строку пропустите по числу полей, а «.» и «..» — по имени."
  - "Почти решение: for (const line of output.split(\"\\n\")) { собрать fields из непустых кусков; if (fields.length < 9) continue; const name = fields.slice(8).join(\" \"); if (name === \".\" || name === \"..\") continue; если fields[0].startsWith(\"d\") — folders.push(name), иначе files.push(name) и totalBytes = totalBytes + Number(fields[4]); }"
wrong:
  - name: dots-included
    kind: edge-case
    explanation: "Записи «.» и «..» попали в список папок. Это ссылки на текущую папку и на папку выше, содержимым проекта они не являются. Их нужно пропускать по имени."
  - name: folder-sizes
    kind: common-mistake
    explanation: "В общий размер добавлены размеры папок. Но 4096 байт у папки в ls -l — размер самой записи папки, а не её содержимого. Складывать нужно только размеры файлов."
  - name: cuts-spaces
    kind: partial
    explanation: "Имя берётся как одно поле. Папка «price lists» превращается в «price», потому что пробел разрезал имя на два слова. Имя — это все поля, начиная с восьмого, склеенные пробелом."
