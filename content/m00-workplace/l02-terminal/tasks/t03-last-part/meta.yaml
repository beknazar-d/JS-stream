order: 3
title: "Имя файла или папки в конце пути"
type: implement
role: warmup
difficulty: 2
minutes: 12
language: js
tags: [пути, split, Windows, строки, циклы]
hints:
  - "Направление: сначала приведите оба разделителя к одному. Потом режьте по нему и берите последнюю непустую часть."
  - "Шаг: path.split(\"\\\\\").join(\"/\") заменяет обратные косые черты на прямые. После split(\"/\") в массиве могут быть пустые строки: они появляются от косой черты в начале и в конце. Пройдите циклом и запоминайте каждую непустую часть."
  - "Почти решение: let last = \"\"; for (const part of parts) { if (part !== \"\") { last = part; } } return last;"
wrong:
  - name: unix-only
    kind: partial
    explanation: "Функция режет только по прямой косой черте. Windows-путь C:\\Users\\anna\\shop не содержит прямых косых черт, поэтому возвращается целиком, а не последняя папка."
  - name: trailing-slash
    kind: edge-case
    explanation: "Берётся последний элемент массива без проверки на пустоту. Если путь заканчивается косой чертой, как /home/anna/shop/, последний элемент пустой, и функция возвращает пустую строку вместо shop."
  - name: first-part
    kind: common-mistake
    explanation: "Возвращается первая непустая часть пути, а не последняя. Для /home/anna/shop/src/index.js получится home вместо index.js. Нужно запоминать каждую следующую непустую часть, а не только первую."
