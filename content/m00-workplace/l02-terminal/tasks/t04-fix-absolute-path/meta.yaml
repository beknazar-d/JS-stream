order: 4
title: "Баг: путь Windows считается относительным"
type: fix-bug
role: main
difficulty: 3
minutes: 15
language: js
tags: [пути, Windows, абсолютный путь, строки]
hints:
  - "Направление: сейчас функция знает только один признак абсолютного пути — косая черта в начале. А как начинается путь на Windows?"
  - "Шаг: путь Windows начинается с буквы диска, двоеточия и косой черты (прямой или обратной). Сравнить символ с буквой можно так: буква не меньше \"A\" и не больше \"Z\" после перевода в верхний регистр (toUpperCase)."
  - "Почти решение: проверьте, что path.slice(1, 2) равно \":\", что path.slice(2, 3) равно \"\\\\\" или \"/\" и что path.slice(0, 1).toUpperCase() лежит между \"A\" и \"Z\"."
wrong:
  - name: only-c-drive
    kind: partial
    explanation: "Функция узнаёт только диск C. Пути на других дисках, например D:\\data, по-прежнему считаются относительными. Буква диска может быть любой."
  - name: any-colon
    kind: edge-case
    explanation: "Любой путь с двоеточием объявлен абсолютным. Но относительное имя файла вроде notes:draft.txt содержит двоеточие и абсолютным не является. Признак — двоеточие именно второй символом, после одной буквы."
  - name: not-dot
    kind: common-mistake
    explanation: "Функция считает абсолютным всё, что не начинается с точки. Тогда относительный путь src/index.js, который не начинается с точки, тоже становится абсолютным."
