order: 6
title: "Хаб событий доставки"
type: implement
role: real
difficulty: 4
minutes: 35
language: js
tags: [this, call, bind, события, замыкания, неясности]
hints:
  - "Направление: хабу нужно хранить подписки по именам событий. Каждая подписка — это обработчик и необязательный контекст. Состояние держите в замыкании, а не в this: тогда методы можно доставать из объекта."
  - "Шаг: заведите const subscriptions = new Map() от имени события к массиву записей { handler, context }. on добавляет запись и возвращает off, который убирает именно её. emit берёт копию массива и вызывает handler.apply(context, args)."
  - "Почти решение: в emit пройдите по [...list], потому что обработчик может отписать сам себя. В off удаляйте запись по индексу через indexOf и splice, но только если она ещё в списке (повторный off ничего не делает)."
wrong:
  - name: no-context
    kind: partial
    explanation: "Обработчики вызываются как простые функции, контекст из третьего аргумента on игнорируется. Метод объекта, подписанный с контекстом, падает на this."
  - name: skips-on-self-off
    kind: edge-case
    explanation: "emit идёт по живому массиву подписок, а off вырезает запись из него. Если обработчик отписал сам себя во время emit, следующий обработчик пропускается и не получает событие."
  - name: uses-this
    kind: common-mistake
    explanation: "Подписки хранятся в this.handlers объекта-хаба. Пока методы вызывают как hub.on(...), всё работает, но на const { on, emit } = hub this теряется и хаб падает. Хаб должен хранить состояние в замыкании."
