order: 4
title: "Подсказки адреса: только свежий запрос"
type: implement
role: main
difficulty: 3
minutes: 25
language: js
tags: [AbortController, отмена запросов, гонка, подсказки, неясности]
hints:
  - "Направление: вам нужно помнить контроллер предыдущего вызова между вызовами suggest. Где в замыкании его хранить?"
  - "Шаг: в начале suggest отмените предыдущий контроллер, создайте новый для этого вызова и запомните его. Новый контроллер нужен на каждый вызов: отменённый сигнал заново включить нельзя."
  - "Почти решение: после await load(query, controller.signal) вызовите controller.signal.throwIfAborted(). Метод бросает signal.reason, если сигнал уже отменён, и вы получаете AbortError, даже когда load сигнал проигнорировал."
wrong:
  - name: counter-no-abort
    kind: race
    explanation: "Устаревший ответ отбрасывается по номеру вызова, но запрос не отменяется. Старый запрос продолжает работать, а его промис отклоняется только тогда, когда ответ наконец придёт. Если геокодер ответит медленно, пользователь ждёт, а сервер нагружен. Сигнал надо отменять сразу, в момент нового вызова."
  - name: shared-controller
    kind: common-mistake
    explanation: "Один контроллер на все вызовы. После первого abort его сигнал отменён навсегда, и каждый следующий запрос стартует уже отменённым. Для каждого вызова нужен свой контроллер."
  - name: no-throw
    kind: edge-case
    explanation: "Сигнал отменяется, но после await не проверяется. Если load не слушает сигнал и всё же отвечает, промис устаревшего вызова выполняется со старыми данными вместо AbortError."
