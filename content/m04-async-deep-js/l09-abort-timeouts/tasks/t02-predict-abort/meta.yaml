order: 2
title: "Что выведет отмена запроса"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [AbortController, signal.reason, event loop, порядок вывода]
show: [tests/snippet.js]
hints:
  - "Направление: вызов controller.abort() синхронный. Подписчики события abort запускаются внутри него, до следующей строки кода."
  - "Шаг: отказ промиса обрабатывается в микрозадаче, то есть после того, как закончился весь синхронный код. Таймер с нулевой задержкой срабатывает ещё позже. Повторный abort сигнал уже не меняет."
  - "Почти решение: первые три строки идут подряд: false, событие abort, true. Потом AbortError, и только после слова «конец» появляется строка про отказ."
wrong:
  - name: only-start
    kind: partial
    explanation: "Заполнена только синхронная часть. Строки после слова «конец» (отказ промиса и вывод из таймера) пропущены, хотя код их выводит."
  - name: reject-early
    kind: common-mistake
    explanation: "Строка «отказ: AbortError» стоит до слова «конец». Но обработчик catch выполняется в микрозадаче, после всего синхронного кода, поэтому «конец» выводится раньше."
  - name: reason-changes
    kind: edge-case
    explanation: "Последняя строка равна «Error». Но сигнал отменяется один раз: второй abort с другой причиной игнорируется, и reason остаётся прежним (AbortError)."
