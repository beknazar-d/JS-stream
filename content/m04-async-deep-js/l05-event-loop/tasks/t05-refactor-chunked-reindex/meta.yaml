order: 5
title: "Переиндексация каталога без заморозки страницы"
type: refactor
role: main
difficulty: 3
minutes: 25
language: js
tags: [event loop, setTimeout, блокировка потока, рефакторинг, разбиение на части]
hints:
  - "Направление: переиндексация должна обрабатывать не весь каталог сразу, а часть за один заход, а следующую часть ставить отдельной задачей. Тогда между частями event loop успевает обработать клики и таймеры. Результат функции становится промисом."
  - "Шаг: заведите позицию внутри вызова (не в переменной модуля). Один заход обрабатывает товары от позиции до позиции плюс chunkSize. Если товары остались, поставьте следующий заход через setTimeout с нулём, иначе выполните resolve с числом обработанных товаров. Ошибку обработчика передайте в reject."
  - "Почти решение: return new Promise((resolve, reject) => { let position = 0; function runChunk() { try { const end = Math.min(position + chunkSize, products.length); for (; position < end; position++) indexProduct(products[position]); } catch (error) { reject(error); return; } if (position < products.length) setTimeout(runChunk, 0); else resolve(position); } runChunk(); });"
wrong:
  - name: shared-position
    kind: race
    explanation: "Позиция хранится в переменной модуля. Если переиндексацию запустят для двух каталогов одновременно (склад и магазин), вызовы портят позицию друг другу: часть товаров пропускается, часть обрабатывается дважды. Состояние должно жить внутри каждого вызова."
  - name: microtask-chain
    kind: common-mistake
    explanation: "Следующая часть ставится через Promise.resolve().then. Это микрозадачи: event loop выполняет их все подряд и не доходит до очереди задач. Страница по-прежнему замирает, а таймеры и события ждут конца переиндексации. Для передачи управления нужен setTimeout."
  - name: drops-tail
    kind: edge-case
    explanation: "Неполная последняя часть теряется. Из 250 товаров при chunkSize 100 обрабатываются только 200, а из 30 товаров не обрабатывается ни один, потому что условие требует полной части."
