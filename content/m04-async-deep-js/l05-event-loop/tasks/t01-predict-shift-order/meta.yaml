order: 1
title: "Что выведет код начала смены"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [event loop, микрозадачи, setTimeout, порядок вывода]
show: [tests/snippet.js]
hints:
  - "Направление: разделите вызовы на три группы: синхронный код, микрозадачи и задачи. Сначала идёт всё синхронное, потом все микрозадачи, потом таймер."
  - "Шаг: queueMicrotask и then попадают в одну очередь микрозадач в том порядке, в каком они поставлены. Второй then ставится в очередь только после того, как отработал первый, но всё равно до таймера."
  - "Почти решение: старт, конец, журнал, склад, курьер, таймер."
wrong:
  - name: sync-only
    kind: partial
    explanation: "Записаны только две синхронные строки. Но таймер и микрозадачи тоже что-то выводят: предсказать нужно весь вывод до последней строки."
  - name: timer-first
    kind: common-mistake
    explanation: "Таймер стоит в коде раньше микрозадач, и кажется, что он выведется раньше. Но таймер это задача, а микрозадачи выполняются все сразу после синхронного кода, до любой задачи."
  - name: chain-split
    kind: edge-case
    explanation: "Строка «курьер» поставлена после таймера. Но второй then выполняется как микрозадача, добавленная первой, и event loop опустошает микрозадачи полностью, прежде чем взять таймер."
