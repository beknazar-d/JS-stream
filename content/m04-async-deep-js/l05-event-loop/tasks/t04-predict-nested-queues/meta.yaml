order: 4
title: "Что выведет код с вложенными таймерами"
type: predict
role: main
difficulty: 3
minutes: 12
language: js
tags: [event loop, микрозадачи, вложенные таймеры, порядок вывода]
show: [tests/snippet.js]
hints:
  - "Направление: ведите две очереди на бумаге: микрозадачи и задачи. После синхронного кода опустошите микрозадачи полностью. Потом возьмите ровно одну задачу, и снова проверьте микрозадачи."
  - "Шаг: таймер, поставленный из then, встаёт в очередь задач после двух уже стоящих таймеров с нулём. Микрозадача, созданная внутри таймера 1, выполняется сразу после него, до таймера 2. Таймер на 20 мс сработает последним."
  - "Почти решение: начало, конец, then 1, then 2, таймер 1, then в таймере 1, таймер 2, таймер из then, таймер 3 (20 мс)."
wrong:
  - name: without-timers
    kind: partial
    explanation: "Записан вывод только синхронного кода и микрозадач, а все пять таймеров пропущены. Код выводит девять строк: задачи из очереди тоже выполняются, просто позже."
  - name: microtask-after-timers
    kind: common-mistake
    explanation: "Строки then 1 и then 2 стоят после таймеров. Но then это микрозадачи: они выполняются сразу после синхронного кода, до первой задачи, даже если таймер поставлен в коде раньше."
  - name: flat-timers
    kind: edge-case
    explanation: "Строка «then в таймере 1» стоит после таймера 2. Микрозадача, созданная внутри таймера, выполняется сразу после этого таймера, до следующей задачи. Event loop проверяет микрозадачи после каждой задачи."
