order: 3
title: "Скидка по промокоду всегда 0%"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [setTimeout, колбэки, event loop, исправить баг]
hints:
  - "Направление: колбэк onReady вызывается сразу, а переменная percent заполняется позже, в таймере. Подумайте, в каком порядке это происходит."
  - "Шаг: вызов onReady должен находиться там же, где вычисляется скидка, то есть внутри функции, переданной в setTimeout."
  - "Почти решение: setTimeout(() => { onReady(DISCOUNTS[code] ?? 0); }, 0); и никаких вызовов onReady снаружи."
wrong:
  - name: double-call
    kind: partial
    explanation: "Правильный вызов добавлен в таймер, но старый вызов onReady(0) остался снаружи. Колбэк вызывается дважды: сначала с нулём, потом со скидкой, и интерфейс успевает показать 0%."
  - name: unknown-code
    kind: edge-case
    explanation: "Для неизвестного промокода в onReady приходит undefined, потому что нет запасного значения. Интерфейс покажет «undefined%» вместо 0%."
  - name: sync-call
    kind: common-mistake
    explanation: "Скидка передаётся сразу, без таймера. Значение верное, но колбэк вызывается синхронно, а у функции в ТЗ единый асинхронный контракт: колбэк приходит всегда позже, как при настоящей загрузке с сервера."
