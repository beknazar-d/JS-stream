order: 6
title: "Пакетная отправка уведомлений"
type: implement
role: real
difficulty: 4
minutes: 35
language: js
tags: [event loop, queueMicrotask, батчинг, уведомления, неясности]
hints:
  - "Направление: нужны накопитель (массив) и признак «отправка уже запланирована». Первое уведомление в серии планирует отправку, остальные просто добавляются в накопитель. Для планирования подходит очередь микрозадач."
  - "Шаг: в отправке сначала возьмите накопленный массив и замените накопитель пустым, снимите признак планирования, и только потом вызовите sendBatch. Тогда уведомления, добавленные внутри sendBatch, попадут в следующую пачку."
  - "Почти решение: let batch = []; let scheduled = false; function flush() { scheduled = false; const items = batch; batch = []; sendBatch(items); } return function add(n) { batch.push(n); if (!scheduled) { scheduled = true; queueMicrotask(flush); } };"
wrong:
  - name: no-batching
    kind: partial
    explanation: "Каждое уведомление уходит отдельным вызовом sendBatch с массивом из одного элемента. Заказ из 20 позиций снова порождает 20 сообщений, а нужно одно."
  - name: lost-in-flush
    kind: race
    explanation: "Накопитель очищается и признак планирования снимается после sendBatch. Если во время отправки приходит новое уведомление, оно попадает в старый массив и затем стирается, либо не планирует отправку, потому что отправка ещё считается запланированной. Такое уведомление теряется."
  - name: timer-batch
    kind: common-mistake
    explanation: "Отправка запланирована через setTimeout. Пачка уходит только в следующей задаче, а не в ближайшей микрозадаче. Уведомления, добавленные в разных микрозадачах, склеиваются в одну пачку, и сообщение клиенту приходит позже, чем нужно."
