order: 6
title: "Склад: резервы под заказы"
type: implement
role: real
difficulty: 4
minutes: 35
language: js
tags: [замыкания, приватное состояние, копирование, склад, неясности]
hints:
  - "Направление: вам нужны два вида состояния в замыкании: остатки по артикулам и список выданных резервов. Начните с копии остатков, чтобы не трогать объект, который передал вызывающий код."
  - "Шаг: остатки — объект stock, скопированный через { ...initialStock }. Резервы — Map от id к { sku, qty }. reserve проверяет артикул и количество, уменьшает остаток и записывает резерв. release находит резерв, возвращает остаток и удаляет запись."
  - "Почти решение: в release сначала reservations.get(id); если записи нет, верните false; иначе stock[sku] += qty, reservations.delete(id), верните true. Тогда повторный release вернёт false. id берите из счётчика nextId в замыкании."
wrong:
  - name: no-release
    kind: partial
    explanation: "Резервы создаются, но снять резерв нельзя: метода release нет. Отмена заказа оставляет товар «замороженным» навсегда."
  - name: double-release
    kind: edge-case
    explanation: "Запись о резерве не удаляется после release. Повторный release возвращает товар на склад второй раз, и остаток становится больше, чем было на самом деле."
  - name: mutates-input
    kind: common-mistake
    explanation: "Склад работает прямо с объектом initialStock, который ему передали. Резервы меняют чужой объект, а правка снаружи ломает остатки склада. Нужна копия в момент создания."
