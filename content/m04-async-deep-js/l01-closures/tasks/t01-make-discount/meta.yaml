order: 1
title: "Фабрика скидок по купону"
type: recall
role: warmup
difficulty: 1
minutes: 8
language: js
tags: [замыкания, фабрика функций]
hints:
  - "Направление: makeDiscount должна вернуть функцию. Процент нужно получить один раз, а цену функция получит при вызове."
  - "Шаг: внутри makeDiscount напишите return (price) => ... Процент доступен там как обычная переменная из внешней функции."
  - "Почти решение: return (price) => Math.round((price * (100 - percent)) / 100);"
wrong:
  - name: unfinished
    kind: partial
    explanation: "Фабрика возвращает функцию, но та отдаёт цену без изменений: процент нигде не используется. Скидка 10% должна превращать 1000 в 900."
  - name: no-rounding
    kind: edge-case
    explanation: "Результат не округляется. Для скидки 15% на цену 999 получается 849.15 вместо целого рубля 849. Суммы заказа должны быть целыми."
  - name: shared-percent
    kind: common-mistake
    explanation: "Процент записан в переменную модуля, а не взят из окружения вызова. Вторая фабрика затирает процент первой, и обе скидки считаются по последнему купону."
