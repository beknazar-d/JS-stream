order: 3
title: "Баг: все заказы получают номер ORD-0001"
type: fix-bug
role: warmup
difficulty: 2
minutes: 10
language: js
tags: [замыкания, баг, область видимости]
hints:
  - "Направление: где объявлена переменная last и сколько раз она создаётся? Подумайте, что происходит с локальной переменной в конце вызова функции."
  - "Шаг: last должна жить в окружении createNumbering, а не внутри функции nextNumber. Тогда она создаётся один раз на счётчик."
  - "Почти решение: перенесите строку let last = 0 на одну функцию выше: между createNumbering и return."
wrong:
  - name: shared-counter
    kind: common-mistake
    explanation: "Переменная вынесена наружу, в модуль. Нумерация заказов и нумерация возвратов начинают делить один счётчик, и номера возвратов «перепрыгивают» через номера заказов."
  - name: no-padding
    kind: partial
    explanation: "Счётчик работает, но номера выходят как ORD-1, ORD-2. По тикету нужны четыре цифры с ведущими нулями: ORD-0001."
  - name: fixed-zeros
    kind: edge-case
    explanation: "К числу всегда дописаны три нуля. Для первых девяти номеров всё верно, но десятый получает ORD-00010 вместо ORD-0010."
