order: 5
title: "Тесты для кэша стоимости доставки"
type: write-tests
role: main
difficulty: 3
minutes: 20
language: js
tags: [тесты, замыкания, мемоизация, кэш]
show: [subject/index.js]
hints:
  - "Направление: смысл кэша в том, что исходная функция вызывается реже. Поэтому проверять нужно не только ответ, но и сколько раз исходную функцию вызвали. Для этого пригодится мок-функция fn."
  - "Шаг: сделайте const calc = fn((x) => x * 2) и передайте её в memoize. После нескольких вызовов проверьте expect(calc).toHaveBeenCalledTimes(...). Придумайте ещё случаи: чередование аргументов, результат 0, два разных memoize с одним аргументом."
  - "Почти решение: нужны тесты на повтор одного аргумента, на чередование 2, 3, 2, на функцию, которая возвращает 0 (должна вызваться один раз), и на две мемоизированные функции с одним и тем же аргументом."
mutants:
  - name: truthy-check
    description: "Кэш проверяется через if (cache.get(arg)). Результат 0 считается «пустым» и вычисляется заново при каждом вызове."
  - name: last-only
    description: "Запоминается только последний аргумент. При чередовании 2, 3, 2 исходная функция вызывается трижды вместо двух."
  - name: shared-cache
    description: "Кэш объявлен на уровне модуля, а не внутри memoize. Две разные мемоизированные функции делят результаты по аргументу."
wrong:
  - name: single-function
    kind: partial
    explanation: "Тесты проверяют счёт вызовов и чередование, но всегда на одной функции. Общий кэш на уровне модуля не заметен, пока в игре одна функция."
  - name: no-falsy
    kind: edge-case
    explanation: "Нет теста с результатом 0 или пустой строкой. Мутант, который проверяет кэш через if (cache.get(arg)), проходит незамеченным: все привычные результаты истинные."
  - name: values-only
    kind: common-mistake
    explanation: "Тесты сравнивают только значения, которые вернула функция. Но кэш и не должен менять ответы, он должен сокращать число вызовов. Все три мутанта возвращают верные значения и проходят."
