order: 2
title: "Что выведут два счётчика"
type: predict
role: warmup
difficulty: 2
minutes: 8
language: js
tags: [замыкания, окружение, предсказание]
show: [tests/snippet.js]
hints:
  - "Направление: сколько раз вызван makeCounter? Столько окружений и создано. Для каждого вызова посчитайте переменную value отдельно."
  - "Шаг: byOne и byTen — разные счётчики. Переменная alias — не новый счётчик, а второе имя для той же функции. Вызов makeCounter(1)() создаёт совсем новый."
  - "Почти решение: 1, 2, 10, потом сумма двух следующих значений (3 и 20), потом четвёртый вызов byOne, и в конце новый счётчик с первым значением."
wrong:
  - name: only-first-half
    kind: partial
    explanation: "Верно только начало, остальные строки не заполнены. Нужно предсказать каждый вызов console.log, а не только первые три."
  - name: shared-counter
    kind: common-mistake
    explanation: "Здесь все три счётчика считаются одной общей переменной (в третьей строке 12 вместо 10). Но каждый вызов makeCounter создаёт своё окружение со своим value."
  - name: fresh-continues
    kind: edge-case
    explanation: "В последней строке ответ 5: будто новый счётчик продолжает чужое значение. Вызов makeCounter(1) создаёт новое окружение, и первый вызов даёт 1."
