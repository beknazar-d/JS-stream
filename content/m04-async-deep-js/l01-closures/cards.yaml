- id: closure-def
  front: Что такое замыкание (closure)?
  back: "Функция вместе с переменными из места, где она создана. Функция помнит их, даже когда внешняя функция уже завершилась."
- id: factory
  front: Что такое фабрика функций?
  back: "Функция, которая возвращает новую функцию. Каждый вызов фабрики создаёт отдельное окружение со своими переменными."
- id: private-state
  front: Как сделать данные недоступными снаружи без классов?
  back: "Объявить переменную внутри фабрики и вернуть только методы, которые с ней работают. Снаружи переменной не видно."
- id: independent
  front: Делят ли два счётчика из двух вызовов makeCounter одну переменную?
  back: "Нет. Каждый вызов makeCounter создаёт своё окружение со своей переменной."
- id: state-inside
  front: Что будет, если объявить let last = 0 внутри возвращаемой функции, а не в фабрике?
  back: "Переменная создаётся заново при каждом вызове, поэтому счётчик всегда начинается с нуля."
  answer: "с нуля"
- id: module-var
  front: Что случится, если состояние фабрики вынести в переменную модуля?
  back: "Все функции из фабрики будут делить одно значение и мешать друг другу."
- id: leak
  front: Чем опасно вернуть из метода внутренний массив как есть?
  back: "Снаружи его можно изменить, и приватное состояние перестанет быть приватным. Возвращайте копию: [...lines]."
- id: memo
  front: Как устроена мемоизация (memoization)?
  back: "Фабрика создаёт Map для результатов. Возвращаемая функция сначала смотрит в Map через has, при промахе считает и записывает."
- id: has-vs-truthy
  front: Почему в кэше проверяют cache.has(arg), а не if (cache.get(arg))?
  back: "Результат может быть ложным: 0, пустая строка, false. Проверка через get пересчитывала бы такие значения каждый раз."
- id: not-defined
  front: Какая ошибка будет при чтении приватной переменной замыкания снаружи?
  back: "ReferenceError: last is not defined. Если читаете свойство объекта, получите undefined."
